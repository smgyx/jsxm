<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
html,body{margin:0;padding:0;background:transparent}
.optbar{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.opt{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#1d2029,#232734);border:1px solid #313648;border-left:3px solid #53d8ff;border-radius:10px;padding:10px 12px;font-size:13px;color:#e8eaf0;cursor:pointer;user-select:none;transition:border-color .15s,transform .1s,filter .15s}
.opt:active{transform:scale(.985);border-left-color:#ff5c8a;filter:brightness(1.15)}
.opt .n{flex:none;font-style:normal;font-size:11px;font-weight:700;color:#53d8ff;background:rgba(83,216,255,.12);border-radius:6px;padding:2px 7px;min-width:26px;text-align:center}
</style>
</head>
<body style="display:none">
<div id="optbar-app"></div>
<script>
(function(){
  "use strict";
  var app=document.getElementById("optbar-app");
  function safe(o,k,d){ if(o&&o[k]!==undefined&&o[k]!==null&&o[k]!=="") return o[k]; return d; }
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function sendText(text){
    var t=String(text||"").replace(/[|{}\[\]<>]/g," ").replace(/\s*\n\s*/g," ").trim();
    try{ if(typeof triggerSlash==="function"){ triggerSlash("/send "+t+" | /trigger"); return; } }catch(e){}
    try{ var ctx=window.SillyTavern&&window.SillyTavern.getContext&&window.SillyTavern.getContext(); if(ctx&&ctx.executeSlashCommandsWithOptions){ ctx.executeSlashCommandsWithOptions("/send "+t+" | /trigger"); return; } }catch(e){}
    try{ var w=window.parent||window; var ta=w.document.querySelector("#send_textarea"); if(ta&&!ta.value){ ta.value=t; ta.dispatchEvent(new Event("input",{bubbles:true})); } }catch(e){}
  }
  function readStat(){
    var tries=[];
    try{ if(window.Mvu&&typeof window.Mvu.getMvuData==="function"){ tries.push(function(){ return Promise.resolve(window.Mvu.getMvuData({type:"message",message_id:getCurrentMessageId()})).then(function(d){ return d&&d.stat_data?d.stat_data:d; }); }); } }catch(e){}
    try{ if(typeof getVariables==="function"){ tries.push(function(){ return getVariables({type:"message",message_id:getCurrentMessageId()}).then(function(v){ return v&&v.stat_data?v.stat_data:v; }); }); tries.push(function(){ return getVariables({type:"chat"}).then(function(v){ return v&&v.stat_data?v.stat_data:v; }); }); } }catch(e){}
    var chain=Promise.reject(); tries.forEach(function(t){ chain=chain.catch(t); });
    return chain.catch(function(){ return null; });
  }
  function render(d){
    var raw=safe(d,"选项",[]); var opts=Array.isArray(raw)?raw:[], h="", on=0;
    opts.forEach(function(o){ o=String(o||"").trim(); if(!o) return; on++;
      h+='<span class="opt" data-opt="'+esc(o).replace(/"/g,"&quot;")+'"><i class="n">'+(on<10?"0"+on:on)+'</i><span>'+esc(o)+'</span></span>'; });
    app.innerHTML=h?'<div class="optbar">'+h+'</div>':"";
    app.style.display=h?"block":"none";
    document.body.style.display=h?"block":"none";
  }
  var busy=false;
  function refresh(){ if(busy)return; busy=true; readStat().then(function(d){ try{ render(d); }catch(e){} busy=false; }); }
  function boot(){ if(typeof getVariables==="function"||(window.Mvu&&window.Mvu.getMvuData)){ refresh(); } else { setTimeout(boot,800); } }
  app.addEventListener("click",function(e){ var t=e.target; var op=t.closest&&t.closest(".opt"); if(op){ var ot=op.getAttribute("data-opt"); if(ot) sendText(ot); } });
  boot();
  setInterval(refresh,3000);
  try{ if(typeof eventOn==="function") eventOn("variable_updated", refresh); }catch(e){}
})();
</script>
</body>
</html>
