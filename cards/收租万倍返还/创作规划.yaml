- name: initvar
  type: MVU
  part: initvar
  path: 世界书/MVU/initvar.yaml
mvu:
  structure: "顶层结构：\n├── 世界\n│   ├── 日期（第N天，数字）\n│   ├── 时段（清晨｜上午｜中午｜下午｜傍晚｜晚上｜深夜）\n│   ├── 当前地点（区域｜场景，如 翡翠湾大别墅｜一楼大厅）\n│   │   └── 开局状态：刚买下翡翠湾大别墅，现金仅剩约3000元，名下仅此一套物业\n│   ├── 当前幕（1~5，数字）\n│   └── 天气（自由短文本）\n├── 主角\n│   ├── 姓名/年龄/性别/身高/体型/外貌/衣着（默认林野模板，开场可自定义覆写）\n│   ├── 现金（数字，可为负→触发危机事件）\n│   ├── 系统积分（数字）\n│   ├── 神豪等级（萌新房东｜包租新人｜职业房东｜地产新贵｜收租大亨｜神豪）\n│   ├── 返现倍数（数字，初始10，随等级提升）\n│   ├── 累计返利（数字，幕门槛核心指标）\n│   ├── 精力（{当前值, 上限}）\n│   ├── 体力（{当前值, 上限}）\n│   ├── 被动技能（数组：黄金瞳/商业洞察之眼/黑客精通/读心术限定版/龙精虎猛/百毒不侵）\n│   ├── 名下产业（record，动态增删：翡翠湾大别墅/星耀传媒/月牙湾山庄/…）\n│   └── 日程约定（record，动态增删）\n├── 任务\n│   ├── 当前任务（{标题, 要求, 奖励, 期限} 或空）\n│   └── 任务板（数组）\n├── 角色（动态 record，键=角色名）\n│   └── <角色名>\n│       ├── 在住（true｜false）\n│       ├── 房间（二楼东｜二楼西｜三楼东｜三楼西｜空置）\n│       ├── 好感（0~100）\n│       ├── 堕落（0~100，仅亲密回合小步更新）\n│       ├── 情绪（自由短文本）\n│       ├── 心理想法（一两句第一人称）\n│       ├── 欠租（数字）\n│       ├── 个人目标（短文本）\n│       ├── 生理期（安全期｜普通期｜排卵期｜月经期，擦边机制参考）\n│       └── 私密档案（成人机制，用户已定）\n│           ├── 初吻（未发生｜已发生）\n│           ├── 初夜（未发生｜已发生）\n│           ├── 性交次数（数字，只增不减）\n│           ├── 最近性事（第N天·时段｜无）\n│           └── 身体开发（{小嘴, 胸部, 下身, 后穴} 各0~100）\n├── 别墅\n│   ├── 口碑（0~100）\n│   ├── 设施等级（0~5）\n│   └── 空房数（0~4，初始4）\n└── 系统_（脚本管理，AI只读）\n    ├── 已触发事件（数组）\n    └── 统计（{打脸次数, 装逼评分最高, 收编数, 收租次数}）\n"
  variables:
  - path: 世界.当前幕
    type: number
    range: 1~5
    check: 只能由幕门槛结算逻辑推进（关键事件全部完成+累计返利达标），禁止跳幕
  - path: 主角.现金
    type: number
    check: 开局现金=3000积蓄+5首日房租+50000首笔万倍返现（全部身家加成）=53005；可为负触发危机事件；收租返利是唯一现金流
  - path: 世界.时段
    enum:
    - 清晨
    - 上午
    - 中午
    - 下午
    - 傍晚
    - 晚上
    - 深夜
  - path: 主角.累计返利
    type: number
    check: 幕门槛核心指标；单次返利=租金×随机倍数(1~10000，万倍为稀有好彩头)，消费返利另计；默认对照小说原生事件链结算，玩家偏离后按蝴蝶效应演化
  - path: 主角.神豪等级
    enum:
    - 萌新房东
    - 包租新人
    - 职业房东
    - 地产新贵
    - 收租大亨
    - 神豪
    check: 与累计返利挂钩升级；升级触发系统播报
  - path: 主角.被动技能
    type: z.array
    check: 龙精虎猛/百毒不侵开场首笔即解锁（对照小说）；读心术(幕二)/黄金瞳(幕二)/商业洞察之眼(幕三)/黑客精通(幕四)随后续幕追加
  - path: 角色.<角色名>.好感
    type: number
    range: 0~100
    check: 受用/帮忙+1~3，冒犯/失望-1~3，单轮±3封顶
  - path: 角色.<角色名>.堕落
    type: number
    range: 0~100
    check: 仅实质亲密回合+1~3，反感可-1~3，日常回合不动
  - path: 角色.<角色名>.私密档案.性交次数
    type: number
    check: 只增不减；每次实质性行为+1；首次+1时同步把初夜置为已发生
  - path: 角色.<角色名>.私密档案.最近性事
    type: string
    check: 格式"第N天·时段"；仅在发生回合更新，事后回合保持不变
  - path: 角色.<角色名>.私密档案.身体开发
    type: object
    fields:
      小嘴: number
      胸部: number
      下身: number
      后穴: number
    check: 各项0~100，仅性场景回合对应部位被认真对待时+1~3，只增不减；上限受该角色堕落值钳制（堕落<40时最高开发到40，依此类推）
  - path: 角色.<角色名>.私密档案.初夜
    type: string
    enum:
    - 未发生
    - 已发生
    check: 由性交次数首次+1联动写入，AI不得直接改写
  - path: 别墅.口碑
    type: number
    range: 0~100
    check: 幕四山庄业务线与结局评级引用
  special_rules: '幕门槛硬规则（阶段指导+系统播报执行，示例数值可调）：

    幕1→2：累计返利≥10万 且 神豪等级≥包租新人 且 在住租客≥3 且 平均好感≥30 且 关键事件[首次打脸,收编三人]完成

    幕2→3：累计返利≥100万 且 等级≥职业房东 且 名下产业≥1（翡翠湾别墅除外，指星耀传媒等经营性产业）且 关键事件[商战初胜,身世线索]完成

    幕3→4：累计返利≥1000万 且 等级≥地产新贵 且 名下产业≥2 且 关键事件[修路,盖房,村霸事件]完成

    幕4→5：累计返利≥1亿 且 等级≥收租大亨 且 别墅口碑≥60 且 关键事件[山庄业务线,国际线登场]完成

    行动门槛：别墅改造需现金+设施等级前置；收编新租客需空房数≥1且好感≥30；特殊亲密剧情需对应角色堕落≥40；

    被动解锁需对应幕/等级。未达标一律输出【条件未满足】播报并说明缺口。

    '
ejs:
  entries:
  - name: 阶段指导
    complexity: 段落控制
    stages:
    - name: 第一幕·起步
      condition: 'getvar(''stat_data.世界.当前幕'', { defaults: 1 }) == 1'
    - name: 第二幕·扩张
      condition: 'getvar(''stat_data.世界.当前幕'', { defaults: 1 }) == 2'
    - name: 第三幕·乡土
      condition: 'getvar(''stat_data.世界.当前幕'', { defaults: 1 }) == 3'
    - name: 第四幕·山庄
      condition: 'getvar(''stat_data.世界.当前幕'', { defaults: 1 }) == 4'
    - name: 第五幕·省城
      condition: 'getvar(''stat_data.世界.当前幕'', { defaults: 1 }) == 5'
  - name: 老城街区
    complexity: 条目显隐
    condition: 'getvar(''stat_data.世界.当前幕'', { defaults: 1 }) <= 2'
  - name: 江城商圈
    complexity: 条目显隐
    condition: 'getvar(''stat_data.世界.当前幕'', { defaults: 1 }) <= 3'
  - name: 云溪县青溪村
    complexity: 条目显隐
    condition: 'getvar(''stat_data.世界.当前幕'', { defaults: 1 }) >= 3'
  - name: 月牙湾山庄
    complexity: 条目显隐
    condition: 'getvar(''stat_data.世界.当前幕'', { defaults: 1 }) >= 4'
  - name: 钱塘市
    complexity: 条目显隐
    condition: 'getvar(''stat_data.世界.当前幕'', { defaults: 1 }) >= 5'
  - name: 苏星彤_性格调色盘
    complexity: 段落控制
    stages:
    - name: 初识期
      condition: 'getvar(''stat_data.角色.苏星彤.好感'', { defaults: 0 }) < 20'
    - name: 熟络期
      condition: 'getvar(''stat_data.角色.苏星彤.好感'', { defaults: 0 }) >= 20 && getvar(''stat_data.角色.苏星彤.好感'', { defaults: 0 }) < 45'
    - name: 贴身期
      condition: 'getvar(''stat_data.角色.苏星彤.好感'', { defaults: 0 }) >= 45 && getvar(''stat_data.角色.苏星彤.好感'', { defaults: 0 }) < 70'
    - name: 堕化期
      condition: 'getvar(''stat_data.角色.苏星彤.好感'', { defaults: 0 }) >= 70'
  - name: 宋小惠_性格调色盘
    complexity: 段落控制
    stages: 同苏星彤结构（好感阈值一致，路径替换为 角色.宋小惠.好感；身世期与堕化期重叠时以幕节点优先）
  - name: 沈嘉欣_性格调色盘
    complexity: 段落控制
    stages: 同苏星彤结构（路径替换为 角色.沈嘉欣.好感）
  - name: 陈小雯_性格调色盘
    complexity: 段落控制
    stages: 同苏星彤结构（路径替换为 角色.陈小雯.好感）
  - name: 陈小薇_性格调色盘
    complexity: 段落控制
    stages: 同苏星彤结构（路径替换为 角色.陈小薇.好感）
  - name: 林小鹿_性格调色盘
    complexity: 段落控制
    stages: 同苏星彤结构（路径替换为 角色.林小鹿.好感；未收编时整条目隐匿）
  - name: 幕后势力速览
    complexity: 条目显隐
    condition: 'getvar(''stat_data.世界.当前幕'', { defaults: 1 }) >= 3'
  - name: 突发事件与反派模板
    complexity: 条目显隐
    condition: 常驻保留，幕三起加大权重（内部段落按幕控制）
first_messages:
- format: 叙事式
  word_count: 900~1200
  output_path: 开场白/0.txt
  scene: 梅雨黄昏，翡翠湾大别墅收房当天；三个精神小妹上门求租，首笔租金触发系统绑定
  opening_situation: 按小说节奏开局：<user>收房当天，苏星彤（三色马尾，砍价）带宋小惠（软糯躲身后抱零食）、沈嘉欣（素色着装，逐条问合同条款）上门求租；砍价成交、首笔定金到账触发【叮！收租万倍返还系统绑定】播报与首笔返利；结尾接手登记引导改为：直接回复「按林野来」沿用默认身份，或报出自定义 姓名/年龄/性别/身高/体型/外貌/衣着。双胞胎与后期角色不在开场登场。
  notes: 叙事式；系统绑定发生在开场内（按小说）；主角默认林野模板；无 initvar_override
