- name: 幕后势力速览
  type: NPC
  path: 世界书/NPC/幕后势力速览.yaml
  purpose: 宋家管家与宋先生/李家管事/索科洛夫——身世线与海外线人物，按需触发
  scope: specific
- name: 阶段指导
  type: 阶段指导
  path: 世界书/阶段指导/阶段指导.yaml
  purpose: 五幕EJS段落控制——各幕主持目标、可用玩法、推进门槛、幕内关键事件；含【条件未满足】拦截提示段
- name: 突发事件与反派模板
  type: 事件
  path: 世界书/事件/突发事件与反派模板.yaml
  purpose: 钩子引擎：野生小妹收编/舔狗打脸/黑心同行/认领风波/商战流量狙击的事件模板与反派生成规则
- name: 变量列表
  type: MVU
  part: variable_list
  path: 世界书/MVU/变量列表.yaml
- name: 变量更新规则
  type: MVU
  part: update_rules
  path: 世界书/MVU/变量更新规则.yaml
