# 来源：收租万倍返还.txt 第3286-4344行，覆盖第48章至第63章
chapters:
  - name: 第48章 全城搜捕，叔的红包炸翻精神圈
    notes: 小惠深夜出走了无音讯，林野开凯雷德全城寻找未果，转而加入三个精神小妹QQ群连发一万五千元红包寻人，群管理芳姐提醒姐妹找到人先稳住情绪，寻人信息十五分钟内扩散到二十多个群，精神小妹圈全员出动。
  - name: 第49章 她的命，不该是谁的聘礼
    notes: 两个精神小妹在铁路桥桥洞找到小惠，林野蹲守三米外耐心陪伴。小惠哭诉换亲真相：父亲与邻村谈好用她换亲，对方是三十二岁生活不能自理的傻子，彩礼八万折现给哥哥娶媳妇，定亲酒定在国庆，她怕连累林野才出逃。
  - name: 第50章 这辈子的租金，交给你了
    notes: 众人回翡翠湾，苏星彤带头拥抱安慰小惠，大家听完换亲经过群情激愤，苏星彤宣告小惠婚嫁自己说了算。林野决定与小惠父亲面谈，从穷根上解决哥哥娶亲难题，安排生计出路。深夜小惠推开林野房门钻进被窝。
  - name: 第51章 黄金瞳开眼，叔看东西开始冒价了
    notes: 系统发放永久被动技能黄金瞳，可鉴定租客物品真实价值、识别古董珠宝历史信息、每日三次深度鉴定。林野鉴定小惠发圈二手价值一毛，苏星彤沈嘉欣听墙角被拆穿。早餐后林小鹿返程，嘱咐小惠父亲来闹先报警再找林野。
  - name: 第52章：黄金瞳出显威
    notes: 小惠父亲穿旧皮夹克上门闹事，铺开写有黑心传媒扣留少女逼良为娼的白布横幅，索要八万彩礼加二十万儿子娶媳共五十万。林野黄金瞳发现他脖上玉佩是明代晚期和田黄玉瑞兽佩，市场估值一百八十万至二百六十万。
  - name: 第53章 叔，你今晚……还收租吗
    notes: 林野展示玉佩鉴定结果：明代和田黄玉瑞兽佩市场价超一百八十万，穷困宋家不可能有传家古玉，爷爷遗留是谎言，小惠实为抱养。小惠忆起十九年偏心待遇决堤痛哭，继而如释重负地笑，林野宣告她只是回家晚了点。
  - name: 第54章：整，必须整，谁不整谁孙子！
    notes: 苏星彤追问叔今晚还收租吗，林野宣告整必须整谁不整谁孙子。会议室定策：对金鼎传媒恶意剪辑先发律师函再买热搜，用自黑标题反击钱志国，周小萌组织精神小妹写真实寻人经历对冲抹黑，林野转给芳姐一万元感谢红包。
  - name: 第55章 太后懿旨，活着干，死了算
    notes: 林小鹿接到母亲王秀芹召回微信，国庆前一天带对象回家，父亲杀鸡接待。林小鹿警告母亲不是周克梅张少磊钱志国，精神小妹火力覆盖无效。林野拍板全家都去，藏来藏去更麻烦。众人计划买金镯子和烟酒礼物上门。
  - name: 第56章 见家长大采购，工资卡都想刷冒烟
    notes: 见家长前大采购，苏星彤戴黑长假发穿白裙扮乖巧，周小萌走乖巧小萌路线，小惠坚持用自己工资单独自给王秀芹买礼物。一行人到商场金店选购金镯子，林小鹿主导实心镯挑选，小惠内心担忧七个姑娘身份被长辈嫌弃。
  - name: 第57章 豹子号进村
    notes: 视角转到林野老家村口，张婶刘婶在老槐树下挤兑林野三十岁没对象还丢了工作，拿张婶儿子银行在编月薪三千五作对比。王秀芹护子隐忍，林建国忍无可忍反驳。此时路虎揽胜进村，江A８８８８８豹子号车牌惊呆众人。
  - name: 第58章 这闺女，看着乖带劲的，这伦理玩笑可不兴开啊
    notes: 七个姑娘从路虎下车齐声问候，林建国林父乐得合不拢嘴，张婶刘婶看呆。林野把路虎钥匙和雨花石香烟送给父亲。苏星彤叫林建国叔引发我和我儿子亲哥俩的误会，林建国却红光满面开着路虎进村炫耀，车速慢得像在挪。
  - name: 第59章 要饭都养他，你儿子白给都没人要
    notes: 张婶炫耀儿子银行在编月薪三千五，苏星彤带小惠沈嘉欣周小萌报工资碾压：一万加提成、一万包吃住、底薪一万二、试用期八千转正一万。张婶指责姑娘们图钱，众人送上金吊坠打火机茶叶，沈嘉欣放话要饭都养我叔。
  - name: 第60章 有钱身边皆好人，老爹腰杆终挺直
    notes: 林野感叹人穷回村遭人嫌、人阔放屁都成贵人排气的世态。姑娘们围着王秀芹走巷子，王秀芹腰杆挺直。林建国在院里当众擦拭路虎，向邻居炫耀儿子全款买的三百多万揽胜。林野见父亲挺直的腰板心里发酸，众人进院择菜。
  - name: 第61章 叔，年轻前儿也不是一般炮儿啊
    notes: 王秀芹追问七个姑娘谁是小野对象，众人目光投票推苏星彤应对，她自称传统女孩。林建国撞见她小腿上从脚踝蔓延到膝盖以上的青龙纹身，感慨老传统啊。小薇用打火机帮林建国点烟获赞，王秀芹吃醋发怒把他拽进屋教训。
  - name: 第62章 舅妈开团，精神小妹反手上强度
    notes: 大舅王大山与舅妈李翠兰上门，李翠兰像挑西红柿般打量七个姑娘，贬低艺人工作不正经，被苏星彤用五险一金合同正规噎住，周小萌补刀项链像村口路灯成精。李翠兰图穷匕见，开口要借五十万给表弟王磊付县城房子首付。
  - name: 第63章 破盒值百万，舅妈当场裂开了
    notes: 李翠兰想让王大山拿走被她视为二十块破烂的姥姥木匣，林野黄金瞳察觉异样，先让王大山写下木匣归王秀芹的字据并签名，再按暗扣位置打开铜扣，匣内只有老铜钱和断齿小梳子，李翠兰嘲笑是破烂，林野敲盒底留下悬念。

worldview:
  - 收租系统：林野的金手指，收租与特定事件达成后发放奖励，本片段奖励为永久被动技能黄金瞳
  - 黄金瞳规则：鉴定名下租客主动交付或关联物品的真实价值，识别古董珠宝字画特殊资产的历史信息与市场区间，每日可主动开启三次深度鉴定，不产生现金返还，仅提供价值信息与风险提示
  - 换亲旧俗：农村旧俗，两家以女儿互换成亲抵彩礼，宋家欲以小惠换亲为哥哥娶妻，村里以前有这种规矩
  - 精神小妹圈层：QQ群联络紧密，消息传播速度快过社交媒体算法，红包动员后可短时间扩散数十个群
  - 抱养秘密：小惠实为宋家抱养的孩子，生母遗留的玉佩是身世信物，宋家重男轻女的偏心源于无血缘
  - 乡土人情规则：村里人看重编制、房车、存款等体面条件，穷时被挤兑、阔时被奉承，见家长需厚礼开路

