important_chapters:
  - chapter: 第64章 还是那句话，我是个传统的女人
    reason: 小惠身世重大线索揭开，姥姥江城宋家保姆往事与黄玉瑞兽佩对上
    quotes:
      - context: 木匣中百日照片背面的赠言，指向小惠亲生家庭
        function: 世界观揭示
        text: 江城宋家，小满百日，赠王氏秀兰留念。
  - chapter: 第65章 星河入眼，这辈子就交给你了
    reason: 林建国王秀芹当面默许儿子与七位姑娘的关系，家庭态度定调
