        function: 人物塑造
        text: 都蒯碗里了，还能扔了咋地。
  - chapter: 第66章 夜袭林野！
    reason: 小惠深夜吐露身世心结与归属感，与林野关系再进一步
    quotes:
      - context: 小惠想明白不再寻找亲生母亲
        function: 关系动态
        text: 我不用找她了。我身边有人。
  - chapter: 第69章 盖房租金到账，叔真成刀枪炮了
    reason: 系统大额返还落地，林野一举切入建筑行业，实力跃升的关键转折
    quotes:
      - context: 租客联合出资建房触发的返还结果清单
        function: 世界观揭示
        text: 【返还结果：江城建筑地产开发有限公司100%股权、国家一级建筑工程施工总承包资质、土方工程资源包（含挖掘机50台、渣土车100辆）、现金2.5亿元】
  - chapter: 第71章 过江龙遇下山虎？是刀枪炮对葱姜蒜！
    reason: 地头蛇刘彪首次上门强揽工程，与林野的产业力量正面冲突，引出孙德胜登场
  - chapter: 第73章 村口修路风波
    reason: 亲戚密谋寿宴发难与村民拦路双线并起，林野以修路全包方案化解
    quotes:
      - context: 林野当众公布修路方案，一句话扭转村民态度
        function: 人物塑造
        text: 所有费用，我一个人出。
  - chapter: 第74章 嘿，把你当人参种了还得领补贴呢
    reason: 孙老虎孙德胜登场力挺，刘彪张涛被罚种人参，林野在村里的刀枪炮地位确立
    quotes:
      - context: 林野低声交代处理分寸，绵里藏针
        function: 人物塑造
        text: 孙总，现在是法制社会，大家都不容易，都是农民的孩子。让他们体会一下农民的艰辛就好了。
  - chapter: 第76章 捡个洋妹子，还是个毛子精神小妹
    reason: 俄国姑娘安娜首次登场，林野的吸附体质升级到国际版
    quotes:
      - context: 林野对自身体质的自嘲，点出全书收人逻辑
        function: 世界观揭示
        text: 这分明是全球边缘少女救助中心，还自带万倍返还。
  - chapter: 第78章 教父收租，月牙湾直接开盘
    reason: 首次出现特殊租金判定，万倍返还46亿现金并奖励度假山庄，安娜正式留下
    quotes:
      - context: 系统对安娜名表租金的返还播报
        function: 世界观揭示
        text: 【恭喜宿主获得现金：46亿元。】
      - context: 系统额外奖励播报
        function: 世界观揭示
        text: 【额外奖励：江城月牙湾山庄一套。】
  - chapter: 第79章 消费不看价，系统奖励度假山庄
    reason: 林野为安娜不计代价置装，饭桌独白点出收留边缘少女的主题内核
    quotes:
      - context: 看安娜安静喝粥，林野想起苏星彤她们初见时的样子
        function: 人物塑造
        text: 其实有些人只是没人接住，摔疼了，就把刺先长出来。

