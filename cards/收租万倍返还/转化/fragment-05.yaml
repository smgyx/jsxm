  - name: 小薇
    gender: 女
    identity: 双胞胎中的妹妹，星耀传媒成员，苞米地直播的开播者
    personality: 鬼点子多，敢想敢播，主动抓流量
    relationship: 小雯的双胞胎妹妹，林野的对象之一
    appearance:
      - 长得乖巧（林野语）
    quotes:
      - chapter: 第68章 苞米地里MVP，精神小妹开大播
        context: 小薇把手机架在苞米杆堆上开播
        text: 家人们，星耀传媒农业分部开播了！今天我们在苞米地里给大家整活，看看我们精神小妹是怎么把两亩地薅秃的！
  - name: 林建国
    gender: 男
    identity: 林野父亲，村里种地的老农民
    personality: 闷声护犊，认命又得意，说话慢悠悠噎人
    relationship: 林野之父，王秀芹丈夫
    quotes:
      - chapter: 第65章 星河入眼，这辈子就交给你了
        context: 王秀芹发愁七个儿媳怎么办，林建国抽烟定调
        text: 不愧是我儿子，真有出息。随我！
      - chapter: 第75章 儿砸，这些年，你没少让社会吃苦吧
        context: 夫妻俩怀疑林野的钱来路不正，林建国补刀
        text: 你妈说得对，咱家祖坟虽然冒青烟了，但也没冒这么狠的。
  - name: 王秀芹
    gender: 女
    identity: 林野母亲，姥姥王氏秀兰之女，王大山之妹
    personality: 刀子嘴豆腐心，操心面子和儿子，干活利索
    relationship: 林野之母，林建国之妻
    quotes:
      - chapter: 第64章 还是那句话，我是个传统的女人
        context: 七个姑娘没有一个吃醋，王秀芹忍不住再问一遍
        text: 你们几个，到底谁是我家小野的对象？
      - chapter: 第75章 儿砸，这些年，你没少让社会吃苦吧
        context: 王秀芹劝儿子别走歪路
        text: 这年头，来钱快的路子，哪条不是歪的？
  - name: 林小鹿
    gender: 女
    identity: 林野的妹妹，随父母回家帮忙
    personality: 嘴上没把门，爱逗爹，护哥
    relationship: 林野之妹
    quotes:
      - chapter: 第78章 教父收租，月牙湾直接开盘
        context: 林建国怕女儿学坏找黄毛，林小鹿故意逗他
        text: 黄的都烂大街了，我要找就找个粉的，那才提气呢。
