chapters:
  - name: 第64章 还是那句话，我是个传统的女人
    notes: 王大山证实姥姥曾在江城宋家做保姆七八年；木匣里的百日照片与小惠贴身黄玉瑞兽佩对上，她的亲生家庭疑为宋家；小惠表态只要能跟野哥在一起一切都好，王秀芹当众追问七个姑娘谁是林野的对象。
  - name: 第65章 星河入眼，这辈子就交给你了
    notes: 饭后七个姑娘抢着洗碗，王秀芹愁儿子同时处七个对象怕村里说闲话，林建国一句都蒯碗里了拍板接纳；夜里众人沿村道散步看星星和萤火虫，小惠悄悄勾住林野的小指，星空下感情落定。
  - name: 第66章 夜袭林野！
    notes: 七个姑娘在田埂上抱住林野集体表态，把他挤进水沟；林家安排住宿，林建国王秀芹带林小鹿去大爷家借住，七女分住东西两屋；深夜小惠溜进偏房，吐露看过百日照片后的心结，说不用再找亲生母亲，身边有人。
  - name: 第67章 收苞米？精神小妹要上强度了
    notes: 早饭时王秀芹安排收苞米，七个姑娘争着下地帮忙；周小萌自称干过农活却把苞米说成长在树上，被赵悦记进画本留档；沈嘉欣和小惠亮出从小干农活的家底，王秀芹答应放行，条件是到了地里不许受伤。
  - name: 第68章 苞米地里MVP，精神小妹开大播
    notes: 苞米地里七个姑娘全是干活好手，苏星彤速度快成MVP；小薇架起手机开播星耀传媒农业分部，弹幕直呼接地气；张婶儿子张涛到场阴阳林野赚了钱还让父母下地，骂他白眼狼，周小萌要动手被拦，林野上前对峙。
  - name: 第69章 盖房租金到账，叔真成刀枪炮了
    notes: 租客联合出资给房东盖房被系统认定为租金，万倍返还江城建筑地产开发有限公司全部股权、一级施工总承包资质、土方资源包和2.5亿现金；林野宣布推倒老屋盖三层小楼；苏星彤周小萌轮番怼张涛，张涛撂狠话离场。
  - name: 第70章 宅基地不够大？村支书大笔一挥
    notes: 江城建工设计部经理周明远带队测绘，发现宅基地面积装不下三层小楼方案；林野提出个人出资拓宽进村路、硬化路面、修排水沟并装太阳能路灯，村支书赵支书当场签字，把房后集体留用地连同老宅基地一并批给他。
  - name: 第71章 过江龙遇下山虎？是刀枪炮对葱姜蒜！
    notes: 周明远给出三版设计图，林野拍板第三版三层带院子带车库；地头蛇刘彪带纹身汉子分乘三辆车上门，强揽工程索要过路费；江城建工工程部副经理孙大海亮一级资质回击，路虎揽胜江G88888随后碾进村道压场。
  - name: 第72章 寿宴总包？这活儿星耀接了
    notes: 王秀芹提起姥爷七十大寿无人操办，舅妈因木匣的事撂挑子；林野接下寿宴并放话谁闹事就收拾谁；星耀传媒礼仪部接单，陈子豪按一桌三千标准联络乡厨，林野分工七女：统筹节目、流程、拍摄、采买管账、气氛组。
  - name: 第73章 村口修路风波
    notes: 李翠兰惦记木匣里的紫檀暗格匣和长命锁，深夜联络二舅妈孙丽密谋：让林野把寿宴办大，再当众质问他钱的来路并扣帽子；张涛撺掇刘彪找李瘸子带村民拦挖机闹事；林野到场公布修路全包方案，村民态度反转。
  - name: 第74章 嘿，把你当人参种了还得领补贴呢
    notes: 沈嘉欣用监控录像拿捏张涛；强盛公司老板孙德胜带四个光头手下登门示好，见刘彪张涛碍事，一句种人参就把两人带走，全程不到三分钟；村民彻底服气，认定林野成了没人敢惹的刀枪炮，林家在村里地位立住。
  - name: 第75章 儿砸，这些年，你没少让社会吃苦吧
    notes: 回城车上林建国憋出儿子没少让社会吃苦吧的疑问，王秀芹劝儿子别碰来钱快的歪路；林野承诺每分钱都有据可查，让父母从今不必担惊受怕；车行至镇外，林野看见路边哭泣的金发碧眼洋妹子，破例停车搭救。
  - name: 第76章 捡个洋妹子，还是个毛子精神小妹
    notes: 洋妹子安娜十八岁，靠翻译软件讲述遭遇：为江城来的精神小伙跨国奔现，护照钱包被对方卷走；她不敢报警也不想回家，嫌父亲什么都管；林野自嘲吸附体质升级，从江城精神小妹升级到国际精神小妹，路边捡了毛子摇子。
  - name: 第77章 外国小妹拜码头，翻译器当场罢工
    notes: 孙德胜下令摸清卷走外国姑娘护照的大飞；大奎经小奎刚子层层转问，问到麻将馆龙哥头上，龙哥发现大飞就在牌桌对面，收拾一顿搜出护照和粉色手机，押他去见林爷；早餐店里安娜对林野露出崇拜眼神。
  - name: 第78章 教父收租，月牙湾直接开盘
    notes: 林野放龙哥把大飞带走发落，提出联系大使馆送安娜回家被拒，安娜嫌父亲管得太死；她摘下手表当租金请求跟着教父；系统判定特殊租金，百达翡丽名表价值46万，万倍返还46亿现金，另奖励江城月牙湾山庄一套。
  - name: 第79章 消费不看价，系统奖励度假山庄
    notes: 林野带众人进商场给安娜从里到外配齐衣物，一句不用看价刷掉两万三千六百八；安娜错管王秀芹叫妈妈，逗翻众人；包间里安娜安静喝粥，林野感慨叛逆不是天生，只是没人接住摔疼了才先长出刺。

worldview:
  - 收租万倍返还系统：宿主收到的租金按万倍返还，可返还现金、公司股权、施工资质、资源包与地产
  - 租金认定宽泛：租客主动出资改善房东直系亲属居住环境并绑定自身居住权，也算租金，第69章多方联合出资建房即触发返还
  - 特殊租金规则：高价值物品被当作租金交付同样触发万倍返还，并附额外奖励，第78章安娜的名表换来现金与山庄
  - 林野的吸附体质：走到哪都能刷到隐藏任务，身边不断聚拢各路边缘少女，自嘲为全球边缘少女救助中心
  - 时代背景：现代龙国（架空中国），约2026年；农村宅基地需审批，村集体留用地未确权不能私自建房；直播短视频与网络梗文化盛行
  - 小惠身世之谜：姥姥王氏秀兰当年独自去江城，在姓宋的大户人家做保姆七八年，带回百日照片和信物；小惠贴身黄玉瑞兽佩与照片中婴儿所挂相同，其亲生家庭疑为宋家，姥姥与宋家绝非保姆和东家那么简单

regions:
  - name: 林家村
    description: 林野老家所在村子，进村路窄一下雨全是泥坑，村里有鸡圈稻田与苞米地
    scenes:
      - 林家老宅院子
      - 苞米地
      - 村口
      - 村支书家
      - 进村路
      - 田埂村道
  - name: 县城
    description: 林家村附近的城镇，原文未给名字，安娜被骗与购物吃饭均发生于此
    scenes:
      - 路边路牙子
      - 镇上早餐店
      - 商场
      - 私房菜馆包间
      - 茶楼包厢
  - name: 江城
    description: 主城市，林野产业所在地，部分王家亲戚居住于此
    scenes:
      - 江城老旧小区
      - 翡翠湾
  - name: 孙德胜别墅
    description: 强盛公司老板的宅邸，后院被用作惩戒地，不听话的人被送去种人参
    scenes:
      - 别墅后院

factions:
  - name: 星耀传媒
    summary: 林野旗下的传媒公司，运营主播直播业务，内设礼仪部，苞米地直播时自称星耀传媒农业分部
    territory: 江城
    key_members: [苏星彤, 沈嘉欣, 周小萌, 赵悦, 小雯, 小薇, 陈子豪（运营总监）]
  - name: 江城建筑地产开发有限公司
    summary: 系统返还所得的建筑公司，林野持全部股权，具备国家一级建筑工程施工总承包资质，对外称江城建工，承接老家房屋重建与进村道路拓宽工程
    territory: 江城、林家村
    key_members: [周明远（设计部经理）, 孙大海（工程部副经理）]
  - name: 强盛公司
    summary: 孙德胜的土方供应公司，老板道上称孙老虎；主动投靠林野谋求从土方队升级为正规合作商，代林野出手收拾刘彪、张涛、大飞
    territory: 江城
    key_members: [孙德胜, 大奎]
  - name: 江城宋家
    summary: 姥姥王氏秀兰年轻时做保姆七八年的江城大户人家，与小惠身世直接相关，这关系绝不是保姆和东家那么简单
    territory: 江城

characters:
  - name: 林野
    gender: 男
    age: 30
    identity: 收租系统宿主，星耀传媒与江城建筑地产开发有限公司实际控制人，七位姑娘的房东
    personality: 外冷内热护短，对外人绵里藏针，出手阔绰消费不看价
    relationship: 林建国与王秀芹之子，林小鹿之兄，小惠等七位姑娘的对象兼房东
    quotes:
      - chapter: 第69章 盖房租金到账，叔真成刀枪炮了
        context: 苏星彤问他盯着苞米地在想什么，林野心系系统奖励
        text: 我在想，这回真成刀枪炮了。
      - chapter: 第75章 儿砸，这些年，你没少让社会吃苦吧
        context: 车上面对父母对他钱来路不正的担忧，林野郑重承诺
        text: 我赚的每一分钱，都有据可查。公司、账户、流水，你们什么时候想看，我什么时候给你们看。
  - name: 小惠
    gender: 女
    identity: 林野收留的姑娘之一，寿宴采买管账担当
    personality: 沉默坚韧念旧情，报恩心重，认定林野后态度笃定
    relationship: 林野的对象之一，疑为江城宋家亲生家庭遗孤，姥姥王氏秀兰保管其百日照片
    appearance:
      - 脖上挂黄玉瑞兽佩，与百日照片中婴儿所挂为同一块
    quotes:
      - chapter: 第64章 还是那句话，我是个传统的女人
        context: 身世线索揭开，小惠当众表明心意
        text: 只要能跟野哥在一起，一切都好。
      - chapter: 第66章 夜袭林野！
        context: 深夜偏房里小惠向林野坦露不再寻找亲生母亲的心结
        text: 我不用找她了。我身边有人。
  - name: 苏星彤
    gender: 女
    identity: 星耀传媒主播，寿宴节目统筹（礼仪部）
    personality: 大胆泼辣嘴甜，护林野，干活麻利学得快
    relationship: 林野的对象之一
    appearance:
      - 三色头发，本片段中扎马尾
      - 白裙子
    quotes:
      - chapter: 第69章 盖房租金到账，叔真成刀枪炮了
        context: 张涛嘲讽林野盖房花不了几十万，苏星彤当场回击
        text: 事实就是你连几十万都拿不出来，还搁这酸别人。你那银行编制一个月三千五，攒到猴年马月能盖个厕所？
      - chapter: 第79章 消费不看价，系统奖励度假山庄
        context: 林野刷卡两万三千六百八眉头都不皱，苏星彤感叹
        text: 叔，你现在消费真有一种‘钱是王八蛋，花了咱再赚’的松弛感。
  - name: 沈嘉欣
    gender: 女
    identity: 星耀传媒剪辑（坐办公室剪视频），寿宴流程表负责
    personality: 平时话不多但开口带刀，遇事冷静，习惯录像留证据
    relationship: 林野的对象之一
    appearance:
      - 牛仔外套
    quotes:
      - chapter: 第67章 收苞米？精神小妹要上强度了
        context: 众人怀疑姑娘们干不了农活，沈嘉欣认真表态
        text: 我小时候在外婆家割过稻子，插过秧，翻过地。你别看我现在坐办公室剪视频，真到地里，我不比谁差。
      - chapter: 第74章 嘿，把你当人参种了还得领补贴呢
        context: 沈嘉欣收起拍下张涛拱火的平板，微笑拿捏
        text: 张涛哥，需要我把这段发村群里吗？保准你明天上热搜。
  - name: 周小萌
    gender: 女
    identity: 星耀传媒主播，前不良少女，寿宴气氛组
    personality: 跳脱咋呼，迷上绷住文学，分不清苞米和香蕉但干活不含糊
    relationship: 林野的对象之一
    appearance:
      - 粉毛，月光底下泛银光
    quotes:
      - chapter: 第66章 夜袭林野！
        context: 众人抱住林野把他挤向水沟，周小萌不肯松手
        text: 叔，掉沟里我也跟着。
      - chapter: 第67章 收苞米？精神小妹要上强度了
        context: 周小萌吹嘘自己干过农活却露了馅
        text: 我咋分不清了？苞米不就是那个……黄色的……长在树上的……
  - name: 赵悦
    gender: 女
    identity: 前不良少女，寿宴气氛组，随身画本记录素材
    personality: 冷静寡言，毒舌拆台一击致命
    relationship: 林野的对象之一
    quotes:
