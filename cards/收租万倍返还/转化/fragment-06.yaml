      - context: 山庄遇袭当夜系统提示音响起
        function: 世界观揭示
        text: 【山庄安保维护租金触发：月牙湾山庄安保队支付象征性巡防租金1元。】
  - chapter: 89-锋芒毕露，同行暗算反被坑
