        context: 看见村口大巴车队后压低声音提醒
        text: 我说，这车不是小门小户能租出来的。
      - chapter: 84-宝马刚落座，账单先上桌
        context: 端着茶杯对王秀芹阴阳怪气
        text: 秀芹姐，小野现在是真出息了。男人有钱了是好事，不过啊，年轻人还是得有个稳定事业。钱来得快，守不住也麻烦。
  - name: 王磊
    gender: 男
    identity: 银行职员，林野表弟
    personality: 虚荣爱炫，眼高手低，背后使钱雇闹
    relationship: 孙丽与王海之子，被扔出山庄并被终生禁入月牙湾产业
