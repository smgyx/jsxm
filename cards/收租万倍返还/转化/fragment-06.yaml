        function: 剧情高潮
        text: 家人们，今天带大家看看，有人号称在山庄办寿宴，钱从哪儿来的，咱们现场打假。
  - chapter: 84-宝马刚落座，账单先上桌
    reason: 陈子豪当众晒寿宴账单，单桌三千八百八碾压王磊宝马排场，数字打脸名场面
    quotes:
      - context: 陈子豪主桌旁当众汇报寿宴总账
        function: 剧情高潮
        text: 今天宴席按二十二桌准备，实际到场二十桌，备用两桌。主桌菜品单独升级。食材全部走月牙湾自营采购系统，冷链记录、检疫证明、后厨留样都己经归档。
  - chapter: 85-养老牌一出，叔把桌掀稳
    reason: 养老摊牌高潮：十年账目当众公开，三百万养老账户设立立规矩，林家亲戚格局洗牌
    quotes:
      - context: 林野面对王海的养老发难先算过去十年的账
        function: 剧情高潮
        text: 过去十年，外公看病、过年、生日、日常开销，每家给过多少钱，谁记得？
      - context: 陈子豪当众宣布养老账户安排
        function: 关系动态
        text: 我准备设立三百万老人专属养老账户。
  - chapter: 86-算盘落空，跳梁小丑现原形
    reason: 王磊雇闹被当场揭穿扔出山庄，王海一家被终生禁入月牙湾产业，反派亲属线阶段性收束
    quotes:
      - context: 人证物证俱全后林野宣布处置
        function: 剧情高潮
        text: 把人扔出去。以后月牙湾的产业，王海一家，终生禁入。
  - chapter: 87-流量狙击，精神小妹的情报网
    reason: 小惠确立情报线负责人定位；金鼎限流狙击、安娜首秀定档、黄金瞳在酒窖墙内劈出暗格保险箱三线并进
    quotes:
      - context: 林野定下用实景直播反击金鼎的策略
        function: 剧情高潮
        text: 那咱们就陪他玩场大的。用俄罗斯风情加月牙湾顶级实景，打他的棚拍擦边球。通知技术部，开启多机位实景首播测试。安娜今晚首秀。
  - chapter: 88-商业版图，星耀传媒新矩阵
    reason: 林野一打六名场面；鼎盛娱乐赵阔浮出水面；系统奖励黑客精通，世界观规则再揭示
