    description: 林野名下的度假山庄，离城不远，产权过户齐全，有餐饮、住宿、活动承接三条业务线，星耀传媒正整体迁入
    scenes:
      - 主楼
      - 靠湖别墅区
      - 宴会厅
      - 前厅
      - 书房
      - 地下酒窖
      - 大理石广场
      - 行政楼顶层露台
      - 后山
      - 后山菜地
      - 后山监控室
      - 犬舍
      - 机房
  - name: 林家村
    description: 林野老家所在村庄，寿宴接人与新房流水席举办地
    scenes:
      - 村口
      - 村头老槐树下
      - 村头小卖部
      - 林家新别墅
  - name: 江城
    description: 故事主城，传媒行业竞争的核心舞台
    scenes:
      - 北城区废弃汽配城
      - 江城国际会展中心
      - 江城老旧小区（王磊家）
      - CBD

factions:
  - name: 星耀传媒
    summary: 林野创办的传媒公司，旗下多名主播，正从市区整体迁入月牙湾山庄办公直播
    territory: 江城、月牙湾山庄
    key_members: [林野, 陈子豪, 苏星彤, 宋小惠, 沈嘉欣, 周小萌, 赵悦, 小雯, 小薇, 安娜, 猫七]
  - name: 鼎盛娱乐
    summary: 江城老牌MCN，赵阔掌舵，买通平台运营总监限流对手、雇人袭击月牙湾山庄，年度盛典上被林野当场开战
    territory: 江城
    key_members: [赵阔]
  - name: 金鼎传媒（金鼎互娱）
    summary: 钱志国的传媒公司，租仓库买三百台二手机刷数据，买断江城七成广告位推擦边主播机车西西
    key_members: [钱志国, 机车西西]
  - name: 江城建工
    summary: 孙德胜旗下的建筑公司，为山庄提供安保与车队，为林家村修路并提供二十多个就业岗位
    key_members: [孙德胜]

characters:
  - name: 林野
    gender: 男
    identity: 星耀传媒老板、月牙湾山庄业主，系统宿主
    personality: 处事稳狠，先立规则再动手，重证据不情绪化
    relationship: 王秀芹与林建国之子，姥爷的外孙，众姑娘的“叔”兼房东
    quotes:
      - chapter: 85-养老牌一出，叔把桌掀稳
        context: 二舅王海借养老发难，林野当众清算旧账
        text: 过去十年，外公看病、过年、生日、日常开销，每家给过多少钱，谁记得？
      - chapter: 86-算盘落空，跳梁小丑现原形
        context: 揭穿王磊雇闹后下令处置
        text: 把人扔出去。以后月牙湾的产业，王海一家，终生禁入。
      - chapter: 87-流量狙击，精神小妹的情报网
        context: 面对金鼎限流狙击定下反击策略
        text: 那咱们就陪他玩场大的。用俄罗斯风情加月牙湾顶级实景，打他的棚拍擦边球。通知技术部，开启多机位实景首播测试。安娜今晚首秀。
      - chapter: 88-商业版图，星耀传媒新矩阵
        context: 山庄遇袭后坚持报警处理
        text: 我现在是正经企业家。
  - name: 王秀芹
    gender: 女
    identity: 林野母亲，农村主妇
    personality: 勤俭怕花钱，心疼儿子又怕他做事没章法
    relationship: 林野之母，姥爷之女
    quotes:
      - chapter: 80-山庄开门，老两口当场没词了
        context: 初见月牙湾山庄，不敢相信寿宴真要在此举办
        text: 你姥爷寿宴，真搁这儿办？
  - name: 林建国
    gender: 男
    identity: 林野父亲
    personality: 老实本分，见世面拘谨，高兴时话直
    relationship: 林野之父
    quotes:
      - chapter: 80-山庄开门，老两口当场没词了
        context: 初进山庄被规模震撼
        text: 这地方，搁咱村里能盖二十栋楼。
      - chapter: 91-夜半惊魂，张涛作死触逆鳞
        context: 流水席喝醉后拍着儿子肩膀反复说的一句话
        text: 小野，爸这辈子没白活。
  - name: 苏星彤
    gender: 女
    appearance:
      - 头发染回深色，戴耳钉
    identity: 星耀传媒主播，弹幕称“小钢炮”
    personality: 嘴欠爱怼人但心里有数，正式场合收得住
    relationship: 林野身边的姑娘之一，称林野为叔，称林小鹿为姐
    quotes:
      - chapter: 85-养老牌一出，叔把桌掀稳
        context: 李翠兰劝林野多出钱时当场回怼
        text: 我不懂长辈，我懂账。谁花钱谁有底气，谁空口白牙谁先着急。
      - chapter: 89-锋芒毕露，同行暗算反被坑
        context: 鼎盛年度盛典红毯上讥讽赵阔
        text: 哟，这红毯挺长，够不够赵总把昨晚派人砸道闸那段走完啊？
      - chapter: 90-新家落成，乔迁之喜惊全村
        context: 初见林家新别墅的感叹
        text: 你这是把县城售楼处搬你家地基上了。
      - chapter: 93-后山菜地的“地下狂欢”
        context: 点评周小萌赵悦的社会摇扮相
        text: 水鬼从下水道返场都没你俩完整。
  - name: 宋小惠
    gender: 女
    identity: 星耀传媒情报线负责人，月预算五万走公司特殊账目，兼管家事务
    personality: 身段放到最低，说话不重但句句往结果上落，拿证据说话
    relationship: 林野身边的姑娘之一，被王秀芹托付新房备用钥匙
    quotes:
      - chapter: 87-流量狙击，精神小妹的情报网
        context: 早餐时向林野汇报自建情报网的成果
        text: 钱志国那边有动作了。他在北城区的废弃汽配城租了两个仓库，买了三百台二手机，雇了一批学生在刷数据。他要在今晚八点搞一场连轴PK，踩着咱们星耀传媒的流量上位。
      - chapter: 88-商业版图，星耀传媒新矩阵
        context: 用照片和法律后果说服被抓的寸头男开口
        text: 你现在不说，等会儿就按入室行凶、聚众滋事走。你要是说了，至少能证明你是收钱办事。钱是谁给的，你自己选。
      - chapter: 90-新家落成，乔迁之喜惊全村
        context: 给众人发鞋套，护着刚进新房的王秀芹
        text: 先套上吧。阿姨今天刚进新房，别让她心疼。
  - name: 沈嘉欣
    gender: 女
    identity: 星耀传媒剪辑运营，负责素材录制与分发
    personality: 素材意识成职业病，遇事先想留证，动作稳
    relationship: 林野团队骨干
  - name: 安娜
    gender: 女
    identity: 俄罗斯女孩，借住月牙湾山庄，中文初学者
    personality: 认真相绷，记忆力好，说话直白
    relationship: 受林野收留，身世与母亲提过的江城大庄园线索相关
    quotes:
      - chapter: 81-月牙湾寿宴？等翻车吧
        context: 用翻译软件讲述相册与母亲提过的庄园
        text: 她说，小时候有一次去过一个很大的庄园。里面有个很会说俄语的叔叔，还送过她糖。
      - chapter: 93-后山菜地的“地下狂欢”
        context: 直播间观众问她为什么在拔萝卜
        text: 业务边界，还在摸索。
  - name: 陈子豪
    gender: 男
    identity: 林野的总管，统筹山庄、车队、寿宴与直播事务
    personality: 办事细致周全，流程与账目控
    relationship: 林野下属核心
    quotes:
