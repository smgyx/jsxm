        context: 主桌旁当众汇报寿宴总账
        text: 今天宴席按二十二桌准备，实际到场二十桌，备用两桌。主桌菜品单独升级。食材全部走月牙湾自营采购系统，冷链记录、检疫证明、后厨留样都己经归档。
      - chapter: 85-养老牌一出，叔把桌掀稳
        context: 当众宣布养老账户安排
        text: 我准备设立三百万老人专属养老账户。
  - name: 孙德胜
    gender: 男
    identity: 江城建工老板（孙总），掌控安保与建筑资源
    personality: 识人敬人，对林野从敬钱敬资源升到敬人
    relationship: 林野的合作者与护卫资源
  - name: 姥爷
    gender: 男
    identity: 王秀芹之父，七十大寿寿星，人称老王头
    personality: 明事理不细问钱来路，重面子和团圆，动怒时拐杖砸地
    relationship: 林野的外公
    quotes:
      - chapter: 83-现场打假？产权证糊脸！
        context: 到场看见山庄阵仗时的感叹
        text: 你小子，真给我整到地方来了。
      - chapter: 86-算盘落空，跳梁小丑现原形
        context: 得知王磊雇人砸场后怒指王海
        text: 王海！看看你教出来的好儿子！
  - name: 王海
    gender: 男
    identity: 二舅，姥爷之子
    personality: 算计，想借养老扣锅，被十年账目打脸
    relationship: 王秀芹的二哥，王磊之父，事后被终生禁入月牙湾产业
    quotes:
      - chapter: 85-养老牌一出，叔把桌掀稳
        context: 端着酒杯以长辈身份提养老
        text: 小野，不是二舅说你。你现在有公司，有山庄，有车，日子过起来了。你外公年纪大了，往后看病吃药，身边照顾，都得有人拿主意。
  - name: 孙丽
    gender: 女
    identity: 二舅妈，王磊之母
    personality: 爱面子会算计，擅长组织打假直播抹黑对手
    relationship: 王海之妻，王秀芹的妯娌，事后随王海一家被弃
    quotes:
