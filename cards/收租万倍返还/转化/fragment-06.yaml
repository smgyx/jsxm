items:
  - name: 收租万倍返还系统
    summary: 宿主名下产业产生租金流水即触发万倍返还并随机奖励永久技能；山庄安保巡防租金1元触发返还10000元并奖励黑客精通
  - name: 黄金瞳
    summary: 林野的被动透视能力，可看穿墙体内部，借此发现山庄地下酒窖红砖墙内的暗格保险箱
  - name: 商业洞察之眼
    summary: 林野的信息面板能力，可读取人物底细与风险等级；曾预警张涛报复倾向，揭出张倩三张信用卡逾期共十九万七、欲借婚姻搞钱
  - name: 黑客精通（永久被动）
    summary: 系统奖励技能，让林野精通服务器、邮件头、后台日志、水军脚本，五分钟拉出赵阔买通平台运营总监的邮件与转账证据
  - name: 月牙湾山庄
    summary: 林野名下度假山庄产业，有餐饮、住宿、活动承接三条业务线，宴会厅、客房、机房齐备，星耀传媒业务整体迁入
  - name: 三百万老人专属养老账户
    summary: 林野为姥爷设立，只用于日常生活、医疗、护理、房屋维护，由律师、村委、姥爷本人共同监管，每笔支出留票据，月度公开
  - name: 安娜的相册与俄语便签
    summary: 安娜母亲旧物线索：相册对应母亲提过的江城大庄园，书房便签写有俄语名字和一串中文地址，林野已拍照留存待查
  - name: 猫七转签合同
    summary: 猫七从鼎盛娱乐跳槽星耀传媒的转签合同，林野在后山事件当晚正在审阅

important_chapters:
  - chapter: 80-山庄开门，老两口当场没词了
    reason: 月牙湾山庄首次全景亮相，林野确认山庄三条业务线并决定整体迁入星耀传媒业务，产业升级关键节点
