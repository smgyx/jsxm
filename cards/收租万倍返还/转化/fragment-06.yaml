chapters:
  - name: 80-山庄开门，老两口当场没词了
    notes: 林野开车带父母和姑娘们进驻月牙湾山庄，保安见江G88888车牌和产权证放行，老两口被震住。陈子豪提前布场安排住宿。林野翻阅资产资料，确认餐饮、住宿、活动承接三条业务线，决意把星耀传媒业务整体迁入。
  - name: 81-月牙湾寿宴？等翻车吧
    notes: 林野在书房发现老相册，照片金发女人与安娜眉眼相近，便签记有俄语名字和中文地址。安娜自述先跟阿飞来江城，后循母亲提过的线索寻找大庄园。同一晚，王磊、孙丽、李翠兰密谋开宝马回村，雇主播搞打假直播抹黑林野。
  - name: 82-靠边停！三十万宝马吃瘪
    notes: 天亮后月牙湾大巴车队开进林家村接人，村民震撼。王磊开三十多万宝马带孙丽、李翠兰回村压场，反被大巴和三轮车卡在村口，被司机要求靠边停给老人让路。孙丽看出车队不是租的，心里发虚，宝马排场彻底被车队压住。
  - name: 83-现场打假？产权证糊脸！
    notes: 月牙湾宴会厅寿宴开场，姥爷穿唐装到场。王磊一家进场阴阳场地是租的，王磊发消息给张涛布置打假主播。几名打假主播堵门开直播，质疑山庄是买是租、资金来路，林野唤孙总，孙德胜带光头大汉进场压场，主播吓得手抖。
  - name: 84-宝马刚落座，账单先上桌
    notes: 寿宴开席，王磊把宝马钥匙摆上桌炫耀三十多万，孙丽阴阳王秀芹钱来得快守不住。陈子豪当众汇报寿宴总账：单桌三千八百八、主桌八千八、冷链检疫齐备、十六台车接送、三十六间住宿，王磊母子脸挂不住。
  - name: 85-养老牌一出，叔把桌掀稳
    notes: 二舅王海发难提姥爷养老，想把责任扣给林野。林野当众晒出十年看病票据与红包礼金记录：王海花销不足两万，王秀芹付出最多。宣布过去不追补，设立三百万养老账户，律师、村委、姥爷三方监管，月度公开。
  - name: 86-算盘落空，跳梁小丑现原形
    notes: 王磊在桌下用手机指挥场外闹事，被苏星彤当众念出；林野夺手机把聊天截图投上大屏幕，黄毛主播供出五千元雇闹费，老爷子气得砸拐杖。林野把王磊扔出山庄，宣布王海一家终生禁入月牙湾产业。
  - name: 87-流量狙击，精神小妹的情报网
    notes: 小惠自建七个微信群摸到钱志国租仓库刷数据的动作，获批月预算五万独立情报线。金鼎传媒买断江城七成广告位限流星耀，推擦边主播机车西西。林野决定全员迁入山庄，用俄罗斯风情实景直播反击，并定安娜今晚首秀。
  - name: 88-商业版图，星耀传媒新矩阵
    notes: 六名壮汉持械袭击山庄，林野一打六全部放倒；小惠审出幕后是鼎盛娱乐赵阔，林野令孙德胜报警留证。系统因山庄安保租金一元触发万倍返还一万元，并奖励永久被动技能黑客精通。孙德胜把林野从合作对象改认作祖宗。
  - name: 89-锋芒毕露，同行暗算反被坑
    notes: 林野用黑客精通五分钟拉出赵阔买通平台运营总监刘某限流星耀的邮件与转账证据，交沈嘉欣剪三版分发，广告全面预埋。鼎盛娱乐年度盛典当晚，林野带团队踩场，苏星彤红毯当面讥讽赵阔派人砸道闸，双方决胜在即。
  - name: 90-新家落成，乔迁之喜惊全村
    notes: 一个月后林家三层新别墅落成，林野带众人回村验收，村民围观惊叹。三楼留给姑娘们一人一间刻名门牌，安娜凭手表抵租确认房间。王秀芹拿到专属柴火铁锅灶，把备用钥匙托给小惠，苏星彤抢占林野隔壁房间。
  - name: 91-夜半惊魂，张涛作死触逆鳞
    notes: 流水席第二天，苏星彤直播新房流水席，王秀芹看出姑娘们会干活有分寸。张涛在村头小卖部与二楞密谋夜里两点泼漆砸玻璃。林建国喝醉感叹这辈子没白活。林野白天已用商业洞察之眼预警张涛报复倾向，决定抓贼抓现行。
  - name: 92-村头大树下的“印第安老斑鸠”
    notes: 张涛泼漆未遂被抓，村头流言质疑林野钱来路，村支书赵明福送来乡村振兴优秀青年牌匾。张婶带女儿张倩提亲，开出两百平大平层、八十八万彩礼、公司两成股份等条件；商业洞察之眼揭出她负债十九万七、想借婚姻搞钱。
  - name: 93-后山菜地的“地下狂欢”
    notes: 张倩天价条件在村群疯传。周小萌赵悦在后山菜地办社会摇直播，安娜拔萝卜学中文，在线人数冲到十五万。马六等张涛牌友携工具潜入欲剪滴灌管喷漆，林野令安保封下山路、犬舍放犬待命、夜视机位先拍作案过程。

worldview:
  - 收租万倍返还系统：宿主名下产业产生租金流水即触发万倍返还，并随机奖励永久技能；提示以【】系统提示音形式出现
  - 异能与系统技能并存于现实：黄金瞳可透视墙体与物品，商业洞察之眼可读取人物底细、负债与风险等级，奖励技能如黑客精通（永久被动）
  - 直播行业生态：平台流量取决于开屏广告买断与同城推荐权重，平台运营人员可被收买限流；打假直播、水军刷量、雇人闹事是同行竞争惯用手段
  - 故事主城为江城，林家村为其下辖乡村；主角以正经企业家自居，遇袭重报警留证与合法经营

regions:
