  角色名类:
    - 名称: 姥爷（老王头）
      上下文: 老王头，你这七十大寿，办得比人家结婚还排场。
      建议: 补全姥爷全名（王姓，原文仅称老王头）
    - 名称: 安娜的母亲
      上下文: 她说，小时候有一次去过一个很大的庄园。里面有个很会说俄语的叔叔，还送过她糖。
      建议: 设定具体俄语姓名，并明确她与江城大庄园的渊源
    - 名称: 平台本地运营总监刘某
      上下文: 收件人：平台本地运营总监刘某。
      建议: 补全该运营总监的姓名
    - 名称: 阿飞
      上下文: 我先是跟着阿飞走的。
      建议: 补全阿飞的全名与身份（带安娜来江城的男人）
    - 名称: 刘彪
      上下文: 他上次找刘彪，没成。
      建议: 补全刘彪的身份背景（张涛曾找来对付林野的人）
  地名类:
    - 名称: 大庄园
      上下文: 她说，小时候有一次去过一个很大的庄园。
      建议: 为安娜母亲去过的江城大庄园命名，可作为安娜身世线锚点
  专有名词类:
    - 名称: 建材老板（群体）
      上下文: 我还查到，钱志国找来了资本背书。江城本地的几个建材老板给他投了钱，资金盘很大。
      建议: 补全关键建材老板姓名（张少磊疑为其中之一，其车行已被林野清退）
    - 名称: 便签上的俄语名字
      上下文: 更靠后的位置，还有一张便签，上面写着一个名字，俄语拼的，下面压着一串中文地址。
      建议: 设定该俄语名字的具体拼写，并给出便签对应的中文地址
