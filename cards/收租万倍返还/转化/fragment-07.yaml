important_chapters:
  - chapter: 第94章 擦边风波，重拳出击
    reason: 海盛数据水军案告破，任务单最上层指向赵阔，赵阔线由商战打压升级为刑事案件
    quotes:
      - context: 老许溯源后点明水军任务单的资金指挥链
        function: 剧情高潮
        text: 海盛只是壳，钱从地下钱庄过，任务单分成西层，赵阔藏在最上面。
      - context: 林野向刚跳槽的猫七表态，星耀与鼎盛管理逻辑的对立
        function: 人物塑造
        text: 星耀花钱签你，是让你赚钱，不是让你替公司挡刀。
  - chapter: 第95章 神秘酒会，资本的鸿门宴
    reason: 李家入场争夺月牙湾地下，安娜身世线（索科洛夫家族、母亲相册与酒庄徽记）首次展开
    quotes:
      - context: 安娜在宴会厅门口认出李家徽记，牵出母亲相册线索
        function: 剧情转折
        text: 这个标志，我妈妈的相册里有。
      - context: 李明哲亮出李家与俄罗斯索科洛夫家族的合作关系，点出月牙湾与安娜母亲的关联
        function: 世界观揭示
        text: 安娜小姐，李家与俄罗斯索科洛夫家族有多年合作，你母亲若真与月牙湾有关，交给李家调查会更合适。
  - chapter: 第96章 小惠的生母，豪门的弃子
    reason: 小惠身世正面揭示，宋家确认其为失散女儿却送来放弃继承协议，生母下落成谜
    quotes:
      - context: 管家在山庄宣布亲子鉴定结果并索要玉佩
        function: 世界观揭示
        text: 这块玉佩是宋家祖传之物，宋家己经确认，宋小惠是当年失散的孩子。
      - context: 苏星彤怒斥宋家用一百万买断亲生女儿
        function: 剧情高潮
        text: 拿一百万买断一个亲生女儿，你们宋家做生意都这么省钱？
  - chapter: 第97章 四平公主的嫉妒与代价
    reason: 林野买下十七份债权反杀网暴，林家投资成立，商战打法由公关反击升级为资本绞杀
    quotes:
      - context: 林野定下对付宋婉儿及其背后家族的打法
        function: 剧情高潮
        text: 把催债函送到宋婉儿的游艇上。
      - context: 当夜十一份前后共十七份债权转让完成，商业洞察之眼堵死宋家拖延的路
        function: 剧情高潮
        text: 林野付出三十七亿现金，拿下十七家企业的最大额度债权和部分抵押权，合同里附着的违约条款被商业洞察之眼逐条标红，宋家想通过关联担保拖延的路也被提前堵死。
  - chapter: 第98章 进军省城，精神小妹的降维打击
    reason: 省城开标摊牌，宋氏文化集团财务黑洞当众曝光，小惠生母王氏登记死亡档案浮出
    quotes:
      - context: 苏星彤坐上谈判桌当众揭宋氏文化集团老底
        function: 剧情高潮
        text: 应收账款九十西亿，坏账准备只提了六亿，旗下三家商场靠关联担保续贷，网红基地账面估值八亿，空置率百分之七十三。
      - context: 章首抛出生母登记死亡的档案线索
        function: 世界观揭示
        text: 生母王氏，登记死亡，这份档案谁调出来的？
  - chapter: 第99章 赵阔的反扑，困兽之斗
    reason: 生母王秀芹与宋家佣人同框旧照出现，档案馆起火灭证，赵阔取保后设伏截杀被林野反杀
    quotes:
      - context: 照片显示王秀芹抱着襁褓与宋家佣工牌女人同框，身世谜团升级
        function: 剧情转折
        text: 照片拍摄地点就在旧档案馆门口，王秀芹抱着襁褓，旁边那个女人胸前挂着宋家佣工牌，两人脚边放着同款木匣。
      - context: 商业洞察之眼对返程线路的风险评估点名赵阔
        function: 剧情转折
        text: 【关联人员：鼎盛娱乐前负责人赵阔。】
  - chapter: 第100章 双胞胎的秘密，家族的荣光
    reason: 全书末章，赵阔落网，双胞胎榫卯天才身份曝光，林野反注资诺曼并成立星耀古建研究院，正文止于此，宋家身世线与李家月牙湾线均未收尾
    quotes:
      - context: 黄金瞳评估双胞胎结构的专利价值
        function: 世界观揭示
        text: 【预计专利组合价值：一百八十亿元以上。】
      - context: 全书最后一个动作，林野宣布设立研究院并给双胞胎正名
        function: 剧情高潮
        text: 林野打开公司注册页面：“星耀古建研究院，注册资金十亿，小雯任结构研究所长，小薇任工艺研究所长，专利归她们个人与研究院共同持有。

