      - 出镜时穿米白色针织衫，头发挽在脑后
    quotes:
      - chapter: 第97章 四平公主的嫉妒与代价
        context: 收到匿名短信后向林野询问宋家是否另有孩子
        text: 叔，如果宋家真的还有别的孩子，会是谁？
  - name: 猫七
    gender: 女
