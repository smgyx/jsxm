chapters:
  - name: 第94章 擦边风波，重拳出击
    notes: 猫七跳槽星耀三天首播遭水军刷违禁内容，第三次警告即封号。林野拒绝关播，溯源锁定结算方海盛数据与地下钱庄，篡改结算指令冻结总账户，水军断粮，法务向鼎盛娱乐与海盛数据发函报警，订单备注坐实赵阔主使。
  - name: 第95章 神秘酒会，资本的鸿门宴
    notes: 李家于江城国际金融中心顶层设黑金酒会，李明哲开价十二亿收购星耀，真实目标直指月牙湾开发优先权，林野追问到地下后回绝。安娜认出李家徽记同母亲相册照片，李明哲抬出索科洛夫家族施压，开白马酒庄讥讽林野。
  - name: 第96章 小惠的生母，豪门的弃子
    notes: 安娜手机译出俄文档案，零号矿区李家联合勘探人尼古拉·索科洛夫是其父线索。宋家管家带保镖上门，凭亲子鉴定认回失散女儿小惠，却要她签放弃继承、交还玉佩、一百万买断协议，回避生母下落，苏星彤怒斥宋家。
  - name: 第97章 四平公主的嫉妒与代价
    notes: 小惠收到匿名短信，溯源至省城旧城区。星耀宣布进军省城，宋家二小姐宋婉儿带头网暴，被讥为四平公主。商业洞察之眼显示宋婉儿外债十二亿四千万，林野连夜花三十七亿买下抹黑者家族十七份债权，放进林家投资。
  - name: 第98章 进军省城，精神小妹的降维打击
    notes: 老档案员兜售小惠生母王氏死亡登记档案，宋家欲销毁原件。省城网红基地开标，宋氏商会只给外地企业两张旁听证，苏星彤坐上谈判桌抖出宋氏文化集团坏账、四十七亿短债与七成三空置率，宋远山用资格评估挡回星耀。
  - name: 第99章 赵阔的反扑，困兽之斗
    notes: 小惠生母王秀芹旧照现身：她在旧档案馆门口抱着襁褓，身旁是宋家佣工牌女人，脚边放同款木匣。档案馆随即起火灭证，档案员被掳。取保的赵阔在省江高速设伏，林野撞翻泥头车，赤手放倒四名打手，追问档案员下落。
  - name: 第100章 双胞胎的秘密，家族的荣光
    notes: 赵阔带汽油闯入首播工坊，双胞胎小雯小薇用喷淋灭火，以榫卯木架锁人送警，谋杀绑架证据坐实。诺曼公司欲三十万买断其专利，黄金瞳估专利组合价值超一百八十亿，林野反手注资十亿设星耀古建研究院，姐妹任所长。

worldview:
  - 林野拥有异能之眼：商业洞察之眼读取人物与企业的资金风险、债务、资产数据，可给出行车路线的事故概率，并将合同违约条款逐条标红
  - 黄金瞳扫描物品结构，给出性能提升幅度、应用领域与专利组合估值，信息以弹窗形式呈现
  - 主播行业生态：水军接码刷量、平台警告封号、粉丝是主播核心资产，跳槽主播常遭旧东家水军打压，星耀以公司承担运营风险区别于鼎盛的罚款文化
  - 豪门争产生态：宋家找回失散女儿先逼签放弃继承协议，并急于销毁生母死亡档案，暗示孩子当年的遗失另有隐情
  - 月牙湾山庄地下藏有秘密，牵涉安娜母亲的过去与李家、俄罗斯索科洛夫家族的勘探合作
  - 商战规则：林野惯用资本手段反杀，买债权代替起诉，用债务关系反向拿捏对手
  - 林野一方资金体量极大，可单笔支付三十七亿现金收购债权，并以十亿注册资金设立研究院

regions:
  - name: 月牙湾
    description: 林野的山庄与产业核心，李家想要其商业开发优先权乃至地下
    scenes:
      - 首播工坊
      - 东门
  - name: 江城
    description: 林野与星耀传媒所在城市，水军案与黑金酒会事发地
    scenes:
      - 江城国际金融中心顶层
      - 北城区
      - 江城外海
  - name: 省城
    description: 宋家经营四十年的商业大本营，星耀进军的目标城市
    scenes:
      - 省城文化产业园
      - 省城旧城区
  - name: 省江高速
    description: 连接省城与江城的高速公路，赵阔设伏截杀林野之地
  - name: 零号矿区
    description: 俄文档案中的矿区，李家联合勘探人尼古拉·索科洛夫曾在此工作，关联安娜父亲下落

factions:
  - name: 星耀传媒
    summary: 林野旗下传媒公司，以首播与网红孵化为主业，正进军省城
    territory: 江城、省城
    key_members: [林野, 陈子豪, 苏星彤, 沈嘉欣, 猫七, 小惠, 小雯, 小薇]
  - name: 林家投资
    summary: 林野新注册的投资公司，持有买来的十七份债权，名字被苏星彤调侃像村口棋牌室
    key_members: [林野]
  - name: 星耀古建研究院
    summary: 全书结尾注册的古建研究机构，注册资金十亿，专利由双胞胎个人与研究院共同持有
    key_members: [小雯, 小薇]
  - name: 鼎盛娱乐
    summary: 赵阔创办的旧经纪公司，惯以罚款压榨主播，雇水军打压跳槽主播与对手
    territory: 江城
    key_members: [赵阔]
  - name: 海盛数据
    summary: 替赵阔结算水军佣金的壳公司，资金走地下钱庄，总账户被林野冻结后崩盘
  - name: 宋氏文化集团
    summary: 宋家在省城的产业主体，经营网红基地与文化生意，账面光鲜实则负债高企
    territory: 省城
    key_members: [宋远山, 宋婉儿]
  - name: 宋氏商会
    summary: 宋家把持的省城商业圈组织，以规程与信誉评估排斥外地企业
  - name: 李家
    summary: 江城豪门，出价十二亿收购星耀，真实目标月牙湾山庄地下，与俄罗斯索科洛夫家族有多年合作
    territory: 江城
    key_members: [李明哲]
  - name: 索科洛夫家族
    summary: 俄罗斯家族，安娜的父族，尼古拉·索科洛夫曾为李家联合勘探人
    key_members: [尼古拉·索科洛夫, 安娜]
  - name: 诺曼国际建筑设计公司
    summary: 国际建筑公司，欲三十万买断双胞胎自锁承重结构全球使用权，反被林野宣布注资十亿

characters:
  - name: 林野
    gender: 男
    identity: 星耀传媒创始人，前程序员出身的收租地主兼资本操盘手
    personality: 遇事冷静，反击精准狠辣，对自家主播护短，口头承诺必兑现
    relationship: 苏星彤、小惠、安娜等称其叔，是整个团队的主心骨
    quotes:
      - chapter: 第94章 擦边风波，重拳出击
        context: 向被水军围攻的新签主播猫七表态，星耀替主播扛风险
        text: 星耀花钱签你，是让你赚钱，不是让你替公司挡刀。
      - chapter: 第97章 四平公主的嫉妒与代价
        context: 定下不起诉、买债权反制宋婉儿的打法
        text: 我让她换个地方看账单。
      - chapter: 第99章 赵阔的反扑，困兽之斗
        context: 独自驶向设伏的省江高速，追查被掳的档案员
        text: 他们带着档案员，信号就在前面。
  - name: 苏星彤
    gender: 女
    identity: 星耀传媒主播，兼管山庄菜地，林野团队的嘴替与救场担当
    personality: 嘴毒胆大，敢闹敢骂，护己方的人，谈判桌上敢坐桌子
    relationship: 称林野叔，与小惠以姐妹相处
    quotes:
      - chapter: 第94章 擦边风波，重拳出击
        context: 接过猫七首播安抚观众，暗讽水军刷屏
        text: 各位老铁，刚才首播间排水系统坏了，粪坑排毒一样哗哗往外冒，现在维修完毕。
      - chapter: 第98章 进军省城，精神小妹的降维打击
        context: 坐上宋家谈判桌回敬对方抢话
        text: 我坐你们宋家的桌子，总比你们宋家坐银行的催款单体面。
      - chapter: 第99章 赵阔的反扑，困兽之斗
        context: 被林野赶下护送车队时放狠话
        text: 叔，你敢少根头发回来，我把赵阔祖坟做成旅游打卡点。
  - name: 小惠
    gender: 女
    identity: 星耀主播，本名宋小惠，宋家流落在外的亲生女儿
    personality: 温和善良，不愿害人，但对身世真相执着
    relationship: 称林野叔，宋婉儿同父异母的姐姐，生母登记为王氏（王秀芹）
    appearance:
