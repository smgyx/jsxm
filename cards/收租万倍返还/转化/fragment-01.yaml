important_chapters:
  - chapter: 第1章 收租万倍返还？
    reason: 神级收租系统绑定，万倍返还核心金手指与奖励机制首次揭示，全书主线起点
    quotes:
      - context: 系统绑定后的规则宣告，确立核心金手指
        function: 世界观揭示
        text: 【核心功能，您名下搜友不动产的租金收入，系统将以万倍返还的形式返还至您的个人账户。】
      - context: 系统说明附加奖励机制
        function: 世界观揭示
        text: 【附加功能：每次返还，随机获得黑科技图纸，商业版图，技能……等您探索】
  - chapter: 第2章 叔，你不会是想磕我吧！
    reason: 三名精神小妹首次登场，日租五十元成交，主角与租客团体的相遇起点
    quotes:
