        function: 人物塑造
        text: 叔，你不会是想磕我吧？
  - chapter: 第4章 三英战老娘
    reason: 王秀芹下达国庆带对象回家的最后通牒，催生三英战老娘计划，成为收留姑娘们的动机
    quotes:
