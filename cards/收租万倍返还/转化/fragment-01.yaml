chapters:
  - name: 第1章 收租万倍返还？
    notes: 林野回江城相亲，周克梅开出彩礼四十万、婚后不同住、五年不要孩子、弟弟买车要表示的连环条件，林野离席抽烟时神级收租系统绑定，宣告名下不动产租金万倍返还并随机奖励黑科技图纸，他随即盘算抬高租金基数。
  - name: 第2章 叔，你不会是想磕我吧！
    notes: 林野在街头遇到三个找住处的精神小妹，领头的苏星彤怀疑他不安好心，当面问他是不是想磕她，三人密谋后决定接受日租五十元的别墅，小惠饿得肚子咕咕叫，暴露三人已身无分文。
  - name: 第3章 成大事者不惧小姐，更何况我是小妹
    notes: 林野带三人参观叠墅，地下一层的台球桌和茶室令三人惊叹，三人齐声选住地下室，苏星彤荤话打趣占他便宜，林野上楼试用系统奖励的龙精虎猛与百毒不侵技能，被苏星彤嘀咕是不是上楼自导自演。
  - name: 第4章 三英战老娘
    notes: 王秀芹电话拆穿林野的谎言，下达国庆必须带一个活的对象回家的最后通牒，否则告诉他爸，林野看到洗完澡素颜的三个姑娘，心生带三个精神小妹回家三英战老娘、让老妈顾不上审他的计划。
  - name: 第5章 这精神小妹能处，有事儿真上啊
    notes: 烧烤摊上林野请客，周克梅前来讥讽他翘单穷酸，苏星彤挺身护叔反骂她身材，当众强亲林野，小惠和沈嘉欣一人搂住一条胳膊宣誓主权，最后一名地中海发型的中年男人从帕萨特上下来。
  - name: 第6章 三个臭皮匠！
    notes: 三人报上姓名来历：苏星彤十九岁黑省人高中辍学，宋小惠是她初中同学，沈嘉欣是网吧结识，三人被假招聘骗来江城身无分文，苏星彤还传授碰瓷讹钱的空手套白狼理论，令林野大受震撼。
  - name: 第7章 收租黑丝！奖励……
    notes: 深夜林野测试技能，五分钟平板支撑面不改色，腹肌成形，苏星彤撞见他赤裸上身吞口水，随后提出没钱交租，用黑丝袜作价八十块抵明天房租，林野想到任何租金都能触发万倍返还便答应。
  - name: 第8章 叔，实在不行我让你磕一下吧？
    notes: 小惠被苏星彤呼噜吵得睡不着，溜上二楼摸黑睡进林野主卧，林野拉肚子回床误抱了她，惊叫吵醒众人，苏星彤和沈嘉欣冲上楼看到暧昧一幕，误会两人有了关系。
  - name: 第9章 这是嘎哈呢，你们真是害苦了我啊！
    notes: 林野赶走三个满口虎狼之词的姑娘，凌晨苏星彤溜进主卧趴在他床尾，两人发生关系，苏星彤事后点破自己越大大咧咧越安全的处世哲学，又问他咱俩算什么关系，关系质变。
  - name: 第10章 你这个上个世纪的老古董，怎么一点都不封建啊
    notes: 三人主动打扫卫生并轮番亲吻林野，苏星彤称他老古董不封建，暴露三人身份证被骗子KTV的卢冰雁扣押，林野决定带她们补办，出门时三人被他的黑色路虎揽胜江G88888车牌震住。
  - name: 第11章 叔，你搁着养死士呢？
    notes: 派出所里撞见被铐的卢冰雁，她开价捞人才肯交出身份证被林野晾在一边，同案十八岁的陈小雯主动透露证件藏在日租房行李箱，林野替她赔钱撤诉带她上车吃饭，得知她与妹妹双双被骗来江城。
  - name: 第13章 姐妹花抵租，楼上楼下都是家
    notes: 陈小雯用密码打开行李箱取回三人身份证，妹妹陈小薇解下亡母留下的银脚链抵赔款，林野收下后系统触发全部身家、亲情羁绊与姐妹花联动加成，奖励翡翠湾B栋上叠产权证，姐妹俩入住别墅成为新租客。
  - name: 第14章 精神小妹反围猎
    notes: 手机店里五个姑娘嫌贵拦着林野不让买，恰好撞见周克梅与地中海来买玫瑰金新机，苏星彤嘲讽她口红色号，沈嘉欣设局装天真忽悠地中海帮忙参考手机，五人将其围成C字形套路。
  - name: 第15章 精神小妹五打一，地中海血亏出局
    notes: 小惠以身材压制、小薇楚楚可怜、小雯沉默认同，配合沈嘉欣甜笑逼得地中海上头刷卡买下五台旗舰机共三万四千五，周克梅与他当场闹翻撂话我们完了，五人拎走手机全身而退，地中海放话要找人弄林野。
  - name: 第16章 精神小妹硬砍价， 砍价砍到老板叫妈
    notes: 林野带五人逛火车站步行街买衣，苏星彤领衔轮番砍价把两千三的衣服砍到七百成交，还自掏余钱垫付，林野久违地真心笑了，离开时撞见发小赵强，对方惊喜地注意到他身后的五个姑娘。

worldview:
  - 现代都市背景：林野三十岁，魔都大厂技术出身的项目负责人，月薪30K，被组织架构调整裁员后带两百万存款回到十八线小县城江城买房买车躺平
  - 神级收租系统：检测到宿主强烈情绪波动时绑定，核心功能为宿主名下所有不动产的租金收入以万倍返还至个人账户（绑定宣告称神级收租系统，服务提示自称审计收租系统）
  - 系统附加功能：每次返还随机获得黑科技图纸、商业版图、技能与未知奖励，供宿主探索
  - 返还品级与租金基数挂钩：林野判断低租金基数对应低返还品级，追求利益最大化需抬高租金
  - 租金形式不限：租户交付且被系统认定为租金的物品均可触发万倍返还，丝袜与银脚链皆可作租金
  - 特殊判定加成：租户交付最珍贵之物触发全部身家加成与亲情羁绊加成，双胞胎姐妹身份触发姐妹花联动加成，奖励可为房产产权证
  - 技能实感：龙精虎猛带来爆发体能与不衰精力，林野体格由面黄肌瘦重塑为精干匀称；百毒不侵在本片段内未展示实际效果
  - 小县城生态：三十岁不结婚被视为大逆不道，婚育压力大于事业压力；假招聘扣押身份证的骗局横行，流浪青年求职出行处处受限
  - 主线动机：王秀芹以告状为威胁限令林野国庆假期带一个对象回家，直接催生收留精神小妹以应付催婚的计划

regions:
  - name: 江城
    description: 十八线小县城，林野的家乡，他裁员后回此买大平层与车子躺平，婚育压力沉重
    scenes:
      - 翡翠湾别墅区
      - 张哥的烧烤摊
      - 派出所
      - 手机专卖店
      - 火车站步行街
      - 卢冰雁的日租房
  - name: 江城翡翠湾别墅区
    description: 林野所购叠墅所在小区，上下三层带院子，收下银脚链奖励前同栋上叠尚未卖出
    scenes:
      - 叠墅院子（两棵桂花树）
      - 一楼客厅
      - 二楼主卧（带独立卫生间）
      - 地下一层（九尺台球桌、采光井小茶室、玻璃推拉门卧室）
  - name: 魔都
    description: 林野打拼十年的大城市，大厂驻地，被裁后离开返乡
    scenes:
      - 大厂食堂（林野梦境场景）

factions:
  - name: 精神小妹团体
    summary: 从外地流浪到江城的年轻姑娘团体，以苏星彤为首，日租入住林野的叠墅，与他形成家人式的租客关系
    territory: 江城翡翠湾别墅区
    key_members:
      - 苏星彤
      - 宋小惠
      - 沈嘉欣
      - 陈小雯
      - 陈小薇
  - name: 卢冰雁诈骗团伙
    summary: 以KTV包吃包住的假招聘诱骗外地姑娘来江城并扣押身份证的黑中介，卢冰雁因超市飞单被治安官抓获
    territory: 江城
    key_members:
      - 卢冰雁

characters:
  - name: 林野
    gender: 男
    age: 30
    appearance:
      - 一米八二身高
      - 受龙精虎猛技能影响，体格由大厂熬出的面黄肌瘦版本重塑为精干匀称、腹肌清晰
    identity: 前魔都大厂项目负责人（技术出身，月薪30K被裁员），江城翡翠湾叠墅业主，神级收租系统宿主
    personality: 躺平佛系但有商业嗅觉，对姑娘们嘴硬心软、包容纵容，行事带大厂式的风险合规意识
    relationship: 五个精神小妹的房东与依靠（被叫叔），周克梅的前相亲对象，王秀芹之子，赵强的发小
    quotes:
      - chapter: 第1章 收租万倍返还？
        context: 忍受不了周克梅的连环择偶条件，借口离席
        text: 大概情况我都知道了，我出去抽根烟。
      - chapter: 第2章 叔，你不会是想磕我吧！
        context: 向怀疑他是拐子的苏星彤三人解释租房动机
        text: 我就是房东，房子空着也是空着，租出去还能赚个水电费，就这么简单。
      - chapter: 第6章 三个臭皮匠！
        context: 听完苏星彤碰瓷讹钱的空手套白狼理论后的由衷感叹
        text: 我不理解，但我大受震撼。
      - chapter: 第9章 这是嘎哈呢，你们真是害苦了我啊！
        context: 深夜发现苏星彤趴在自己床尾时的崩溃台词
        text: 这是嘎哈呢！你们真是害苦了我啊！
      - chapter: 第13章 姐妹花抵租，楼上楼下都是家
        context: 弹陈小薇脑门，让她安心欠租入住
        text: 以后有钱了照交，不急在这一时。
  - name: 苏星彤
    gender: 女
    age: 19
    appearance:
      - 一米六五往上，黑色紧身背心露肚脐配破洞牛仔短裤
      - 三色高马尾（发根黑、中段脏橘色、发尾荧光绿）
      - 浓烟熏妆、暗红口红、嘴角小痣、小虎牙
      - 一条腿纹青龙（从脚踝盘到大腿根），另一条腿纹下山猛虎
      - 素颜皮肤白得发光，不化妆比化妆好看十倍；夜里穿黑色丝袜
    identity: 精神小妹团体领头人（彤姐），黑省来的流浪打工者，林野的第一个租客
    personality: 混不吝嘴炮王，大大咧咧是保护色，重情义护短，砍价碰瓷等江湖生存手段娴熟
    relationship: 林野的租客，已与他发生关系并公开宣示主权；宋小惠的初中同学兼老大姐
    quotes:
      - chapter: 第2章 叔，你不会是想磕我吧！
        context: 初次打量林野后的直球发问
        text: 叔，你不会是想磕我吧？
      - chapter: 第3章 成大事者不惧小姐，更何况我是小妹
        context: 参观地下室后被折服，荤话打趣占林野便宜
        text: 叔，江湖儿女，不惧小姐，更何况我们还是小妹。
      - chapter: 第5章 这精神小妹能处，有事儿真上啊
        context: 挡在林野身前反击周克梅的挑拨
        text: 我就沉迷我叔的盛世美颜怎么了？我就愿意怎么了？碍着你了？
      - chapter: 第5章 这精神小妹能处，有事儿真上啊
        context: 当众骂周克梅身材的名场面
        text: 有缸粗没缸高，除了屁股全是腰。
      - chapter: 第6章 三个臭皮匠！
        context: 向林野传授碰瓷讹钱的江湖生存学
        text: 叔，这叫用魔法打败魔法。江湖人嘛，得灵活。
      - chapter: 第7章 收租黑丝！奖励……
        context: 没钱交租，提出用黑丝袜抵房租
        text: 叔，黑丝能当租金不？
      - chapter: 第9章 这是嘎哈呢，你们真是害苦了我啊！
        context: 两人发生关系后，解释自己大大咧咧是保护色
        text: 叔，这你就不懂了吧，人在江湖飘，哪能不挨操，我越表现得大大咧咧，越安全知道不？
      - chapter: 第10章 你这个上个世纪的老古董，怎么一点都不封建啊
        context: 调侃林野不肯接受三妻四妾式的待遇
        text: 叔，你这个上个世纪的老古董，怎么一点都不封建啊。
      - chapter: 第10章 你这个上个世纪的老古董，怎么一点都不封建啊
        context: 交代身份证被扣的来龙去脉，供出骗子姓名
        text: 一个姓卢的女的，叫卢冰雁，就是她在网上忽悠我们来江城的。
      - chapter: 第16章 精神小妹硬砍价， 砍价砍到老板叫妈
        context: 服装店砍价收官，搂住老板肩膀打出人情牌
        text: 叔儿，您看看我们几个，从外地漂过来的，身上没几个钱，来你这买衣服是看得起你家质量好，您就当交个朋友，七百五，七百五拿走，以后我们姐妹在江城站稳了，第一个来你家买。
  - name: 宋小惠
    gender: 女
    age: 18
    appearance:
      - 圆润身材，圆嘟嘟的脸蛋，胸前丰满（源文反复强调）
      - 常穿浅蓝色宽松T恤
    identity: 苏星彤的初中同学兼同伴，流浪打工者，林野的租客
    personality: 软糯害羞、天然无辜，关键时刻意外大胆，从小神经衰弱怕吵
    relationship: 苏星彤的姐妹，称林野为林叔并逐渐依赖他
    quotes:
      - chapter: 第6章 三个臭皮匠！
        context: 附和苏星彤的碰瓷理论，举出柳州旧事
        text: 彤姐说的对，上次在柳州，有个大叔推了彤姐一下，赔了一千五。
      - chapter: 第8章 叔，实在不行我让你磕一下吧？
        context: 误睡林野主卧被抓包后，红着脸表态
        text: 林叔人好，我不吃亏。
      - chapter: 第10章 你这个上个世纪的老古董，怎么一点都不封建啊
        context: 赞同苏星彤的言论，说出虎狼之词
        text: 是啊叔，我们一世人，好姐妹，同一根鸡鸡用到废！
  - name: 沈嘉欣
    gender: 女
    age: 18
    appearance:
      - 瘦弱，刘海遮半边脸
      - 眼睛大得占脸三分之一，睫毛又长又翘
    identity: 苏星彤在网吧结识的同伴，流浪打工者，林野的租客
    personality: 安静寡言、存在感低，惯于弱弱补刀，外表天真内里极有心机，设套精准
    relationship: 苏星彤的姐妹，林野的租客，团体设局时的军师型角色
    quotes:
      - chapter: 第6章 三个臭皮匠！
        context: 纠正苏星彤说自己是被捡来的说法
        text: 不是捡的，是彤姐在网吧里遇见的。
      - chapter: 第9章 这是嘎哈呢，你们真是害苦了我啊！
        context: 弱弱补刀劝林野保重身体
        text: 叔，咱几个把日子过好比啥都强。不过…你可千万注意身体啊，别太操劳了。
      - chapter: 第14章 精神小妹反围猎
        context: 手机店里设局，装天真忽悠地中海帮忙参考
        text: 大叔，您看起来好有实力啊，那我们几个也想看看手机，能不能请您帮忙参考一下？我们都不太懂这些。
  - name: 陈小雯
    gender: 女
    age: 18
    appearance:
      - 极瘦，脸颊凹陷，圆眼睛翘鼻头，嘴唇干裂起白皮
      - 与陈小薇长相一模一样（双胞胎）
    identity: 卢冰雁假招聘骗局受害者，陈小薇的双胞胎姐姐，林野的新租客
    personality: 胆小拘谨、规矩隐忍，护妹心切，绝境中敢孤注一掷抓住机会
    relationship: 受林野搭救的租客，带妹妹陈小薇一同入住别墅
    quotes:
      - chapter: 第11章 叔，你搁着养死士呢？
        context: 在派出所孤注一掷，主动向林野提供证件下落
        text: 叔，我也知道身份证在哪。
      - chapter: 第11章 叔，你搁着养死士呢？
        context: 向苏星彤与林野自述受骗经过
        text: 之前在网上看到她发的招聘信息，说KTV包吃包住，我就带着我妹妹过来了。结果到了就被扣了身份证，KTV也早就关了。
  - name: 陈小薇
    gender: 女
    age: 18
    appearance:
      - 与姐姐陈小雯一个模子刻出来的圆眼睛
