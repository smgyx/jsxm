    identity: 星耀传媒新老板，前魔都大厂员工（大厂十年月薪三万），翡翠湾整栋叠墅的房东
    personality: 沉默寡言、外冷内热，遇事淡定不炫耀不解释，被真心相待时容易眼眶发酸
    relationship: 五个精神小妹的房东兼老板，苏星彤与宋小惠的情人，李知盈的高中同学，赵强的发小，王秀芹的长子，林小鹿的哥哥
    quotes:
      - chapter: 18-星耀传媒，新官上任第一把火
        context: 面对闯入办公室挑衅的钱志国
