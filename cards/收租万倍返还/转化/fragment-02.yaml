    identity: 精神小妹的头目，星耀传媒签约艺人，计划做直播
    personality: 嘴碎话痨、大大咧咧行动力强，护主敢怼人，吃醋时藏不住
    relationship: 林野的情人，自称是林野的财神爷，宋小惠等人叫她彤姐
    quotes:
