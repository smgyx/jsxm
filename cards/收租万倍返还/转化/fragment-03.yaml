chapters:
  - name: 31-晨间兵荒马乱，闺蜜天团上工了
    notes: 电梯公司陈工勘测叠墅，林野激活建筑改造许可证把实际工期暗压到十天；陈子豪交出五账号矩阵方案，苏星彤明日开播；王秀芹微信通知妹妹后天到；林野买女式用品布置B栋主卧，插桂花想起林蔓小时候最爱桂花味。
  - name: 32-火车站接妹，精神小妹严阵以待
    notes: 林野回忆林小鹿十二岁当众朗读情书并评“我哥他不配”的战绩，备好三套说辞又全删；家具到家，龙精虎猛让他单手抬实木床；带苏星彤小惠去火车站，接到二十二岁一米六八的林小鹿，她发现哥哥变壮、穿上了始祖鸟。
  - name: 33-精神小妹见亲妹
    notes: 林小鹿入住翡翠湾，见到全部精神小妹：自称十九让叫彤姐的苏星彤、十八的宋小惠、沈嘉欣和双胞胎；苏星彤自称是你哥的女人；林小鹿感慨原以为妈大惊小怪，现在觉得她还是保守了，把林野叫到一边要他答应一件事。
  - name: 34-磨合之夜，精神小妹与亲妹初交锋
    notes: 林野掌勺五个菜接风，饭桌上林小鹿盘出五人籍贯并追问房租，林野以市场价搪塞，没法解释首笔租金五块钱与一双原味黑丝；夜里苏星彤开紧急会议，要求在林小鹿面前收敛并暂停夜间行动；林野独自面对空荡的床。
  # 源文件第34章后直接第36章，无第35章
  - name: 36-再见卢冰雁
    notes: 晨间全员化妆大乱：苏星彤画出战斗妆被林野勒令卸掉重画，小惠假睫毛被喷嚏崩掉，沈嘉欣夹半扎发型，双胞胎穿同款卫衣；林小鹿白polo衫高腰宽腿裤出场；六人乘凯雷德出发，苏星彤爆料车价一百三十六万八落地。
  - name: 37-一个打一群，阿威十八式显威
    notes: 卢冰雁男友率六人围堵讨要身份证，苏星彤抠路沿石、小惠捡砖护主；林野以阿威十八式四十五秒放倒六人；红裙姑娘当众求处对象；苏星彤从背后搂腰宣示主权，一脚踹倒想溜的卢冰雁，众人驾车扬长而去。
  - name: 38-狂刷百万，我哥被富婆快乐球了？
    notes: 回公司后苏星彤把ID从彤彤爱吃糖改为江城第一小钢炮开播，在线人数惨淡；林野首次激活系统刚奖励的读心术，听到林小鹿怀疑他被富婆包养还想蹭零花钱；他连充五次各十万钻石砸进直播间。
  - name: 39-连麦PK，青龙威武
    notes: 钱志国花两万给卢冰雁买首页推荐，流量反被小钢炮吸走，在线冲到十五万，榜一“叔”刷了一百万；钱志国让卢冰雁主动连麦PK引流，卢冰雁跳大摆锤被弹幕嘲；苏星彤应战，让小惠端出不锈钢盆东北大冷面开吃。
  - name: 40-我来收租的，砸了改洗浴中心
    notes: 夜里林野带六个姑娘到江城CBD商业综合体A座，地中海保安拦人；林野拍出系统存入物品栏的产权证自称来收租，放话三分钟不见负责人就把三栋楼砸了改洗浴中心；物业总经理张强带八主管鞠躬，林小鹿三观震碎。
  - name: 41-老板，他们欠租了吗？
    notes: 张强查实张少磊名车汇无欠租；林野决意单方面解约，自付两个月约七十万违约金并限次日清场，盘算收回铺面重租可吃万倍返还；张少磊携李知盈出言嘲讽，被张强当众揭穿林野是三栋楼唯一大业主，张少磊腿软。
  - name: 42-旋转餐厅的凡尔赛，精神小妹的吃货觉醒
    notes: 张强引入专属电梯登上CBD顶层“云端”旋转餐厅，林野点七份主厨套餐配年份香槟；林小鹿追问财富来源，林野以投资风口搪塞；苏星彤想攒金箔去金店卖，尝鹅肝后喊好吃到想哭；第二道菜是A5和牛。
  - name: 43-豪车尾随，路边草丛里的野生小妹
    notes: 回程发现灰白五菱宏光尾随，林野故意拐进林荫小路逼停；车上下来粉色短发与扎辫子两个瘦小女孩求收留，自曝是卢冰雁跟班，被打得新伤叠旧伤还被逼偷超市东西；两人偷了卢冰雁男友的五菱宏光钥匙趁乱出逃。
  - name: 44-原装小妹求收编，精神圈子里的暗流
    notes: 周小萌赵悦以原装没拆封自荐，爆料圈内叫卢冰雁百家雁，扬言纹白虎朱雀凑一桌麻将；抛出关键情报：有人花两千块信息费经卢冰雁那条线打听小惠住址；小惠强装平静睫毛却颤动；林野决定收留两人，规矩一样交租。
  - name: 45-叔，我有七个了
    notes: 周小萌赵悦抢做早餐，焦煎蛋糊粥被苏星彤打59分；林小鹿数出家里七个姑娘，讥讽这是翡翠湾收容所；小惠笑眯眯如常，林野记得她昨夜说再多一天；林野带两人补办身份证，试用期八千；周小萌会街舞，赵悦会画画。
  - name: 46-举报十七次，叔的刀还没凉呢
    notes: 派出所补出临时身份证；陈子豪三条消息：举报号批量注册指向江城网吧、平台降权三天、翠翠新号挂金鼎传媒抄袭话术；林野布置存档时间戳养肥一锅端，安排周小萌走街舞、赵悦走绘画方向；沈嘉欣报告小惠走神躲厕所哭。
  - name: 47-请客的人跑了，床冷了才知道慌
    notes: 小惠用第一个月工资请客吃火锅，737块，给每人点专属菜、替林野拧瓶盖，周到得反常；林小鹿提醒这要么是大决定要么是告别，离校前嘱托盯紧小惠；深夜无人来闹，小惠消息已读不回，林野下楼敲门，苏星彤隔门应声。

worldview:
  - 收租万倍返还：系统核心规则，名下不动产的租金可获得万倍返还，收回铺面重新租出去又是一笔进账
  - 系统道具录入：许可证与产权证可由系统录入技能库或物品栏，心中激活即生效，无需实体证件，激活时无提示音无特效
  - 直播平台生态：钻石打赏、神龙礼物特效、连麦PK、付费首页推荐、批量注册账号恶意举报与违规降权处罚
  - 精神小妹圈子：底层精神小妹的圈子文化，圈内互起绰号（卢冰雁被叫百家雁），花信息费即可打听人的下落

regions:
  - name: 翡翠湾
    description: 江城高档叠拼别墅小区，林野名下房产，B栋上叠与地下室打通约五百多平，院中有两棵桂花树
    scenes: [B栋上叠主卧, 一楼东侧空房间, B栋三楼房间, 地下一层, 院子]
  - name: 星耀传媒
    description: 林野创办的传媒公司，运营精神小妹主播账号矩阵
    scenes: [办公区, 会议室]
  - name: 江城CBD商业综合体
    description: 江城消费最高的CBD，三栋玻璃幕墙大厦均为林野产权，配物业大厅与顶层旋转餐厅
    scenes: [A座物业大厅, 名车汇, “云端”旋转餐厅]
  - name: 江城
    description: 故事发生的城市，林小鹿乘高铁抵达的火车站与火锅店、派出所均在此处
    scenes: [火车站出站口, 火锅店, 派出所]

factions:
  - name: 星耀传媒
    summary: 林野创办的传媒公司，运营精神小妹主播账号矩阵
    territory: 江城
    key_members: [林野（老板）, 陈子豪（运营总监）, 苏星彤, 宋小惠, 沈嘉欣, 小雯, 小薇, 周小萌, 赵悦]
  - name: 金鼎传媒
    summary: 对头公司，签走翠翠新号并纵容批量举报与话术抄袭打压星耀传媒，幕后十有八九是钱志国
    key_members: [钱志国（十有八九）, 翠翠]

characters:
  - name: 林野
    gender: 男
    appearance:
      - 站在人群中高出周围人一截，被林小鹿说变壮了
      - 常穿始祖鸟冲锋衣（别人送的）
    identity: 收租万倍返还系统宿主，星耀传媒老板兼江城CBD三栋大厦业主，曾在魔都大厂做了十年程序员后被裁
    personality: 淡定豪横，护短心细，对亲人嘴硬心软
    relationship: 王秀芹之子，林小鹿之兄，七位精神小妹的房东兼老板
    quotes:
      - chapter: 40-我来收租的，砸了改洗浴中心
        context: 保安以衣冠不整拦人，林野亮出产权证放话
        text: 去把你们物业的最高负责人叫出来。三分钟内我看不到人，明天我就把你们这三栋高档写字楼全部砸了，改成江城最大的连锁洗浴中心。到时候，我就让你来门口穿个红马甲发小卡片。
      - chapter: 46-举报十七次，叔的刀还没凉呢
        context: 决定不归还偷来的五菱宏光，向周小萌赵悦表态
        text: 卢冰雁要报警就报，偷你们身份证的账还没跟她算完。
  - name: 林小鹿
    gender: 女
    age: 二十二岁
    appearance:
      - 一米六八，马尾辫，牛仔外套配帆布鞋
      - 尖下巴杏仁眼皮肤白，五官随母亲王秀芹，表情灵动中带着欠揍感
    identity: 林野的亲妹妹，在读大学生
    personality: 嘴皮子完全继承王秀芹，眼睛毒辣，对哥哥有过度保护欲
    relationship: 林野之妹，王秀芹之女
    quotes:
      - chapter: 32-火车站接妹，精神小妹严阵以待
        context: 十二岁时当众朗读塞进哥哥课桌的情书并加评语，从此无人敢给林野写情书
        text: 我哥他不配，你换一个吧。
      - chapter: 33-精神小妹见亲妹
        context: 见到五个精神小妹后评价妈妈的判断
        text: 现在我觉得她还是保守了。
      - chapter: 45-叔，我有七个了
        context: 早餐桌上数出家中七位姑娘后吐槽
        text: 哥，你这不是翡翠湾别墅了，你这是翡翠湾收容所，民政局应该给你发面锦旗。
      - chapter: 47-请客的人跑了，床冷了才知道慌
        context: 火锅桌上向哥哥点破小惠的反常
        text: 一个人突然变得特别好、特别周到、对谁都笑，通常只有两个原因。要么她做了一个很大的决定，要么她在跟所有人告别。
  - name: 苏星彤
    gender: 女
    age: 十九岁
    appearance:
      - 三色头发扎丸子头，嘴角一颗痣，笑起来露两颗虎牙
      - 身高一米八二，腿上有青龙纹身
    identity: 星耀传媒签约主播，辣评型女主播，首播ID从彤彤爱吃糖改为江城第一小钢炮，黑省人
    personality: 嘴皮子利索脾气冲，护主心切，自来熟爱张罗
    relationship: 林野的租客兼主播，自称你哥的女人，闺蜜天团的主心骨
    quotes:
      - chapter: 34-磨合之夜，精神小妹与亲妹初交锋
        context: 林小鹿上楼后召集紧急会议，安排全员收敛暂停夜访
        text: 忍几天，等她走了咱再恢复营业。
      - chapter: 37-一个打一群，阿威十八式显威
        context: 围堵来临前推开林野的阻拦，抱着路沿石护主
        text: 叔你让什么让，我护着你呢。
      - chapter: 39-连麦PK，青龙威武
        context: 应下卢冰雁的连麦PK挑衅
        text: 老娘的才艺就是专治各种绿茶不服，接了！
      - chapter: 44-原装小妹求收编，精神圈子里的暗流
        context: 驳回周小萌赵悦的原装自荐
        text: 你俩少搁这跟我叔卖什么原装不原装的，我叔又不是拼夕夕买手机，还在乎你正品水货？再说了，我们这编制己经满了，七个人的大通铺你们知道多挤吗？
  - name: 宋小惠
    gender: 女
    age: 十八岁
    appearance:
      - 圆嘟嘟的脸白得发光，身材丰满（吃播画面里胸前占了不少比例）
    identity: 星耀传媒吃播主播，黑省人，与苏星彤同市
    personality: 平时没心没肺贪吃爱撒娇，近反常周到像在告别，明显藏有心事
    relationship: 林野的租客兼主播，夜里与林野亲近，说过再多一天
    quotes:
      - chapter: 44-原装小妹求收编，精神圈子里的暗流
        context: 听到有人花信息费打听自己下落，故作轻松带过
        text: 可能是什么追求者吧，我以前在老家那边还挺受欢迎的。
      - chapter: 47-请客的人跑了，床冷了才知道慌
        context: 回程路上破天荒提出请全员吃饭
        text: 就不能让我大方一回？第一个月工资到手了，总得意思一下吧。叔，我想请所有人，你也算上。
  - name: 沈嘉欣
    gender: 女
    identity: 星耀传媒幕后成员，负责视频剪辑并规划剪辑教学号，赣省人
    personality: 安静细腻，观察入微，会默默照顾人（剥虾放进林野碗里）
    relationship: 林野的租客兼员工
    quotes:
      - chapter: 46-举报十七次，叔的刀还没凉呢
        context: 走廊里向林野报告小惠的异常状态
        text: 但是她今天上午去了两趟厕所，回来的时候眼圈都红了。我怕……
  - name: 小雯
    gender: 女
    appearance:
      - 与小薇长着两张一模一样的脸
    identity: 星耀传媒双胞胎日常号主播，走温馨搞笑路线，贵省人
    personality: 文静黏人，与妹妹默契同步
    relationship: 林野的租客兼主播，小薇的双胞胎姐妹
  - name: 小薇
    gender: 女
    appearance:
      - 与小雯长着两张一模一样的脸
    identity: 星耀传媒双胞胎日常号主播，走温馨搞笑路线，贵省人
    personality: 文静黏人，与姐姐妹妹默契同步
    relationship: 林野的租客兼主播，小雯的双胞胎姐妹
  - name: 陈子豪
    gender: 男
    appearance:
      - 戴眼镜，头发不算茂密
    identity: 星耀传媒运营总监
    personality: 执行力强操心细，规划周全，被老板的豪掷惊到失态
    relationship: 林野手下的运营总监
    quotes:
      - chapter: 46-举报十七次，叔的刀还没凉呢
        context: 向林野汇报恶意举报账号的调查结果
        text: 【举报账号查到了，批量注册，全是上个月同一天创建的，IP段指向江城本地一个网吧】
  - name: 王秀芹
    gender: 女
    identity: 林野与林小鹿的母亲
    personality: 行动派，嘴皮子利索，林小鹿的战斗力完全继承她的衣钵，五官温柔中带着压迫感
    relationship: 林野、林小鹿的母亲
  - name: 卢冰雁
    gender: 女
    appearance:
      - 高马尾浓妆，黑色蕾丝战袍配豹纹短裙，踩细高跟
      - 胸前两团为硅胶假体
    identity: 主播，ID冰冰爱跳舞，受钱志国扶持，精神圈绰号百家雁
    personality: 虚荣刻薄，虐待跟班（扣押身份证、殴打、逼偷东西），直播间靠擦边搏流量
    relationship: 钱志国扶持的主播，围堵林野未遂的领头者，周小萌赵悦的前上家
    quotes:
      - chapter: 39-连麦PK，青龙威武
        context: 连麦PK时嘲讽苏星彤靠大哥刷数据
        text: 有本事咱俩拼才艺啊，我给你跳个大摆锤！
  - name: 钱志国
    gender: 男
    identity: 对头公司老板（金鼎传媒幕后十有八九），卢冰雁的金主
    personality: 能力一般但恶心人专业，肯砸钱搞流量
    relationship: 林野与星耀传媒的对头
    quotes:
      - chapter: 39-连麦PK，青龙威武
        context: 把信用卡拍给卢冰雁让她刷钱发起连麦PK
        text: 刷，不够我再想办法。
  - name: 翠翠
    gender: 女
    identity: 星耀传媒前主播，离职带走四十多万粉丝，新号签约金鼎传媒并抄袭苏星彤的开场话术
