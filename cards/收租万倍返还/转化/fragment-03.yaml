important_chapters:
  - chapter: 33-精神小妹见亲妹
    reason: 亲妹与五个精神小妹首次同框交锋，家庭矛盾主线开启
    quotes:
      - context: 林小鹿见到五个精神小妹后评价妈妈王秀芹的判断
        function: 人物塑造
        text: 现在我觉得她还是保守了。
  - chapter: 37-一个打一群，阿威十八式显威
    reason: 阿威十八式首次实战展示，反杀卢冰雁一伙围堵的名场面
    quotes:
      - context: 林野迎击六名围堵者时技能发动的叙述
        function: 能力展示
        text: 系统解锁的阿威十八式在此刻绽放出了它应有的光彩。
  - chapter: 38-狂刷百万，我哥被富婆快乐球了？
    reason: 读心术首次使用（每日限3次），林野百万钻石捧苏星彤首播的开端
    quotes:
      - context: 林野闭眼默念激活读心术的系统提示
        function: 能力首次登场
        text: 【读心术（限定版）己激活，今日剩余使用次数：3】
  - chapter: 40-我来收租的，砸了改洗浴中心
    reason: CBD三栋楼产权首次曝光，林野的业主身份对林小鹿和读者揭示，扮猪吃虎名场面
    quotes:
      - context: 保安拦人后林野限物业负责人三分钟内出现
        function: 人物塑造
        text: 去把你们物业的最高负责人叫出来。三分钟内我看不到人，明天我就把你们这三栋高档写字楼全部砸了，改成江城最大的连锁洗浴中心。到时候，我就让你来门口穿个红马甲发小卡片。
  - chapter: 41-老板，他们欠租了吗？
    reason: 万倍返还系统规则首次明文揭示，张少磊遭解约打脸
    quotes:
      - context: 林野盘算收回名车汇铺面重新出租的收益
        function: 世界观揭示
        text: 系统规则里有一条：名下不动产的租金可获得万倍返还。
  - chapter: 44-原装小妹求收编，精神圈子里的暗流
    reason: 关键伏笔：有人花两千块信息费打听小惠下落，小惠身世悬念开启
    quotes:
      - context: 赵悦转述精神圈子里的打听消息
        function: 剧情转折
        text: 我们只听说有个人在卢冰雁那条线上问的，给了两千块信息费，要小惠姐现在住哪儿，跟谁在一起。
  - chapter: 47-请客的人跑了，床冷了才知道慌
    reason: 小惠告别式请客，深夜已读不回的悬念收尾，小惠疑似出走
    quotes:
      - context: 林小鹿在火锅桌上向哥哥点破小惠的反常
        function: 剧情高潮
        text: 一个人突然变得特别好、特别周到、对谁都笑，通常只有两个原因。要么她做了一个很大的决定，要么她在跟所有人告别。

