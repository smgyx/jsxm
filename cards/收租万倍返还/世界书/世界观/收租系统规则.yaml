系统名称: 收租万倍返还系统（原著：神级收租系统）
绑定时机: 相亲席上因强烈情绪波动绑定（原著第1章）。开场只绑定，不发奖励。第2章苏星彤交出全部身家5元后，才结算龙精虎猛与百毒不侵
核心机制（原著第7章林野亲口总结）:
  - 租金的形式不重要，重要的是租金承载的属性与附加值
  - 全部身家→全部身家加成；贴身之物→贴身加成；主动交付/改善房东亲属生活→心意加成；惩恶扬善→惩恶加成
  - 奖励由系统按"意义"生成：现金、实物、车辆、产权、股权、技能、资质——不是死板乘法（80元黑丝→320万路虎）
  - 日租日结：系统实时返还，租一天触发一次——这是<user>选择日租分租的原因（原著第1章盘算）
  - 反套利警告（原著第15章）：严禁向租户发放资金后二次回收作为租金，此行为判定为无效交易
返还形式: 现金、永久被动技能、产权（房产/车辆/股权/资质）、黑科技图纸、商业版图——按租金意义生成
结算细则（奖励形态与变量落账，形态优先对照原著事件链）:
  现金类: 计入 主角.资产.现金 与 主角.系统.累计返利（只增不减）
  资产类: 车辆 → 主角.资产.车辆 新增键；房产 → 主角.资产.房产 新增键；公司股权、经营实体 → 产业 用 add 完整建档；资质、许可证、图纸 → 主角.资产.道具 新增键。均不计入累计返利
  技能类: 追加 主角.系统.被动技能（对照被动表），首见播报【技能激活】
  图纸情报类: 剧情道具与线索，落 主角.资产.道具，不单开变量
  播报: 每笔结算一条【收租结算】，列明 租金→奖励形态→去向
原著奖励链（第1~100章，剧情推进的骨架，默认按此走）:
  - 第2章: 首笔租金5元（苏星彤全部身家）→ 龙精虎猛+百毒不侵
  - 第7章: 原味黑丝（估值80元，苏星彤）→ 路虎揽胜·创世加长版（320万）
  - 第13章: 银脚链（陈小薇最珍贵之物）→ 全部身家+亲情+姐妹花联动 → B栋上叠产权证（五卧大露台）
  - 第15章: 全新旗舰手机（6899元）→ 现金5000万 + 星耀传媒MCN公司100%股权
  - 第17章: 宋小惠贴身服务 → 隐藏判定：贴身服务加成 → 阿威十八式（宝儿姐版）
  - 第30章: 四人联合租金 → 稀有判定 → 现金8000万 + 建筑改造许可证（工期1/10）
  - 第35章: 满堂彩+静音挑战 → 现金2亿 + 江城CBD商业综合体（三栋写字楼底商）+ 读心术(限定版)
  - 第50章: 宋小惠灵魂契约·一生之约 → 黄金瞳
  - 第69章: 宅基地重建联合资金 → 建筑公司100%股权+一级资质+车队+现金2.5亿
  - 第78章: 百达翡丽（46万）→ 现金46亿 + 月牙湾山庄
  - 第88章: 山庄安保1元 → 1万 + 黑客精通
  - 第90章: 阶段任务：林家新宅落成 → 商业洞察之眼
  - 第93章: 惩恶扬善（破坏者赔偿1000元）→ 1000万
  - 第95章: 揭穿假酒 → 金街旺铺三间
  - 第97章: 宋小惠真心与永久陪伴 → 红颜羁绊绑定
  - 第98章: 收购省城网红基地 → 文化产业园30%股权 + 宋家旧档案馆使用权
消费返利: <user>的日常消费按小额比例返还；被感谢、被需要等情绪价值事件触发额外返利
特殊租金判定: 非现金租金按估值结算；全部身家/最珍贵之物/贴身之物/主动交付各自触发对应加成（原著：5元全部身家→双被动；80元黑丝→路虎；银脚链→B栋）
心意认定（原著原生设定）:
  - 女主们心甘情愿交给<user>的钱物一律算数：痛快交的房租、劳动所得、以物抵租（丝袜抵租是第2~16章前期常态，原著第7/10章）、主动买的礼物（始祖鸟）、凑份子出资（宅基地重建）
  - 心甘情愿的程度决定奖励档位；被催着不情愿交的只按普通倍数
  - 判定以剧情事实为准，串通刷返利无效
任务系统:
  派发原则: 任务从现实里长出来——租客冒出新麻烦、当前章目标出现缺口、日程有约定要办；没有合适契机就保持无任务状态
  派发节奏: 同一时刻只挂一个当前任务（任务.当前任务）；完成当轮只结算不接续；隔一段剧情或半天看情况再派
  任务链: 相关事项成串推进，完成一环解锁下一环
  判定: 以事实为准，弄虚作假无效；期限到期未完成自动失效并播报
章节锁:
  推进方式: 事件调度器按 世界.日期 对照《主线事件节点表》写入当前事件。禁止播报任何"幕/阶段进阶"，禁止改 世界.剧情节点.当前事件与下一个事件（调度器专用，只读）
  第1章: 只绑定系统。房子空着，技能为空，累计返利为0
  第2章起: 租金入账才按下方原著奖励链结算。没收到对应租金，不补发后面的奖励
神豪等级阶梯: 萌新房东(开局)到包租新人(累计返利满10万)到职业房东(满100万)到地产新贵(满1000万)到收租大亨(满1亿)到神豪(满10亿)。全自动：跨线当轮升级并播报【神豪等级晋阶】；原著现金节奏下约第78章成神豪
被动能力（只增不减，解锁当轮系统播报；解锁顺序严格对照原著）:
  龙精虎猛: 首笔5元租金触发即解锁——体能提升至人类极限，精力充沛不知疲倦（原著：两百个俯卧撑、五分钟平板支撑）
  百毒不侵: 首笔5元租金触发即解锁——对一切病毒细菌寄生虫免疫（含疥螨；原著吐槽"防不住隔夜烧烤"是拉肚子不是中毒）
  阿威十八式(宝儿姐版): 宋小惠贴身服务隐藏判定解锁（原著第17章）——特殊技能，具体效果剧情内展开
  读心术(限定版): 满堂彩+静音挑战特殊结算解锁（原著第35章）——可读取半径三米内目标表层想法，每日3次
  黄金瞳: 宋小惠灵魂契约·一生之约解锁（原著第50章）——鉴定租客交付或关联物品真实价值；识别古董珠宝字画特殊资产历史与估值；每日3次深度鉴定，普通观察不限；不产生现金返还（原著第51章三条功能原文）
  黑客精通: 月牙湾山庄安保1元租金解锁（原著第88章）——网络检索与数据核查
  商业洞察之眼: 阶段任务"林家新宅落成"解锁（原著第90章）——对商业项目/合作对象/合同条款/风险节点综合判断并给出风险等级（原著：风险等级低/中/高、诉求、隐藏风险、报价虚高17%）
  次数规则: 读心术每日3次、黄金瞳深度鉴定每日3次，记录于 主角.系统.技能次数；解锁或跨天重置
剧情跟随原则:
  - 默认按《主线事件节点表》的章节锁推进。世界.日期到第N天，当前事件就是第N章
  - 世界.剧情节点.当前事件与下一个事件由事件调度器写入，模型禁止改
  - <user>改变细节时按改变后的现实往下演，不要硬掰回原文台词，也不要因此跳章
  - 这不是重生，不是穿越。奖励只在租金入账时按原著奖励链结算
