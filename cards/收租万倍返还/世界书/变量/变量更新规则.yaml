变量更新规则:
  总纲:
    - 只允许 replace、add、remove、move。replace 只能改已有路径；新键用 add
    - 整条回复只能有一个<UpdateVariable>块，置于正文全部写完之后、状态栏占位符 <StatusPlaceHolderImpl/> 之前
    - 大额变化（神豪等级晋阶、产业购入、原著奖励结算）由系统播报结算，你只做本轮剧情造成的小步更新
    - 不在场的人一律不动。女性角色登场当轮用 add 完整建档进红颜（各分组逐项建全、不留空），非红颜人物登场当轮收录进 NPC。禁止同一人同时出现在红颜和 NPC 里
    - 剧情骨架以当前事件的《事件详情》为准，不要抢跑
  世界:
    日期:
      type: number
      check: 跨天时按原著时间推进，可一次加到当前章对应的天数；同一章内不要无故跳到下一章的日期。节点表用「第N天」锁章，第N章的日期窗口是第N天
    时段:
      type: '清晨'|'上午'|'中午'|'下午'|'傍晚'|'晚上'|'深夜'
      check: 随剧情时间自然流转
    当前地点:
      check: 场景切换时更新为「区域｜场景」，具体到江城的餐厅、街道、翡翠湾叠墅房间或后来解锁的地点
    天气:
      check: 天气实际变化时才更新
    剧情节点:
      当前事件:
        check: 只读。事件调度器按节点表与世界.日期写入；禁止创建、修改、删除
      当前节点:
        check: 调度器切换当前事件时会把它重置为该章首节点「开场」；此后按当前《事件详情》的节点标题推进（开场→推进→收束），写完当前节点再改，禁止跳步，禁止预写下一章
      下一个事件:
        check: 只读。事件调度器唯一写入；禁止创建、修改、删除
  主角:
    基本信息.${姓名|年龄|性别|身高|体型|外貌|衣着}:
      check: 玩家消息含【接手登记】则逐项覆写（消息缺项保持林野默认）；玩家消息以「按林野来」开头则保持默认林野模板；此后仅衣着随剧情换装更新
    已登记:
      type: true|false
      check: 开局【接手登记】或「按林野来」完成当轮置为 true；此后只读，不再改动
    身份.社会身份:
      check: 默认翡翠湾叠墅房东；自定义登记按档案改写；此后剧情身份实质变化时才更新
    身份.职业:
      check: 剧情职业变化时更新（收租为业、星耀传媒老板等）
    系统.返现倍数:
      check: 固定 10000，禁止改写
    系统.神豪等级:
      type: '萌新房东'|'包租新人'|'职业房东'|'地产新贵'|'收租大亨'|'神豪'
      check: 仅随累计返利跨过升级线时更新，升级当轮输出系统播报
    系统.累计返利:
      check: 系统返还的每一笔现金（含大额特殊结算，原著节奏：手机5000万、静音挑战2亿、宅基地2.5亿、名表46亿等）到账后累加；只增不减；资产/技能类奖励不计入
    系统.被动技能:
      check: 开场为空；按原著结算解锁后追加（第2章龙精虎猛、百毒不侵，其后对照收租系统规则）；只增不减，用 add
    系统.技能次数.${技能名}:
      type: number
      range: 0~3
      check: 记录读心术限定版/黄金瞳/商业洞察之眼的当日剩余次数；解锁当轮或跨天置3；主动使用一次-1；被动读取不消耗
    资产.现金:
      check: 消费、收租、返利、产业收支后同步更新；数值必须与正文的收支明细一致，可为负并触发危机剧情
    资产.道具.${道具名}:
      type: string
      check: 系统奖励的图纸、实物道具到手用 add，消耗或失效用 remove
    资产.房产.${房产名}:
      type: string
      check: 购入或系统返还的房产用 add 并写明状态；售出易主用 remove
    资产.车辆.${车辆名}:
      type: string
      check: 购入或奖励车辆用 add；转让用 remove
  任务:
    当前任务:
      type: |-
        {
          标题: string;
          要求: string;
          奖励: string;
          期限: string; # 形如「第N天」
        }
      check: 系统派发任务时整体写入；完成或失效时清空为空对象
  产业.${产业名}:
    check: 购入、接管或系统返还的经营实体（星耀传媒、月牙湾山庄、四街旺铺等）用 add 完整建档；转卖易主用 remove。财务.月收入/月支出/现金流在业务实质变化当轮更新，与主线收支一致
  红颜.${名字}:
    check: 女性角色登场当轮用 add 完整建档（基本信息/外貌/衣着/情感四维/生理/租约/关系/状态逐项建全，禁止留空、延后或只建半套）；退场保留档案
    基本信息.年龄:
      type: number
    基本信息.职业:
      check: 当前谋生方式，如 无业精神小妹/主播/画师
    基本信息.居住地:
      check: 如 翡翠湾叠墅地下室/老家/青旅
    外貌:
      check: 建档时按人设写全；日常衣着随剧情，当前衣着当轮换装才改
    情感.好感度:
      type: number
      range: 0~100
      check: 受用、帮忙加1~3；冒犯、失望减1~3；单轮变化不超过正负3
    情感.爱意值:
      type: number
      range: 0~100
      check: 仅明确的心动、暧昧、亲密回合增加，日常回合不动；单轮不超过正负3
    情感.怀疑值:
      type: number
      range: 0~100
      check: 对<user>身份、钱来路或行为起疑时增加；解释化解后减少
    情感.冲突值:
      type: number
      range: 0~100
      check: 争吵、对立当轮增加；和好后回落；单轮不超过正负5
    生理.生理期:
      type: '安全期'|'普通期'|'排卵期'|'月经期'
      check: 随世界.日期推进按周期轮转；仅供亲密度剧情参考，不在正文公开展示
    生理.是否处女:
      type: '是'|'否'
      check: 仅由私密档案.性交次数首次大于0联动置否；不得单独改写
    租约.在住:
      type: true|false
      check: 收编入住置 true 并同步分配房间（与别墅.空房数联动）；退租置 false、房间改回空置
    租约.房间:
      type: '一楼东'|'一楼西'|'二楼东'|'地下室'|'B栋'|'空置'
    租约.欠租:
      check: 到期未交累加，交租或以物抵租后清零；与主角现金流水一致
    私密档案.初吻:
      type: '未发生'|'已发生'
      check: 发生初吻当轮置已发生；只进不退
    私密档案.初夜:
      type: '未发生'|'已发生'
      check: 由性交次数首次大于0联动置已发生；不得单独改写
    私密档案.性交次数:
      type: number
      check: 仅双方自愿的实质性行为每回合加1；只增不减
    私密档案.最近性事:
      check: 发生性行为的当轮写「第{世界.日期}天·{世界.时段}」；其他回合保持不变
    私密档案.身体开发.${小嘴|胸部|下身|后穴}:
      type: number
      range: 0~100
      check: 仅性场景回合对应部位被认真对待时加1~3，只增不减
    关系.关系:
      check: 关系变化当轮改写：租客、房客、暧昧、恋人、未婚妻等
    关系.态度:
      check: 在场且态度变化时更新一句，如 嘴硬心软/试探/缴械
    状态.心情:
      check: 在场回合随剧情更新，如 烦躁/雀跃/心虚
    状态.健康:
      check: 生病、受伤、恢复时更新
    羁绊物品.${物品名}:
      type: string
      check: 获得有纪念意义的物品时用 add 并写明意义
    羁绊事件.${第N天}:
      type: string
      check: 名场面、重要约定、初次经历等值得铭刻的事件用 add
  NPC.${姓名}:
    check: 非红颜人物登场或被互动当轮用 add 收录；离场保留档案，不要删除还可能再出现的人
    身份.${身份名}:
      type: string
      check: 键=身份名（如 相亲对象/同行对手/村委会主任），值=具体说明；身份变化时更新
    关系.${关系名}:
      type: string
      check: 键=与主角的关系名，值=来历或现状说明；关系变化当轮更新
  别墅:
    口碑:
      type: number
      range: 0~100
      check: 对照收租系统规则「别墅经营」的渠道增减——街坊人情/租客满意+1~3，公共事件+2~5，自发传播+1；冲突/纠纷/报修拖延-1~3；单轮变化不超过正负3
    设施等级:
      type: number
      range: 0~5
      check: 仅按收租系统规则的改造阶梯以现金改造提升（现金支出在先、工程跨1~3轮剧情），完工当轮加1并播报；不随日常剧情浮动
    空房数:
      type: number
      range: 0~5
      check: 与红颜.租约联动：新租客入住减1，退租加1；开局五间都空着
  系统_:
    check: 下划线开头的顶层字段只读，禁止在<UpdateVariable>里改动
  选项:
    type: string[]
    check: 每轮整组覆写1个下一步行动短句（不超过20字）。这个选项必须是当前事件下一节点、或下一章将要发生的原著行动，不是摘要。玩家自由输入可以偏离。没有可给的行动时覆写为空数组[]
