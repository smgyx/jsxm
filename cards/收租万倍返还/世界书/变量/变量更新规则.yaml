变量更新规则:
  总纲:
    - 只允许 replace、add、remove、move。replace 只能改已有路径；新键用 add
    - 整条回复只能有一个<UpdateVariable>块，置于正文全部写完之后、状态栏占位符之前
    - 大额变化（神豪等级晋阶、产业购入、原著奖励结算）由系统播报结算，你只做本轮剧情造成的小步更新
    - 不在场角色的字段一律不动；角色未入住时其在角色表里不存在，不得凭空创建未登场角色的租客档案。已见面但未入住的人写入人物，关系升级后再写入红颜
    - 剧情骨架以当前事件的《事件详情》为准，不要用旧的五幕摘要抢跑
  世界:
    日期:
      type: number
      check: 跨天时按原著时间推进，可一次加到当前章对应的天数；同一章内不要无故跳到下一章的日期。节点表用「第N天」锁章，第N章的日期窗口是第N天
    时段:
      type: '清晨'|'上午'|'中午'|'下午'|'傍晚'|'晚上'|'深夜'
      check: 随剧情时间自然流转
    当前地点:
      check: 场景切换时更新为「区域｜场景」，具体到江城的餐厅、街道、翡翠湾叠墅房间或后来解锁的地点
    天气:
      check: 天气实际变化时才更新
    剧情节点:
      当前事件:
        check: 只读。事件调度器按节点表与世界.日期写入；禁止创建、修改、删除
      当前节点:
        check: 调度器切换当前事件时会把它重置为该章首节点「开场」；此后按当前《事件详情》的节点标题推进（开场→推进→收束），写完当前节点再改，禁止跳步，禁止预写下一章
      下一个事件:
        check: 只读。事件调度器唯一写入；禁止创建、修改、删除
  主角:
    ${姓名|年龄|性别|身高|体型|外貌|衣着}:
      check: 开场「接手登记」环节玩家报出自定义信息（含终端表单发来的【接手登记】消息）则逐项覆写；玩家回复「按林野来」或未自定义时保持默认林野模板；此后仅衣着随剧情换装更新
    已登记:
      type: true|false
      check: 开场「接手登记」完成当轮（无论自定义覆写还是确认沿用林野模板）置为 true；此后不再改动
    现金:
      check: 消费、收租、返利、产业收支后同步更新；开局约50万（200余万补偿减150万房款）；数值必须与正文的收支明细一致，可为负并触发危机剧情
    系统积分:
      check: 任务奖励与特殊结算时更新
    神豪等级:
      type: '萌新房东'|'包租新人'|'职业房东'|'地产新贵'|'收租大亨'|'神豪'
      check: 仅随累计返利跨过升级线时更新，升级当轮输出系统播报
    返现倍数:
      check: 固定万倍，不要随等级改写
    累计返利:
      check: 系统返还的每一笔现金（含大额特殊结算，原著节奏：手机5000万、静音挑战2亿、宅基地2.5亿、名表46亿等）到账后累加；只增不减；资产/技能类奖励不计入
    技能次数.${技能名}:
      type: number
      range: 0~3
      check: 记录读心术限定版/黄金瞳/商业洞察之眼的当日剩余次数；解锁当轮或跨天置3；主动使用一次-1；黄金瞳瞥见标签、商业洞察之眼扫过等被动读取不消耗
    ${精力|体力}.当前值:
      type: number
      check: 按收租系统规则「资源系统」增减——重体力/通宵/亲密场景消耗体力，谈判/经营/熬夜消耗精力，睡眠吃饭休息恢复；龙精虎猛生效中恢复翻倍、消耗减半；单轮变化不超过50；休息回升不超上限
    被动技能:
      check: 开场为空；按原著结算解锁后追加（第2章龙精虎猛、百毒不侵，其后对照收租系统规则）；只增不减
    名下产业.${产业名}:
      type: string
      check: 购入、接管或系统返还的资产类奖励（房产证/公司股权/资质/车队等）新增键，简述写明内容与一句估值；售出易主时移除键
    日程约定.${事项}:
      type: string
      check: 剧情中敲定的邀约与计划当轮写入（如「与沈嘉欣周六中午聚餐」）；完成或取消时移除
  任务:
    当前任务:
      type: |-
        {
          标题: string;
          要求: string;
          奖励: string;
          期限: string; # 形如「第N天」
        }
      check: 系统按收租系统规则的任务系统逻辑派发与结算；派发时整体写入；完成或失效时清空为空对象
    任务板:
      check: 新任务入列、完成移除；同时存在不超过3个，保持焦点
  角色.${角色名}:
    在住:
      type: true|false
      check: 收编入住置 true 并同步分配房间；退租置 false 并把房间改回空置
    房间:
      type: '一楼东'|'一楼西'|'二楼东'|'地下室'|'B栋'|'空置'
    好感:
      type: number
      range: 0~100
      check: 受用、帮忙加1~3；冒犯、失望减1~3；单轮变化不超过正负3
    堕落:
      type: number
      range: 0~100
      check: 仅实质亲密或性场景回合加1~3，反感退缩可减1~3；日常闲聊回合不动
    情绪:
      check: 仅该角色在场对戏时随剧情更新，如 平静/雀跃/局促/心虚/悸动
    心理想法:
      check: 仅该角色在场对戏的回合更新一两句第一人称独白；只概括此刻意图或矛盾，不照抄台词
    欠租:
      check: 到期未交累加，交租或免租清零；与主角现金流水保持一致
    个人目标:
      check: 剧情明确揭示其目标时更新一句话
    生理期:
      type: '安全期'|'普通期'|'排卵期'|'月经期'
      check: 随世界.日期推进按周期轮转；仅供亲密度剧情参考，不在正文公开展示
    私密档案.初吻:
      type: '未发生'|'已发生'
      check: 发生初吻当轮置为已发生；只进不退
    私密档案.初夜:
      type: '未发生'|'已发生'
      check: 由性交次数首次大于0联动置为已发生；不得单独改写
    私密档案.性交次数:
      type: number
      check: 仅双方自愿的实质性行为每回合加1；只增不减
    私密档案.最近性事:
      check: 发生性行为的当轮写「第{世界.日期}天·{世界.时段}」；其他回合保持不变
    私密档案.身体开发.${小嘴|胸部|下身|后穴}:
      type: number
      range: 0~100
      check: 仅性场景回合对应部位被认真对待时加1~3，只增不减；上限受该角色堕落值钳制，上限值等于堕落值
  别墅:
    口碑:
      type: number
      range: 0~100
      check: 对照收租系统规则「别墅经营」的渠道增减——街坊人情/租客满意+1~3，公共事件+2~5，自发传播+1；冲突/纠纷/报修拖延-1~3；单轮变化不超过正负3
    设施等级:
      type: number
      range: 0~5
      check: 仅按收租系统规则的改造阶梯以现金改造提升（现金支出在先、工程跨1~3轮剧情），完工当轮加1并播报；不随日常剧情浮动
    空房数:
      type: number
      range: 0~5
      check: 与角色表房间分配联动：新租客入住减1，退租加1；开局五间都空着
  红颜.${角色名}:
    关系:
      check: 关系明确升级或破裂时改写，如租客、暧昧、恋人
    好感:
      type: number
      range: 0~100
      check: 与角色表好感同步，单轮变化不超过正负3
    态度:
      check: 该角色在场且态度变化时更新一句
    当前状态:
      check: 在场状态变化时更新，如在住、外出、夜袭后
  人物.${人物名}:
    身份:
      check: 新登场且不必进租客档案的人，用 add 建档；已有档案只在身份变化时改
    与主角关系:
      check: 关系变化时更新
    当前状态:
      check: 在场或状态变化时更新；离场可保留档案，不要删掉还可能再出现的人
  选项:
    type: string[]
    check: 每轮整组覆写1个下一步行动短句（不超过20字）。这个选项必须是当前事件下一节点、或下一章将要发生的原著行动，不是五幕摘要。玩家自由输入可以偏离。没有可给的行动时覆写为空数组[]
