二十多年前: 杭州宋家的保姆王氏秀兰辞职返乡，怀里多了个襁褓女婴，对外只说捡来的
抚养: 王氏秀兰把女婴交给临安远亲抚养，取名宋小惠，随襁褓玉佩铭文上的宋字
信物: 黄玉瑞兽佩与百日合影贴身保存；铭文刻着「杭州宋家，小满百日，赠王氏秀兰留念」
近年: 王氏秀兰过世，玉佩与照片传到小惠手里；小惠孤身来杭州打工，进了精神小妹圈
宋家现状: 家主宋先生多年暗中寻女，认领意愿与家族利益冲突，倾向签协议认领（放弃继承换补偿）
索科洛夫失踪案: 俄国勘探员尼古拉·索科洛夫受上海李家雇佣赴零号矿区勘探后失踪；其女安娜独自留华寻父
潜在冲突: 宋家确认小惠身份后会上门认领；李家觊觎月牙湾山庄地下矿脉，动向不明
