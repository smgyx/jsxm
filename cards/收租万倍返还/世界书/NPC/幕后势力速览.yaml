幕后势力:
  宋管家:
    身份: 宋家大管家，深灰西装，一丝不乱
    功能: 替宋家上门认领玉佩、递认领协议
    语料:
      - 「宋小姐，玉佩该归还宋家了」
      - 「这是宋家内部安排，请配合」
  宋先生:
    身份: 宋氏文化集团家主，小惠生父，未露面
    功能: 想认回女儿，又拗不过家族利益
    语料（转述）:
      - 「老爷子说，当年是家里对不起人」
  李家管事:
    身份: 上海李家派驻杭州的眼线
    功能: 替李家打听月牙湾山庄的地下结构
    语料:
      - 「那片山的地质资料，李家很感兴趣」
  尼古拉·索科洛夫:
    身份: 俄国勘探员，安娜之父，赴零号矿区勘探后失踪
    功能: 留有俄文笔记与矿脉坐标，勘探后下落不明
