chapters:
- name: 第1章 收租万倍返还？
  notes: 林野回江城相亲，周克梅开出彩礼四十万、婚后不同住、五年不要孩子、弟弟买车要表示的连环条件，林野离席抽烟时神级收租系统绑定，宣告名下不动产租金万倍返还并随机奖励黑科技图纸，他随即盘算抬高租金基数。
- name: 第2章 叔，你不会是想磕我吧！
  notes: 林野在街头遇到三个找住处的精神小妹，领头的苏星彤怀疑他不安好心，当面问他是不是想磕她，三人密谋后决定接受日租五十元的别墅，小惠饿得肚子咕咕叫，暴露三人已身无分文。
- name: 第3章 成大事者不惧小姐，更何况我是小妹
  notes: 林野带三人参观叠墅，地下一层的台球桌和茶室令三人惊叹，三人齐声选住地下室，苏星彤荤话打趣占他便宜，林野上楼试用系统奖励的龙精虎猛与百毒不侵技能，被苏星彤嘀咕是不是上楼自导自演。
- name: 第4章 三英战老娘
  notes: 王秀芹电话拆穿林野的谎言，下达国庆必须带一个活的对象回家的最后通牒，否则告诉他爸，林野看到洗完澡素颜的三个姑娘，心生带三个精神小妹回家三英战老娘、让老妈顾不上审他的计划。
- name: 第5章 这精神小妹能处，有事儿真上啊
  notes: 烧烤摊上林野请客，周克梅前来讥讽他翘单穷酸，苏星彤挺身护叔反骂她身材，当众强亲林野，小惠和沈嘉欣一人搂住一条胳膊宣誓主权，最后一名地中海发型的中年男人从帕萨特上下来。
- name: 第6章 三个臭皮匠！
  notes: 三人报上姓名来历：苏星彤十九岁黑省人高中辍学，宋小惠是她初中同学，沈嘉欣是网吧结识，三人被假招聘骗来江城身无分文，苏星彤还传授碰瓷讹钱的空手套白狼理论，令林野大受震撼。
- name: 第7章 收租黑丝！奖励……
  notes: 深夜林野测试技能，五分钟平板支撑面不改色，腹肌成形，苏星彤撞见他赤裸上身吞口水，随后提出没钱交租，用黑丝袜作价八十块抵明天房租，林野想到任何租金都能触发万倍返还便答应。
- name: 第8章 叔，实在不行我让你磕一下吧？
  notes: 小惠被苏星彤呼噜吵得睡不着，溜上二楼摸黑睡进林野主卧，林野拉肚子回床误抱了她，惊叫吵醒众人，苏星彤和沈嘉欣冲上楼看到暧昧一幕，误会两人有了关系。
- name: 第9章 这是嘎哈呢，你们真是害苦了我啊！
  notes: 林野赶走三个满口虎狼之词的姑娘，凌晨苏星彤溜进主卧趴在他床尾，两人发生关系，苏星彤事后点破自己越大大咧咧越安全的处世哲学，又问他咱俩算什么关系，关系质变。
- name: 第10章 你这个上个世纪的老古董，怎么一点都不封建啊
  notes: 三人主动打扫卫生并轮番亲吻林野，苏星彤称他老古董不封建，暴露三人身份证被骗子KTV的卢冰雁扣押，林野决定带她们补办，出门时三人被他的黑色路虎揽胜江G88888车牌震住。
- name: 第11章 叔，你搁着养死士呢？
  notes: 派出所里撞见被铐的卢冰雁，她开价捞人才肯交出身份证被林野晾在一边，同案十八岁的陈小雯主动透露证件藏在日租房行李箱，林野替她赔钱撤诉带她上车吃饭，得知她与妹妹双双被骗来江城。
- name: 第13章 姐妹花抵租，楼上楼下都是家
  notes: 陈小雯用密码打开行李箱取回三人身份证，妹妹陈小薇解下亡母留下的银脚链抵赔款，林野收下后系统触发全部身家、亲情羁绊与姐妹花联动加成，奖励翡翠湾B栋上叠产权证，姐妹俩入住别墅成为新租客。
- name: 第14章 精神小妹反围猎
  notes: 手机店里五个姑娘嫌贵拦着林野不让买，恰好撞见周克梅与地中海来买玫瑰金新机，苏星彤嘲讽她口红色号，沈嘉欣设局装天真忽悠地中海帮忙参考手机，五人将其围成C字形套路。
- name: 第15章 精神小妹五打一，地中海血亏出局
  notes: 小惠以身材压制、小薇楚楚可怜、小雯沉默认同，配合沈嘉欣甜笑逼得地中海上头刷卡买下五台旗舰机共三万四千五，周克梅与他当场闹翻撂话我们完了，五人拎走手机全身而退，地中海放话要找人弄林野。
- name: 第16章 精神小妹硬砍价， 砍价砍到老板叫妈
  notes: 林野带五人逛火车站步行街买衣，苏星彤领衔轮番砍价把两千三的衣服砍到七百成交，还自掏余钱垫付，林野久违地真心笑了，离开时撞见发小赵强，对方惊喜地注意到他身后的五个姑娘。
- name: 17-小惠夜袭，别墅加装电梯提上日程
  notes: 五个精神小妹试穿新衣、分房入住，小雯抱林野道谢。林野查看B栋上叠与顶楼大露台，决意加装室内电梯。晚餐被五人夹菜伺候。夜里盘点：现金五千零五万加星耀传媒一间，谋划让小妹签约领工资再交租触发万倍返还。
- name: 18-星耀传媒，新官上任第一把火
  notes: 林野带五个小妹到星耀传媒上任，创始人张守义交接：公司二十三名员工，运营总监钱志国脚踩两条船欲跳槽，头号主播周瑞雪（艺名翠翠）是钱志国的小蜜，副主管陈子豪可用。钱志国闯入办公室挑衅，林野当场宣布开除。
- name: 19-全员加薪，一姐逼宫
  notes: 林野开全员大会：公布签约苏星彤、宋小惠、沈嘉欣、陈小雯、陈小薇五人为艺人，宣布五险一金足额缴纳、全体加薪五成、小妹底薪一万，员工忠诚度拉满。一姐周瑞雪随后逼宫，要求底薪五万提成翻倍，否则带团队离职。
- name: 20-凯雷德，给我来辆最贵的
  notes: 路虎座位不够，林野到宏达汽车城全款一百三十六万八购入黑色凯迪拉克凯雷德ESV加长铂金版，油头销售前倨后恭，苏星彤回怼。提车后五个小妹收到第一笔一万元工资短信，苏星彤、小雯、小薇先后红了眼眶。
- name: 21-老爷们搁外面必须穿板正儿的！
  notes: 苏星彤拽林野进亿达商场始祖鸟店，五个小妹分头挑了冲锋衣、T恤、软壳裤、徒步鞋、摇粒绒两身共两万四千八，坚持用刚到手的工资付钱送他。林野想起大厂十年没人给他买过衣服，换装后气质焕然，眼角发涩。
- name: 22-你是叔的财神爷，值得
  notes: 烤肉店聚餐，五人流水线伺候林野，敲定分工：苏星彤直播、小惠吃播、沈嘉欣学剪辑、双胞胎拍日常。喷泉边苏星彤问花的钱值不值，林野称她是叔的财神爷，值得。翡翠湾保安大爷老佘目睹凯雷德与豹子号路虎进小区。
- name: 23-乌鸦坐飞机，精神小妹夜间大乱斗
  notes: 夜里苏星彤赤脚进林野房间，小惠推门撞见被苏星彤拽住，三人同床突破关系（乌鸦坐飞机、组团副本桥段）。林野龙精虎猛体能撑过两小时拉锯战，清晨先轻手轻脚下床。苏星彤宣称下次要试反向乌鸦。
- name: 24-高中校花，白金VIP专属经理
  notes: 林野赴江省银行江城支行办钻石VIP，重逢十二年未见的高中前排同学、大客户经理李知盈。她推销年化四点五、一千万起投的理财，称可用个人额度帮他申请百分之五。车上三个小妹点破她理财是假、理人是真。
- name: 25-同学聚会，校花入局
  notes: 赵强开科鲁兹当前导车，林野携五个盛装小妹乘凯雷德抵达白云国际酒店。副班长周远接待，李知盈盛装出席，主动贴近整理林野领口、提起高中旧事，苏星彤强压醋意。当年暗恋林野的老同学不少。
- name: 26-舔狗炫富，精神小妹磨刀霍霍
  notes: 张少磊席间舔李知盈、轻慢林野的传媒公司，被苏星彤用注资一千万、全员加薪反击。李知盈得知林野住翡翠湾后主动凑近。张少磊炫奥迪Q5与劳力士，小妹们请战获准，小惠把凯雷德车钥匙拍在桌上。
- name: 27-凯雷德碾压，舔狗梦碎
  notes: 苏星彤当面算账：凯雷德落地一百三十六万八，三个Q5不够换，张少磊体面碎裂借口上厕所溜走。散场后李知盈握住林野的手，追问当年一路顺风的下一句，林野念及她欠钱传闻与旧情，抽手不回握，祝她早点回去。
- name: 28-建材市场遇熟人，精神小妹暴露了
  notes: 五个小妹对正式上班欢呼雀跃。林野盘点总资产逼近一个亿，计划开工、看电梯、接待赵强。赵强转告张少磊在同学群造谣凯雷德是租的，林野不放在心上。次日林野赴城南鸿运建材城看家用电梯，因小薇身体不好急需加装。
- name: 29-妹妹来了
  notes: 回程接到母亲王秀芹电话：妹妹林小鹿后天放假要来住。王秀芹已从张桂英处得知他带三色头发、腿上纹龙的姑娘逛建材市场，平静更胜愤怒，叮嘱别让妹妹看到不该看的。林野夜里列接待清单，第四条写不下去。
- name: 31-晨间兵荒马乱，闺蜜天团上工了
  notes: 电梯公司陈工勘测叠墅，林野激活建筑改造许可证把实际工期暗压到十天；陈子豪交出五账号矩阵方案，苏星彤明日开播；王秀芹微信通知妹妹后天到；林野买女式用品布置B栋主卧，插桂花想起林蔓小时候最爱桂花味。
- name: 32-火车站接妹，精神小妹严阵以待
  notes: 林野回忆林小鹿十二岁当众朗读情书并评“我哥他不配”的战绩，备好三套说辞又全删；家具到家，龙精虎猛让他单手抬实木床；带苏星彤小惠去火车站，接到二十二岁一米六八的林小鹿，她发现哥哥变壮、穿上了始祖鸟。
- name: 33-精神小妹见亲妹
  notes: 林小鹿入住翡翠湾，见到全部精神小妹：自称十九让叫彤姐的苏星彤、十八的宋小惠、沈嘉欣和双胞胎；苏星彤自称是你哥的女人；林小鹿感慨原以为妈大惊小怪，现在觉得她还是保守了，把林野叫到一边要他答应一件事。
- name: 34-磨合之夜，精神小妹与亲妹初交锋
  notes: 林野掌勺五个菜接风，饭桌上林小鹿盘出五人籍贯并追问房租，林野以市场价搪塞，没法解释首笔租金五块钱与一双原味黑丝；夜里苏星彤开紧急会议，要求在林小鹿面前收敛并暂停夜间行动；林野独自面对空荡的床。
- name: 36-再见卢冰雁
  notes: 晨间全员化妆大乱：苏星彤画出战斗妆被林野勒令卸掉重画，小惠假睫毛被喷嚏崩掉，沈嘉欣夹半扎发型，双胞胎穿同款卫衣；林小鹿白polo衫高腰宽腿裤出场；六人乘凯雷德出发，苏星彤爆料车价一百三十六万八落地。
- name: 37-一个打一群，阿威十八式显威
  notes: 卢冰雁男友率六人围堵讨要身份证，苏星彤抠路沿石、小惠捡砖护主；林野以阿威十八式四十五秒放倒六人；红裙姑娘当众求处对象；苏星彤从背后搂腰宣示主权，一脚踹倒想溜的卢冰雁，众人驾车扬长而去。
- name: 38-狂刷百万，我哥被富婆快乐球了？
  notes: 回公司后苏星彤把ID从彤彤爱吃糖改为江城第一小钢炮开播，在线人数惨淡；林野首次激活系统刚奖励的读心术，听到林小鹿怀疑他被富婆包养还想蹭零花钱；他连充五次各十万钻石砸进直播间。
- name: 39-连麦PK，青龙威武
  notes: 钱志国花两万给卢冰雁买首页推荐，流量反被小钢炮吸走，在线冲到十五万，榜一“叔”刷了一百万；钱志国让卢冰雁主动连麦PK引流，卢冰雁跳大摆锤被弹幕嘲；苏星彤应战，让小惠端出不锈钢盆东北大冷面开吃。
- name: 40-我来收租的，砸了改洗浴中心
  notes: 夜里林野带六个姑娘到江城CBD商业综合体A座，地中海保安拦人；林野拍出系统存入物品栏的产权证自称来收租，放话三分钟不见负责人就把三栋楼砸了改洗浴中心；物业总经理张强带八主管鞠躬，林小鹿三观震碎。
- name: 41-老板，他们欠租了吗？
  notes: 张强查实张少磊名车汇无欠租；林野决意单方面解约，自付两个月约七十万违约金并限次日清场，盘算收回铺面重租可吃万倍返还；张少磊携李知盈出言嘲讽，被张强当众揭穿林野是三栋楼唯一大业主，张少磊腿软。
- name: 42-旋转餐厅的凡尔赛，精神小妹的吃货觉醒
  notes: 张强引入专属电梯登上CBD顶层“云端”旋转餐厅，林野点七份主厨套餐配年份香槟；林小鹿追问财富来源，林野以投资风口搪塞；苏星彤想攒金箔去金店卖，尝鹅肝后喊好吃到想哭；第二道菜是A5和牛。
- name: 43-豪车尾随，路边草丛里的野生小妹
  notes: 回程发现灰白五菱宏光尾随，林野故意拐进林荫小路逼停；车上下来粉色短发与扎辫子两个瘦小女孩求收留，自曝是卢冰雁跟班，被打得新伤叠旧伤还被逼偷超市东西；两人偷了卢冰雁男友的五菱宏光钥匙趁乱出逃。
- name: 44-原装小妹求收编，精神圈子里的暗流
  notes: 周小萌赵悦以原装没拆封自荐，爆料圈内叫卢冰雁百家雁，扬言纹白虎朱雀凑一桌麻将；抛出关键情报：有人花两千块信息费经卢冰雁那条线打听小惠住址；小惠强装平静睫毛却颤动；林野决定收留两人，规矩一样交租。
- name: 45-叔，我有七个了
  notes: 周小萌赵悦抢做早餐，焦煎蛋糊粥被苏星彤打59分；林小鹿数出家里七个姑娘，讥讽这是翡翠湾收容所；小惠笑眯眯如常，林野记得她昨夜说再多一天；林野带两人补办身份证，试用期八千；周小萌会街舞，赵悦会画画。
- name: 46-举报十七次，叔的刀还没凉呢
  notes: 派出所补出临时身份证；陈子豪三条消息：举报号批量注册指向江城网吧、平台降权三天、翠翠新号挂金鼎传媒抄袭话术；林野布置存档时间戳养肥一锅端，安排周小萌走街舞、赵悦走绘画方向；沈嘉欣报告小惠走神躲厕所哭。
- name: 47-请客的人跑了，床冷了才知道慌
  notes: 小惠用第一个月工资请客吃火锅，737块，给每人点专属菜、替林野拧瓶盖，周到得反常；林小鹿提醒这要么是大决定要么是告别，离校前嘱托盯紧小惠；深夜无人来闹，小惠消息已读不回，林野下楼敲门，苏星彤隔门应声。
- name: 第48章 全城搜捕，叔的红包炸翻精神圈
  notes: 小惠深夜出走了无音讯，林野开凯雷德全城寻找未果，转而加入三个精神小妹QQ群连发一万五千元红包寻人，群管理芳姐提醒姐妹找到人先稳住情绪，寻人信息十五分钟内扩散到二十多个群，精神小妹圈全员出动。
- name: 第49章 她的命，不该是谁的聘礼
  notes: 两个精神小妹在铁路桥桥洞找到小惠，林野蹲守三米外耐心陪伴。小惠哭诉换亲真相：父亲与邻村谈好用她换亲，对方是三十二岁生活不能自理的傻子，彩礼八万折现给哥哥娶媳妇，定亲酒定在国庆，她怕连累林野才出逃。
- name: 第50章 这辈子的租金，交给你了
  notes: 众人回翡翠湾，苏星彤带头拥抱安慰小惠，大家听完换亲经过群情激愤，苏星彤宣告小惠婚嫁自己说了算。林野决定与小惠父亲面谈，从穷根上解决哥哥娶亲难题，安排生计出路。深夜小惠推开林野房门钻进被窝。
- name: 第51章 黄金瞳开眼，叔看东西开始冒价了
  notes: 系统发放永久被动技能黄金瞳，可鉴定租客物品真实价值、识别古董珠宝历史信息、每日三次深度鉴定。林野鉴定小惠发圈二手价值一毛，苏星彤沈嘉欣听墙角被拆穿。早餐后林小鹿返程，嘱咐小惠父亲来闹先报警再找林野。
- name: 第52章：黄金瞳出显威
  notes: 小惠父亲穿旧皮夹克上门闹事，铺开写有黑心传媒扣留少女逼良为娼的白布横幅，索要八万彩礼加二十万儿子娶媳共五十万。林野黄金瞳发现他脖上玉佩是明代晚期和田黄玉瑞兽佩，市场估值一百八十万至二百六十万。
- name: 第53章 叔，你今晚……还收租吗
  notes: 林野展示玉佩鉴定结果：明代和田黄玉瑞兽佩市场价超一百八十万，穷困宋家不可能有传家古玉，爷爷遗留是谎言，小惠实为抱养。小惠忆起十九年偏心待遇决堤痛哭，继而如释重负地笑，林野宣告她只是回家晚了点。
- name: 第54章：整，必须整，谁不整谁孙子！
  notes: 苏星彤追问叔今晚还收租吗，林野宣告整必须整谁不整谁孙子。会议室定策：对金鼎传媒恶意剪辑先发律师函再买热搜，用自黑标题反击钱志国，周小萌组织精神小妹写真实寻人经历对冲抹黑，林野转给芳姐一万元感谢红包。
- name: 第55章 太后懿旨，活着干，死了算
  notes: 林小鹿接到母亲王秀芹召回微信，国庆前一天带对象回家，父亲杀鸡接待。林小鹿警告母亲不是周克梅张少磊钱志国，精神小妹火力覆盖无效。林野拍板全家都去，藏来藏去更麻烦。众人计划买金镯子和烟酒礼物上门。
- name: 第56章 见家长大采购，工资卡都想刷冒烟
  notes: 见家长前大采购，苏星彤戴黑长假发穿白裙扮乖巧，周小萌走乖巧小萌路线，小惠坚持用自己工资单独自给王秀芹买礼物。一行人到商场金店选购金镯子，林小鹿主导实心镯挑选，小惠内心担忧七个姑娘身份被长辈嫌弃。
- name: 第57章 豹子号进村
  notes: 视角转到林野老家村口，张婶刘婶在老槐树下挤兑林野三十岁没对象还丢了工作，拿张婶儿子银行在编月薪三千五作对比。王秀芹护子隐忍，林建国忍无可忍反驳。此时路虎揽胜进村，江A８８８８８豹子号车牌惊呆众人。
- name: 第58章 这闺女，看着乖带劲的，这伦理玩笑可不兴开啊
  notes: 七个姑娘从路虎下车齐声问候，林建国林父乐得合不拢嘴，张婶刘婶看呆。林野把路虎钥匙和雨花石香烟送给父亲。苏星彤叫林建国叔引发我和我儿子亲哥俩的误会，林建国却红光满面开着路虎进村炫耀，车速慢得像在挪。
- name: 第59章 要饭都养他，你儿子白给都没人要
  notes: 张婶炫耀儿子银行在编月薪三千五，苏星彤带小惠沈嘉欣周小萌报工资碾压：一万加提成、一万包吃住、底薪一万二、试用期八千转正一万。张婶指责姑娘们图钱，众人送上金吊坠打火机茶叶，沈嘉欣放话要饭都养我叔。
- name: 第60章 有钱身边皆好人，老爹腰杆终挺直
  notes: 林野感叹人穷回村遭人嫌、人阔放屁都成贵人排气的世态。姑娘们围着王秀芹走巷子，王秀芹腰杆挺直。林建国在院里当众擦拭路虎，向邻居炫耀儿子全款买的三百多万揽胜。林野见父亲挺直的腰板心里发酸，众人进院择菜。
- name: 第61章 叔，年轻前儿也不是一般炮儿啊
  notes: 王秀芹追问七个姑娘谁是小野对象，众人目光投票推苏星彤应对，她自称传统女孩。林建国撞见她小腿上从脚踝蔓延到膝盖以上的青龙纹身，感慨老传统啊。小薇用打火机帮林建国点烟获赞，王秀芹吃醋发怒把他拽进屋教训。
- name: 第62章 舅妈开团，精神小妹反手上强度
  notes: 大舅王大山与舅妈李翠兰上门，李翠兰像挑西红柿般打量七个姑娘，贬低艺人工作不正经，被苏星彤用五险一金合同正规噎住，周小萌补刀项链像村口路灯成精。李翠兰图穷匕见，开口要借五十万给表弟王磊付县城房子首付。
- name: 第63章 破盒值百万，舅妈当场裂开了
  notes: 李翠兰想让王大山拿走被她视为二十块破烂的姥姥木匣，林野黄金瞳察觉异样，先让王大山写下木匣归王秀芹的字据并签名，再按暗扣位置打开铜扣，匣内只有老铜钱和断齿小梳子，李翠兰嘲笑是破烂，林野敲盒底留下悬念。
- name: 第64章 还是那句话，我是个传统的女人
  notes: 王大山证实姥姥曾在江城宋家做保姆七八年；木匣里的百日照片与小惠贴身黄玉瑞兽佩对上，她的亲生家庭疑为宋家；小惠表态只要能跟野哥在一起一切都好，王秀芹当众追问七个姑娘谁是林野的对象。
- name: 第65章 星河入眼，这辈子就交给你了
  notes: 饭后七个姑娘抢着洗碗，王秀芹愁儿子同时处七个对象怕村里说闲话，林建国一句都蒯碗里了拍板接纳；夜里众人沿村道散步看星星和萤火虫，小惠悄悄勾住林野的小指，星空下感情落定。
- name: 第66章 夜袭林野！
  notes: 七个姑娘在田埂上抱住林野集体表态，把他挤进水沟；林家安排住宿，林建国王秀芹带林小鹿去大爷家借住，七女分住东西两屋；深夜小惠溜进偏房，吐露看过百日照片后的心结，说不用再找亲生母亲，身边有人。
- name: 第67章 收苞米？精神小妹要上强度了
  notes: 早饭时王秀芹安排收苞米，七个姑娘争着下地帮忙；周小萌自称干过农活却把苞米说成长在树上，被赵悦记进画本留档；沈嘉欣和小惠亮出从小干农活的家底，王秀芹答应放行，条件是到了地里不许受伤。
- name: 第68章 苞米地里MVP，精神小妹开大播
  notes: 苞米地里七个姑娘全是干活好手，苏星彤速度快成MVP；小薇架起手机开播星耀传媒农业分部，弹幕直呼接地气；张婶儿子张涛到场阴阳林野赚了钱还让父母下地，骂他白眼狼，周小萌要动手被拦，林野上前对峙。
- name: 第69章 盖房租金到账，叔真成刀枪炮了
  notes: 租客联合出资给房东盖房被系统认定为租金，万倍返还江城建筑地产开发有限公司全部股权、一级施工总承包资质、土方资源包和2.5亿现金；林野宣布推倒老屋盖三层小楼；苏星彤周小萌轮番怼张涛，张涛撂狠话离场。
- name: 第70章 宅基地不够大？村支书大笔一挥
  notes: 江城建工设计部经理周明远带队测绘，发现宅基地面积装不下三层小楼方案；林野提出个人出资拓宽进村路、硬化路面、修排水沟并装太阳能路灯，村支书赵支书当场签字，把房后集体留用地连同老宅基地一并批给他。
- name: 第71章 过江龙遇下山虎？是刀枪炮对葱姜蒜！
  notes: 周明远给出三版设计图，林野拍板第三版三层带院子带车库；地头蛇刘彪带纹身汉子分乘三辆车上门，强揽工程索要过路费；江城建工工程部副经理孙大海亮一级资质回击，路虎揽胜江G88888随后碾进村道压场。
- name: 第72章 寿宴总包？这活儿星耀接了
  notes: 王秀芹提起姥爷七十大寿无人操办，舅妈因木匣的事撂挑子；林野接下寿宴并放话谁闹事就收拾谁；星耀传媒礼仪部接单，陈子豪按一桌三千标准联络乡厨，林野分工七女：统筹节目、流程、拍摄、采买管账、气氛组。
- name: 第73章 村口修路风波
  notes: 李翠兰惦记木匣里的紫檀暗格匣和长命锁，深夜联络二舅妈孙丽密谋：让林野把寿宴办大，再当众质问他钱的来路并扣帽子；张涛撺掇刘彪找李瘸子带村民拦挖机闹事；林野到场公布修路全包方案，村民态度反转。
- name: 第74章 嘿，把你当人参种了还得领补贴呢
  notes: 沈嘉欣用监控录像拿捏张涛；强盛公司老板孙德胜带四个光头手下登门示好，见刘彪张涛碍事，一句种人参就把两人带走，全程不到三分钟；村民彻底服气，认定林野成了没人敢惹的刀枪炮，林家在村里地位立住。
- name: 第75章 儿砸，这些年，你没少让社会吃苦吧
  notes: 回城车上林建国憋出儿子没少让社会吃苦吧的疑问，王秀芹劝儿子别碰来钱快的歪路；林野承诺每分钱都有据可查，让父母从今不必担惊受怕；车行至镇外，林野看见路边哭泣的金发碧眼洋妹子，破例停车搭救。
- name: 第76章 捡个洋妹子，还是个毛子精神小妹
  notes: 洋妹子安娜十八岁，靠翻译软件讲述遭遇：为江城来的精神小伙跨国奔现，护照钱包被对方卷走；她不敢报警也不想回家，嫌父亲什么都管；林野自嘲吸附体质升级，从江城精神小妹升级到国际精神小妹，路边捡了毛子摇子。
- name: 第77章 外国小妹拜码头，翻译器当场罢工
  notes: 孙德胜下令摸清卷走外国姑娘护照的大飞；大奎经小奎刚子层层转问，问到麻将馆龙哥头上，龙哥发现大飞就在牌桌对面，收拾一顿搜出护照和粉色手机，押他去见林爷；早餐店里安娜对林野露出崇拜眼神。
- name: 第78章 教父收租，月牙湾直接开盘
  notes: 林野放龙哥把大飞带走发落，提出联系大使馆送安娜回家被拒，安娜嫌父亲管得太死；她摘下手表当租金请求跟着教父；系统判定特殊租金，百达翡丽名表价值46万，万倍返还46亿现金，另奖励江城月牙湾山庄一套。
- name: 第79章 消费不看价，系统奖励度假山庄
  notes: 林野带众人进商场给安娜从里到外配齐衣物，一句不用看价刷掉两万三千六百八；安娜错管王秀芹叫妈妈，逗翻众人；包间里安娜安静喝粥，林野感慨叛逆不是天生，只是没人接住摔疼了才先长出刺。
- name: 80-山庄开门，老两口当场没词了
  notes: 林野开车带父母和姑娘们进驻月牙湾山庄，保安见江G88888车牌和产权证放行，老两口被震住。陈子豪提前布场安排住宿。林野翻阅资产资料，确认餐饮、住宿、活动承接三条业务线，决意把星耀传媒业务整体迁入。
- name: 81-月牙湾寿宴？等翻车吧
  notes: 林野在书房发现老相册，照片金发女人与安娜眉眼相近，便签记有俄语名字和中文地址。安娜自述先跟阿飞来江城，后循母亲提过的线索寻找大庄园。同一晚，王磊、孙丽、李翠兰密谋开宝马回村，雇主播搞打假直播抹黑林野。
- name: 82-靠边停！三十万宝马吃瘪
  notes: 天亮后月牙湾大巴车队开进林家村接人，村民震撼。王磊开三十多万宝马带孙丽、李翠兰回村压场，反被大巴和三轮车卡在村口，被司机要求靠边停给老人让路。孙丽看出车队不是租的，心里发虚，宝马排场彻底被车队压住。
- name: 83-现场打假？产权证糊脸！
  notes: 月牙湾宴会厅寿宴开场，姥爷穿唐装到场。王磊一家进场阴阳场地是租的，王磊发消息给张涛布置打假主播。几名打假主播堵门开直播，质疑山庄是买是租、资金来路，林野唤孙总，孙德胜带光头大汉进场压场，主播吓得手抖。
- name: 84-宝马刚落座，账单先上桌
  notes: 寿宴开席，王磊把宝马钥匙摆上桌炫耀三十多万，孙丽阴阳王秀芹钱来得快守不住。陈子豪当众汇报寿宴总账：单桌三千八百八、主桌八千八、冷链检疫齐备、十六台车接送、三十六间住宿，王磊母子脸挂不住。
- name: 85-养老牌一出，叔把桌掀稳
  notes: 二舅王海发难提姥爷养老，想把责任扣给林野。林野当众晒出十年看病票据与红包礼金记录：王海花销不足两万，王秀芹付出最多。宣布过去不追补，设立三百万养老账户，律师、村委、姥爷三方监管，月度公开。
- name: 86-算盘落空，跳梁小丑现原形
  notes: 王磊在桌下用手机指挥场外闹事，被苏星彤当众念出；林野夺手机把聊天截图投上大屏幕，黄毛主播供出五千元雇闹费，老爷子气得砸拐杖。林野把王磊扔出山庄，宣布王海一家终生禁入月牙湾产业。
- name: 87-流量狙击，精神小妹的情报网
  notes: 小惠自建七个微信群摸到钱志国租仓库刷数据的动作，获批月预算五万独立情报线。金鼎传媒买断江城七成广告位限流星耀，推擦边主播机车西西。林野决定全员迁入山庄，用俄罗斯风情实景直播反击，并定安娜今晚首秀。
- name: 88-商业版图，星耀传媒新矩阵
  notes: 六名壮汉持械袭击山庄，林野一打六全部放倒；小惠审出幕后是鼎盛娱乐赵阔，林野令孙德胜报警留证。系统因山庄安保租金一元触发万倍返还一万元，并奖励永久被动技能黑客精通。孙德胜把林野从合作对象改认作祖宗。
- name: 89-锋芒毕露，同行暗算反被坑
  notes: 林野用黑客精通五分钟拉出赵阔买通平台运营总监刘某限流星耀的邮件与转账证据，交沈嘉欣剪三版分发，广告全面预埋。鼎盛娱乐年度盛典当晚，林野带团队踩场，苏星彤红毯当面讥讽赵阔派人砸道闸，双方决胜在即。
- name: 90-新家落成，乔迁之喜惊全村
  notes: 一个月后林家三层新别墅落成，林野带众人回村验收，村民围观惊叹。三楼留给姑娘们一人一间刻名门牌，安娜凭手表抵租确认房间。王秀芹拿到专属柴火铁锅灶，把备用钥匙托给小惠，苏星彤抢占林野隔壁房间。
- name: 91-夜半惊魂，张涛作死触逆鳞
  notes: 流水席第二天，苏星彤直播新房流水席，王秀芹看出姑娘们会干活有分寸。张涛在村头小卖部与二楞密谋夜里两点泼漆砸玻璃。林建国喝醉感叹这辈子没白活。林野白天已用商业洞察之眼预警张涛报复倾向，决定抓贼抓现行。
- name: 92-村头大树下的“印第安老斑鸠”
  notes: 张涛泼漆未遂被抓，村头流言质疑林野钱来路，村支书赵明福送来乡村振兴优秀青年牌匾。张婶带女儿张倩提亲，开出两百平大平层、八十八万彩礼、公司两成股份等条件；商业洞察之眼揭出她负债十九万七、想借婚姻搞钱。
- name: 93-后山菜地的“地下狂欢”
  notes: 张倩天价条件在村群疯传。周小萌赵悦在后山菜地办社会摇直播，安娜拔萝卜学中文，在线人数冲到十五万。马六等张涛牌友携工具潜入欲剪滴灌管喷漆，林野令安保封下山路、犬舍放犬待命、夜视机位先拍作案过程。
- name: 第94章 擦边风波，重拳出击
  notes: 猫七跳槽星耀三天首播遭水军刷违禁内容，第三次警告即封号。林野拒绝关播，溯源锁定结算方海盛数据与地下钱庄，篡改结算指令冻结总账户，水军断粮，法务向鼎盛娱乐与海盛数据发函报警，订单备注坐实赵阔主使。
- name: 第95章 神秘酒会，资本的鸿门宴
  notes: 李家于江城国际金融中心顶层设黑金酒会，李明哲开价十二亿收购星耀，真实目标直指月牙湾开发优先权，林野追问到地下后回绝。安娜认出李家徽记同母亲相册照片，李明哲抬出索科洛夫家族施压，开白马酒庄讥讽林野。
- name: 第96章 小惠的生母，豪门的弃子
  notes: 安娜手机译出俄文档案，零号矿区李家联合勘探人尼古拉·索科洛夫是其父线索。宋家管家带保镖上门，凭亲子鉴定认回失散女儿小惠，却要她签放弃继承、交还玉佩、一百万买断协议，回避生母下落，苏星彤怒斥宋家。
- name: 第97章 四平公主的嫉妒与代价
  notes: 小惠收到匿名短信，溯源至省城旧城区。星耀宣布进军省城，宋家二小姐宋婉儿带头网暴，被讥为四平公主。商业洞察之眼显示宋婉儿外债十二亿四千万，林野连夜花三十七亿买下抹黑者家族十七份债权，放进林家投资。
- name: 第98章 进军省城，精神小妹的降维打击
  notes: 老档案员兜售小惠生母王氏死亡登记档案，宋家欲销毁原件。省城网红基地开标，宋氏商会只给外地企业两张旁听证，苏星彤坐上谈判桌抖出宋氏文化集团坏账、四十七亿短债与七成三空置率，宋远山用资格评估挡回星耀。
- name: 第99章 赵阔的反扑，困兽之斗
  notes: 小惠生母王秀芹旧照现身：她在旧档案馆门口抱着襁褓，身旁是宋家佣工牌女人，脚边放同款木匣。档案馆随即起火灭证，档案员被掳。取保的赵阔在省江高速设伏，林野撞翻泥头车，赤手放倒四名打手，追问档案员下落。
- name: 第100章 双胞胎的秘密，家族的荣光
  notes: 赵阔带汽油闯入首播工坊，双胞胎小雯小薇用喷淋灭火，以榫卯木架锁人送警，谋杀绑架证据坐实。诺曼公司欲三十万买断其专利，黄金瞳估专利组合价值超一百八十亿，林野反手注资十亿设星耀古建研究院，姐妹任所长。
worldview:
- 现代都市背景：林野三十岁，魔都大厂技术出身的项目负责人，月薪30K，被组织架构调整裁员后带两百万存款回到十八线小县城江城买房买车躺平
- 神级收租系统：检测到宿主强烈情绪波动时绑定，核心功能为宿主名下所有不动产的租金收入以万倍返还至个人账户（绑定宣告称神级收租系统，服务提示自称审计收租系统）
- 系统附加功能：每次返还随机获得黑科技图纸、商业版图、技能与未知奖励，供宿主探索
- 返还品级与租金基数挂钩：林野判断低租金基数对应低返还品级，追求利益最大化需抬高租金
- 租金形式不限：租户交付且被系统认定为租金的物品均可触发万倍返还，丝袜与银脚链皆可作租金
- 特殊判定加成：租户交付最珍贵之物触发全部身家加成与亲情羁绊加成，双胞胎姐妹身份触发姐妹花联动加成，奖励可为房产产权证
- 技能实感：龙精虎猛带来爆发体能与不衰精力，林野体格由面黄肌瘦重塑为精干匀称；百毒不侵在本片段内未展示实际效果
- 小县城生态：三十岁不结婚被视为大逆不道，婚育压力大于事业压力；假招聘扣押身份证的骗局横行，流浪青年求职出行处处受限
- 主线动机：王秀芹以告状为威胁限令林野国庆假期带一个对象回家，直接催生收留精神小妹以应付催婚的计划
- 现代都市背景：故事发生在江城，林野从魔都大厂辞职回乡，靠收租系统万倍返还发家
- 系统返利规则：租客交房租触发万倍返还；租客用自己劳动赚的钱交租同样触发，林野认为不算套娃
- 社会细节：小公司五险一金按最低基数缴纳是行业潜规则；林野以足额缴纳加全体加薪五成收买人心
- 收租万倍返还：系统核心规则，名下不动产的租金可获得万倍返还，收回铺面重新租出去又是一笔进账
- 系统道具录入：许可证与产权证可由系统录入技能库或物品栏，心中激活即生效，无需实体证件，激活时无提示音无特效
- 直播平台生态：钻石打赏、神龙礼物特效、连麦PK、付费首页推荐、批量注册账号恶意举报与违规降权处罚
- 精神小妹圈子：底层精神小妹的圈子文化，圈内互起绰号（卢冰雁被叫百家雁），花信息费即可打听人的下落
- 收租系统：林野的金手指，收租与特定事件达成后发放奖励，本片段奖励为永久被动技能黄金瞳
- 黄金瞳规则：鉴定名下租客主动交付或关联物品的真实价值，识别古董珠宝字画特殊资产的历史信息与市场区间，每日可主动开启三次深度鉴定，不产生现金返还，仅提供价值信息与风险提示
- 换亲旧俗：农村旧俗，两家以女儿互换成亲抵彩礼，宋家欲以小惠换亲为哥哥娶妻，村里以前有这种规矩
- 精神小妹圈层：QQ群联络紧密，消息传播速度快过社交媒体算法，红包动员后可短时间扩散数十个群
- 抱养秘密：小惠实为宋家抱养的孩子，生母遗留的玉佩是身世信物，宋家重男轻女的偏心源于无血缘
- 乡土人情规则：村里人看重编制、房车、存款等体面条件，穷时被挤兑、阔时被奉承，见家长需厚礼开路
- 收租万倍返还系统：宿主收到的租金按万倍返还，可返还现金、公司股权、施工资质、资源包与地产
- 租金认定宽泛：租客主动出资改善房东直系亲属居住环境并绑定自身居住权，也算租金，第69章多方联合出资建房即触发返还
- 特殊租金规则：高价值物品被当作租金交付同样触发万倍返还，并附额外奖励，第78章安娜的名表换来现金与山庄
- 林野的吸附体质：走到哪都能刷到隐藏任务，身边不断聚拢各路边缘少女，自嘲为全球边缘少女救助中心
- 时代背景：现代龙国（架空中国），约2026年；农村宅基地需审批，村集体留用地未确权不能私自建房；直播短视频与网络梗文化盛行
- 小惠身世之谜：姥姥王氏秀兰当年独自去江城，在姓宋的大户人家做保姆七八年，带回百日照片和信物；小惠贴身黄玉瑞兽佩与照片中婴儿所挂相同，其亲生家庭疑为宋家，姥姥与宋家绝非保姆和东家那么简单
- 收租万倍返还系统：宿主名下产业产生租金流水即触发万倍返还，并随机奖励永久技能；提示以【】系统提示音形式出现
- 异能与系统技能并存于现实：黄金瞳可透视墙体与物品，商业洞察之眼可读取人物底细、负债与风险等级，奖励技能如黑客精通（永久被动）
- 直播行业生态：平台流量取决于开屏广告买断与同城推荐权重，平台运营人员可被收买限流；打假直播、水军刷量、雇人闹事是同行竞争惯用手段
- 故事主城为江城，林家村为其下辖乡村；主角以正经企业家自居，遇袭重报警留证与合法经营
- 林野拥有异能之眼：商业洞察之眼读取人物与企业的资金风险、债务、资产数据，可给出行车路线的事故概率，并将合同违约条款逐条标红
- 黄金瞳扫描物品结构，给出性能提升幅度、应用领域与专利组合估值，信息以弹窗形式呈现
- 主播行业生态：水军接码刷量、平台警告封号、粉丝是主播核心资产，跳槽主播常遭旧东家水军打压，星耀以公司承担运营风险区别于鼎盛的罚款文化
- 豪门争产生态：宋家找回失散女儿先逼签放弃继承协议，并急于销毁生母死亡档案，暗示孩子当年的遗失另有隐情
- 月牙湾山庄地下藏有秘密，牵涉安娜母亲的过去与李家、俄罗斯索科洛夫家族的勘探合作
- 商战规则：林野惯用资本手段反杀，买债权代替起诉，用债务关系反向拿捏对手
- 林野一方资金体量极大，可单笔支付三十七亿现金收购债权，并以十亿注册资金设立研究院
