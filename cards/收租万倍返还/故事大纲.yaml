    text: 先让归属落定，再把门关上打脸。
  - chapter: 第69章 盖房租金到账，叔真成刀枪炮了
    context: 苏星彤问他盯着苞米地在想什么，林野心系系统奖励
    text: 我在想，这回真成刀枪炮了。
  - chapter: 第75章 儿砸，这些年，你没少让社会吃苦吧
    context: 车上面对父母对他钱来路不正的担忧，林野郑重承诺
    text: 我赚的每一分钱，都有据可查。公司、账户、流水，你们什么时候想看，我什么时候给你们看。
  - chapter: 85-养老牌一出，叔把桌掀稳
    context: 二舅王海借养老发难，林野当众清算旧账
    text: 过去十年，外公看病、过年、生日、日常开销，每家给过多少钱，谁记得？
  - chapter: 86-算盘落空，跳梁小丑现原形
    context: 揭穿王磊雇闹后下令处置
    text: 把人扔出去。以后月牙湾的产业，王海一家，终生禁入。
  - chapter: 87-流量狙击，精神小妹的情报网
    context: 面对金鼎限流狙击定下反击策略
    text: 那咱们就陪他玩场大的。用俄罗斯风情加月牙湾顶级实景，打他的棚拍擦边球。通知技术部，开启多机位实景首播测试。安娜今晚首秀。
  - chapter: 88-商业版图，星耀传媒新矩阵
    context: 山庄遇袭后坚持报警处理
    text: 我现在是正经企业家。
  - chapter: 第94章 擦边风波，重拳出击
    context: 向被水军围攻的新签主播猫七表态，星耀替主播扛风险
    text: 星耀花钱签你，是让你赚钱，不是让你替公司挡刀。
  - chapter: 第97章 四平公主的嫉妒与代价
    context: 定下不起诉、买债权反制宋婉儿的打法
    text: 我让她换个地方看账单。
  - chapter: 第99章 赵阔的反扑，困兽之斗
    context: 独自驶向设伏的省江高速，追查被掳的档案员
    text: 他们带着档案员，信号就在前面。
