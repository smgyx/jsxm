summary: 现实向都市爽文世界，主舞台江城（翡翠湾小区、星耀传媒、CBD商业综合体、月牙湾山庄），延伸至省城、林家村、魔都与俄罗斯线。社会按现实规则运转，唯一天外设定是收租万倍返还系统：宿主收租、消费、完成任务获得随机倍数返利与奖励，陆续解锁黄金瞳、商业洞察之眼、黑客精通等永久被动。社会层有传媒娱乐圈（星耀传媒、金鼎传媒、鼎盛娱乐）、地方豪族（江城宋家、李家）与海外暗线（索科洛夫家族、诺曼公司）。基调：收租返利的数值爽感＋打脸装逼＋家庭温情与乡土喜剧＋精神小妹群像。
story_summary: 被魔都大厂裁员的程序员林野回江城收租，绑定收租万倍返还系统，与五名欠租精神小妹（苏星彤、宋小惠、沈嘉欣、陈小雯、陈小薇）及后续林小鹿、周小萌、赵悦、安娜等人同居共处。他从收租返利起家：收编小妹团、接手星耀传媒、购置凯雷德与路虎、翡翠湾置业，经历同学聚会打脸、卢冰雁诈骗团伙围猎、见家长、小惠身世揭示（江城宋家与姥姥王氏秀兰的信物之谜）、林家村盖房、获赠月牙湾山庄、安娜拜码头等事件，随后进军省城、成立星耀古建研究院。故事至第100章戛然而止：宋家身世线、李家觊觎月牙湾地下、安娜父亲下落、省城竞标结果均为未完结悬念。
