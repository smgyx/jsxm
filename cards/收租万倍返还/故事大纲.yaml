  - chapter: 46-举报十七次，叔的刀还没凉呢
    context: 决定不归还偷来的五菱宏光，向周小萌赵悦表态
    text: 卢冰雁要报警就报，偷你们身份证的账还没跟她算完。
  - chapter: 第53章 叔，你今晚……还收租吗
    context: 向小惠揭示玉佩真相，宣告她不是换亲牺牲品
    text: 你不是什么被换亲的牺牲品，你也不是什么讨债鬼。你只是回家晚了点而己。
  - chapter: 第54章：整，必须整，谁不整谁孙子！
    context: 面对小惠问他是否怕被骂，说出护短底线
