    .rel-badge { display: inline-block; margin-left: 5px; font-size: 13px; vertical-align: middle; }

    @keyframes bloomPulse {

  <script type="module">
    function formatMoney(num) {
      num = Number(num) || 0;
      const neg = num < 0; num = Math.abs(num);
      let s;
      if (num >= 100000000) s = (num / 100000000).toFixed(2).replace(/\.?0+$/, '') + '亿';
      else if (num >= 10000) s = (num / 10000).toFixed(num % 10000 ? 1 : 0) + '万';
      else s = num.toLocaleString('zh-CN');
      return (neg ? '-' : '') + s;
    }

    let assetCache = { item: {}, house: {}, car: {} };
    let bizCache = {};

    const MC_KINDS = {
      item:  { title: '随身道具', l1: '道具名称', l2: '道具描述', suffix: '' },
      house: { title: '不动产档案', l1: '物业名称', l2: '当前状态', suffix: '' },
      car:   { title: '座驾档案', l1: '车辆型号', l2: '当前状态', suffix: '' }
    };
    const BIZ_KINDS = {
      prod:    { title: '核心产品', l1: '产品名称', l2: '产品状态', path: ['经营', '核心产品'] },
      asset:   { title: '核心资产', l1: '资产名称', l2: '资产状态', path: ['资产与福利', '固定资产'] },
      welfare: { title: '团队福利', l1: '福利项目', l2: '福利详情', path: ['资产与福利', '员工福利'] }
    };

    function showModal(title, label1, val1, label2, val2) {
      $('#modal-title-text').text(title);
      $('#modal-p1-label').text(label1);
      $('#modal-p1-val').text(val1);
      if (label2) {
        $('#modal-p2-row').show();
        $('#modal-p2-label').text(label2);
        $('#modal-p2-val').text(val2);
      } else {
        $('#modal-p2-row').hide();
      }
      $('#asset-modal').addClass('show');
    }

    function closeModal() {
      $('#asset-modal').removeClass('show');
    }

    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function relBadge(rel) {
      if (!rel) return '';
      if (rel.includes('妻子') || rel.includes('未婚妻')) return '<span class="rel-badge rel-ring">💍</span>';
      if (rel.includes('恋人')) return '<span class="rel-badge rel-flower">🎕</span>';
      if (rel.includes('暧昧')) return '<span class="rel-badge rel-spark">✨</span>';
      if (rel.includes('前任')) return '<span class="rel-badge rel-storm">⛈️</span>';
      if (rel.includes('租客') || rel.includes('房客')) return '<span class="rel-badge rel-music">🏠</span>';
      if (rel.includes('陌生')) return '<span class="rel-badge rel-frost">❄️</span>';
      return '';
    }

    function renderTabEnv(sd) {
      $('#env-vol').text(_.get(sd, '世界.剧情节点.当前事件', '-'));
      $('#env-node').text(_.get(sd, '世界.剧情节点.当前节点', '-'));
      $('#env-next').text(_.get(sd, '世界.剧情节点.下一个事件', '') || '（暂无）');

      const task = _.get(sd, '任务.当前任务', {}) || {};
      if (task && task.标题) {
        $('#env-task').show();
        $('#env-task-title').text(task.标题);
        $('#env-task-req').text(task.要求 || '-');
        $('#env-task-reward').text(task.奖励 || '-');
        $('#env-task-due').text(task.期限 || '无期限');
      } else {
        $('#env-task').hide();
      }

      const opts = _.get(sd, '选项', []) || [];
      if (opts.length) {
        $('#env-opt').show();
        $('#env-opt-text').text('下一步：' + opts[0]);
        $('#env-opt').data('opt', opts[0]);
      } else {
        $('#env-opt').hide();
      }
    }

    function renderTabMc(sd) {
      const base = _.get(sd, '主角.基本信息', {}) || {};
      $('#mc-name').text(base.姓名 || '-');
      $('#mc-age').text((base.年龄 || '-') + '岁');
      $('#mc-gender').text(base.性别 || '-');
      $('#mc-rank').text(_.get(sd, '主角.系统.神豪等级', '-'));
      $('#mc-look').text(base.外貌 || '-');
      $('#mc-body').text(base.体型 || '-');
      $('#mc-wear').text(base.衣着 || '-');
      $('#mc-id').text(_.get(sd, '主角.身份.社会身份', '-'));
      $('#mc-job').text(_.get(sd, '主角.身份.职业', '-'));

      const sys = _.get(sd, '主角.系统', {}) || {};
      $('#sys-cashback').text((sys.返现倍数 || 0).toLocaleString() + ' 倍');
      $('#sys-rebate').text('¥ ' + formatMoney(sys.累计返利 || 0));

      const ast = _.get(sd, '主角.资产', {}) || {};
      $('#ast-cash').text('¥ ' + formatMoney(ast.现金 || 0));

      assetCache.item = ast.道具 || {};
      assetCache.house = ast.房产 || {};
      assetCache.car = ast.车辆 || {};

      const renderBtns = (obj, type) => {
        const keys = Object.keys(obj || {});
        if (keys.length === 0) return '<span style="color:#718096; font-size:11px;">暂无</span>';
        return keys.map(k => {
          const shortName = k.length > 10 ? k.substring(0, 10) + '...' : k;
          return `<div class="btn-asset" data-type="${type}" data-key="${esc(k)}">${esc(shortName)}</div>`;
        }).join('');
      };

      $('#ast-item').html(renderBtns(ast.道具, 'item'));
      $('#ast-house').html(renderBtns(ast.房产, 'house'));
      $('#ast-car').html(renderBtns(ast.车辆, 'car'));

      const skills = sys.被动技能 || [];
      $('#mc-skills').html(skills.length
        ? skills.map(s => `<span class="tag">${esc(s)}</span>`).join('')
        : '<span style="color:#718096; font-size:11px;">系统刚绑定，还没发奖励</span>');
    }

    function renderTabBiz(sd) {
      const villa = _.get(sd, '别墅', {}) || {};
      $('#villa-fame-bar').css('width', Math.max(0, Math.min(100, villa.口碑 || 0)) + '%');
      $('#villa-fame-num').text((villa.口碑 || 0) + ' / 100');
      $('#villa-facility').text((villa.设施等级 == null ? 0 : villa.设施等级) + ' / 5');
      $('#villa-vacant').text((villa.空房数 == null ? 5 : villa.空房数) + ' / 5');

      const corps = _.get(sd, '产业', {});
      bizCache = corps;
      let html = '';

      if (Object.keys(corps).length === 0) {
        html = '<div class="data-value" style="text-align:center; padding: 20px;">产业版图尚未铺开，先当好收租房东</div>';
      } else {
        Object.entries(corps).forEach(([name, c]) => {
          const income = _.get(c, '财务.月收入', 0);
          const expense = _.get(c, '财务.月支出', 0);
          const profit = income - expense;
          const cashFlow = _.get(c, '财务.现金流', 0);

          const prodsObj = _.get(c, '经营.核心产品', {});
          const prodsHTML = Object.keys(prodsObj).length > 0
            ? Object.keys(prodsObj).map(k => `<span class="tag biz-btn" data-kind="prod" data-corp="${esc(name)}" data-key="${esc(k)}">${esc(k)}</span>`).join('')
            : '-';

          const assetsObj = _.get(c, '资产与福利.固定资产', {});
          const assetsHTML = Object.keys(assetsObj).length > 0
            ? Object.keys(assetsObj).map(k => `<div class="btn-asset biz-btn" data-kind="asset" data-corp="${esc(name)}" data-key="${esc(k)}">${esc(k.length>8?k.substring(0,8)+'...':k)}</div>`).join('')
            : '<span style="color:#718096; font-size:11px;">暂无</span>';

          const welfaresObj = _.get(c, '资产与福利.员工福利', {});

    function renderTabGirls(sd) {

                    <div class="grid-2">
                      <div class="data-row"><div class="data-label">初吻</div><div class="data-value">${esc(secret.初吻 || '未发生')}</div></div>
                      <div class="data-row"><div class="data-label">初夜</div><div class="data-value">${esc(secret.初夜 || '未发生')}</div></div>

                      <div class="data-row"><div class="data-label">最近性事</div><div class="data-value">${esc(secret.最近性事 || '无')}</div></div>
                    </div>

                      <div class="emo-bar-row"><div class="emo-bar-label"><span>开发·胸部</span><span>${dev.胸部 || 0}</span></div><div class="emo-bar-track"><div class="emo-bar-fill" style="width:${dev.胸部 || 0}%; background:#d6bcfa;"></div></div></div>
                      <div class="emo-bar-row"><div class="emo-bar-label"><span>开发·下身</span><span>${dev.下身 || 0}</span></div><div class="emo-bar-track"><div class="emo-bar-fill" style="width:${dev.下身 || 0}%; background:#d6bcfa;"></div></div></div>
                      <div class="emo-bar-row"><div class="emo-bar-label"><span>开发·后穴</span><span>${dev.后穴 || 0}</span></div><div class="emo-bar-track"><div class="emo-bar-fill" style="width:${dev.后穴 || 0}%; background:#d6bcfa;"></div></div></div>

      const __openIdx = $('#girls-container .acc-item').map(function (i, el) { return $(el).find('.acc-body').is(':visible') ? i : -1; }).get().filter(function (i) { return i >= 0; });
      $('#girls-container').html(html);
      $('#girls-container .acc-item').each(function (i, el) { if (__openIdx.indexOf(i) >= 0) $(el).find('.acc-body').show(); });

    function renderTabNpc(sd) {
      const npcs = _.get(sd, 'NPC', {});
      let html = '';
      if (Object.keys(npcs).length === 0) {
        html = '<div class="data-value" style="text-align:center; padding: 20px;">暂无交际人脉</div>';
      } else {
        Object.entries(npcs).forEach(([name, n]) => {
          const roles = Object.entries(_.get(n, '身份', {})).map(([k, v]) => {
            return `<div style="margin-bottom:4px; font-size:11px;"><span class="tag">${esc(k)}</span> <span style="color:#cbd5e0;">${esc(v)}</span></div>`;
          }).join('');

          const rels = Object.entries(_.get(n, '关系', {})).map(([k, v]) => {
            return `<div style="margin-bottom:4px; font-size:11px;"><span class="tag" style="background:rgba(255,154,162,0.15); color:#ffb3ba; border-color:rgba(255,154,162,0.3);">${esc(k)}</span> <span style="color:#cbd5e0;">${esc(v)}</span></div>`;

                <div style="padding-top:8px; border-top:1px dashed rgba(255,255,255,0.05);">
                  <div style="font-size:11px; color:#a0aec0; margin-bottom:4px;">[ 牵绊关系 ]</div>

      }
      const __openIdx = $('#npc-container .acc-item').map(function (i, el) { return $(el).find('.acc-body').is(':visible') ? i : -1; }).get().filter(function (i) { return i >= 0; });
      $('#npc-container').html(html);
      $('#npc-container .acc-item').each(function (i, el) { if (__openIdx.indexOf(i) >= 0) $(el).find('.acc-body').show(); });
    }

    function unwrapStat(data) {
      if (!data) return null;
      if (data.stat_data && typeof data.stat_data === 'object') return data.stat_data;
      if (data.主角 || data.世界 || data.红颜) return data;
      return null;
    }

    /* 兼容加固：Mvu/getVariables 在部分版本返回 Promise，统一按异步解包 */
    function readStatSd() {
      const jobs = [];
      const addJob = (fn) => { try { jobs.push(Promise.resolve(fn())); } catch (e) { /* 忽略单源失败 */ } };
      try { if (window.parent && window.parent.Mvu && window.parent.Mvu.getMvuData) addJob(() => window.parent.Mvu.getMvuData({ type: 'message', message_id: 'latest' })); } catch (e) {}
      try { if (window.Mvu && window.Mvu.getMvuData) addJob(() => window.Mvu.getMvuData({ type: 'message', message_id: 'latest' })); } catch (e) {}
      try { if (typeof getVariables === 'function') addJob(() => getVariables({ type: 'message', message_id: 'latest' })); } catch (e) {}
      try { if (window.parent && typeof window.parent.getVariables === 'function') addJob(() => window.parent.getVariables({ type: 'message', message_id: 'latest' })); } catch (e) {}
      try { if (typeof getAllVariables === 'function') addJob(() => getAllVariables()); } catch (e) {}
      return Promise.all(jobs.map(j => j.then(unwrapStat).catch(() => null))).then(list => {
        for (let i = 0; i < list.length; i++) if (list[i]) return list[i];
        return null;
      });
    }

    function populateData() {
      readStatSd().then(sd => {
        if (!sd) return;
        const __sig = JSON.stringify(sd);
        if (__sig === populateData.__lastSig) return;
        populateData.__lastSig = __sig;

        $('#t-day').text('第' + (_.get(sd, '世界.日期', 1) || 1) + '天 · ' + (_.get(sd, '世界.时段', '') || ''));
        $('#t-loc').text(_.get(sd, '世界.当前地点', '-'));
        $('#t-wea').text(_.get(sd, '世界.天气', '-'));

        renderTabEnv(sd);
        renderTabMc(sd);
        renderTabBiz(sd);
        renderTabGirls(sd);
        renderTabNpc(sd);
      }).catch(() => {});
    }

    let populateTimer = null;
    /* 兼容加固：iframe 存活检查——容器脱离文档即停工并自解绑，防止消息渲染iframe销毁后残留僵尸监听器 */
    function sbAlive() {
      try { return !!(document.body && document.getElementById('status-bar-container')); } catch (e) { return false; }
    }
    let sbHandlers = [];
    function sbUnbindAll() {
      for (let i = 0; i < sbHandlers.length; i++) {
        try { if (typeof eventRemove === 'function') eventRemove(sbHandlers[i][0], sbHandlers[i][1]); } catch (e) { /* 旧版无解绑API，依赖存活检查no-op */ }
      }
      sbHandlers = [];
    }
    function sbOn(ev, fn) {
      eventOn(ev, fn);
      sbHandlers.push([ev, fn]);
    }
    function schedulePopulate() {
      if (!sbAlive()) { sbUnbindAll(); return; }
      if (populateTimer !== null) return;
      populateTimer = setTimeout(function () { populateTimer = null; if (sbAlive()) populateData(); }, 120);
    }

    function sendText(text) {
      const t = String(text || '').trim();
      if (!t) return false;
      try { if (typeof triggerSlash === 'function') { triggerSlash('/send ' + t + ' | /trigger'); return true; } } catch (e) {}
      try {
        const ctx = window.parent.SillyTavern && window.parent.SillyTavern.getContext && window.parent.SillyTavern.getContext();
        if (ctx && ctx.executeSlashCommandsWithOptions) { ctx.executeSlashCommandsWithOptions('/send ' + t + ' | /trigger'); return true; }
      } catch (e) {}
      try {
        const w = window.parent || window;
        const ta = w.document.querySelector('#send_textarea');
        if (ta && !ta.value) { ta.value = t; ta.dispatchEvent(new Event('input', { bubbles: true })); return true; }
      } catch (e) {}
      return false;
    }

    async function init() {
      await waitGlobalInitialized('Mvu');

      $('#status-bar-container')
        .on('click', '.acc-header', function () {
          $(this).next('.acc-body').stop(true, true).slideToggle(200);
        })
        .on('click', '.emotion-lock, .blur-lock.secret-lock', function () {
          $(this).toggleClass('unlocked');
        });

      $('#tab-mc').on('click', '.btn-asset', function () {
        const k = MC_KINDS[$(this).data('type')];
        if (!k) return;
        const key = $(this).data('key');
        const raw = assetCache[$(this).data('type')] ? assetCache[$(this).data('type')][key] : undefined;
        showModal(k.title, k.l1, key, k.l2, (raw === undefined || raw === null ? '-' : raw) + k.suffix);
      });

      $('#biz-container').on('click', '.biz-btn', function () {
        const k = BIZ_KINDS[$(this).data('kind')];
        if (!k) return;
        const corp = $(this).data('corp');
        const key = $(this).data('key');
        showModal(k.title, k.l1, key, k.l2, _.get(bizCache, [corp].concat(k.path, [key]), '-'));
      });

      $('#env-opt').on('click', function () {
        const t = $(this).data('opt');
        if (t) sendText(t);
      });

      $('.tab-btn').on('click', function() {
        $('.tab-btn').removeClass('active');
        $(this).addClass('active');
        $('.tab-content').removeClass('active');
        $('#' + $(this).data('target')).addClass('active');
      });

      $('#modal-close-btn').on('click', closeModal);
      $('#asset-modal').on('click', function(e) {
        if (e.target === this) closeModal();
      });

      populateData();
      /* 兼容加固：事件驱动为主（变量更新即刷新），仅保留10s低频兜底且页面不可见或iframe失效时休眠 */
      sbOn(Mvu.events.VARIABLE_UPDATE_ENDED, schedulePopulate);
      if (Mvu.events.VARIABLE_UPDATED) sbOn(Mvu.events.VARIABLE_UPDATED, schedulePopulate);
      setInterval(function () {
        if (!sbAlive()) { sbUnbindAll(); return; }
        if (document.visibilityState === 'visible') schedulePopulate();
      }, 10000);
      window.addEventListener('unload', sbUnbindAll);
      window.addEventListener('pagehide', sbUnbindAll);
    }

    $(errorCatched(init));
  </script>
</head>

      <div class="tab-btn" data-target="tab-npc">世间人物</div>
    </div>

    <div id="tab-env" class="tab-content active">
      <div class="card" style="border-color: rgba(233, 216, 253, 0.3); background: rgba(233, 216, 253, 0.03); box-shadow: 0 0 15px rgba(233, 216, 253, 0.05);">

        <div class="data-row"><div class="data-label">当前节点</div><div class="data-value full val-highlight" id="env-node"></div></div>
        <div class="data-row"><div class="data-label">下一个事件</div><div class="data-value full val-alert" id="env-next"></div></div>
        <div class="opt" id="env-opt" style="display:none;">
          <span id="env-opt-text"></span>
        </div>
      </div>
      <div class="card" id="env-task" style="display:none;">
