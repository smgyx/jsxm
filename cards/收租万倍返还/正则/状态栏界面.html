<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>收租万倍返还 · 系统终端</title>
<style>
:root{
  --bg:#14161d; --surface:#1d2029; --surface-2:#232734; --border:#313648;
  --text:#e8eaf0; --muted:#8b91a3; --gold:#ffc857; --pink:#ff9aa2; --blue:#8aacdb;
  --danger:#ff6b6b; --purple:#b07cff;
}
body{margin:0;padding:0;font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:transparent;color:var(--text)}
*{box-sizing:border-box}
#status-bar-container{width:100%;height:520px;background:linear-gradient(135deg,#1a1e29 0%,#10121a 100%);border:1px solid rgba(255,255,255,.08);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.4);position:relative}
@media(min-width:768px){#status-bar-container{width:72%}}
.topbar{display:flex;gap:8px;flex-wrap:wrap;padding:8px 12px;font-size:12px;color:var(--muted);border-bottom:1px solid rgba(255,255,255,.06)}
.topbar b{color:var(--gold);font-weight:600}
.tabs{display:flex;background:rgba(0,0,0,.2);padding:0 6px;flex-shrink:0}
.tab-btn{flex:1;padding:11px 0;text-align:center;cursor:pointer;font-size:12px;color:#718096;position:relative}
.tab-btn.active{color:#f7fafc}
.tab-btn.active::after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:40%;height:2px;background:linear-gradient(90deg,var(--pink),var(--blue))}
.tab-content{display:none;flex:1;padding:12px 14px;overflow:auto}
.tab-content.active{display:block}
.card{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);border-radius:8px;padding:12px;margin-bottom:10px}
.card-title{font-size:13px;font-weight:600;margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.06)}
.card-title::before{content:"";display:inline-block;width:4px;height:12px;background:linear-gradient(180deg,var(--blue),var(--pink));margin-right:8px;border-radius:2px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.data-row{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:3px 0}
.data-label{color:var(--muted);flex:none}
.data-value{color:var(--text);text-align:right}
.data-value.full{text-align:left;color:var(--gold)}
.story{color:#e9d8fd}
.bar{height:6px;background:#10121a;border-radius:6px;overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:#ff5c8a}
.sub{font-size:11px;color:var(--muted);margin-top:2px}
.item{font-size:12px;padding:6px 8px;background:rgba(255,255,255,.03);border-radius:8px;margin-top:6px}
.item b{color:var(--text)}
.item span{color:var(--muted)}
.empty{color:var(--muted);font-size:12px;text-align:center;padding:12px}
.acc-header{cursor:pointer;padding:8px;border-radius:8px;background:rgba(255,255,255,.03);margin-top:6px;font-size:13px}
.acc-body{display:none;padding:8px 8px 4px}
.tag{display:inline-block;font-size:11px;color:var(--purple);border:1px solid var(--purple);border-radius:4px;padding:0 6px;margin-left:6px}
.notice,.err{padding:24px 16px;text-align:center;color:var(--muted)}
.err{color:var(--danger)}
.opt{display:flex;align-items:center;gap:8px;margin-top:8px;padding:10px 12px;border-radius:8px;border:1px solid rgba(138,172,219,.4);background:rgba(138,172,219,.08);cursor:pointer;font-size:13px}
.opt:active{filter:brightness(1.15)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.frow{display:flex;flex-direction:column;gap:3px}
.frow.wide{grid-column:1/-1}
.frow label{font-size:11px;color:var(--muted)}
.frow input{background:#10121a;border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:13px;padding:6px 9px;font-family:inherit;width:100%}
.fbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.fbtns button{flex:1;min-width:140px;border-radius:8px;border:1px solid var(--border);font-size:13px;padding:8px 10px;cursor:pointer;font-family:inherit}
#btnDefault{background:var(--gold);border-color:var(--gold);color:#10131a;font-weight:700}
#btnCustom{background:var(--surface-2);color:var(--pink);border-color:var(--pink)}
.fbtns button:disabled{opacity:.45;cursor:default}
.fmsg{font-size:12px;color:var(--muted);margin-top:8px;min-height:1em}
.fmsg.bad{color:var(--danger)}
.reg-tip{font-size:12px;color:var(--muted);margin-bottom:8px}
</style>
</head>
<body>
<div id="status-bar-container">
  <div class="topbar" id="topbar">正在读取时间与地点…</div>
  <div class="tabs" id="tabs">
    <div class="tab-btn active" data-target="tab-env">剧情</div>
    <div class="tab-btn" data-target="tab-mc">个人名片</div>
    <div class="tab-btn" data-target="tab-biz">产业</div>
    <div class="tab-btn" data-target="tab-girls">红颜</div>
    <div class="tab-btn" data-target="tab-npc">其余人物</div>
  </div>
  <div id="tab-env" class="tab-content active"></div>
  <div id="tab-mc" class="tab-content"></div>
  <div id="tab-biz" class="tab-content"></div>
  <div id="tab-girls" class="tab-content"></div>
  <div id="tab-npc" class="tab-content"></div>
</div>
<script>
(function(){
  var box = document.getElementById("status-bar-container");
  var DEFAULTS = {姓名:"林野",年龄:"30",性别:"男",身高:"一米八二",体型:"久坐微堕，尚未被系统改造",外貌:"三十岁，大厂十年项目负责人，气质偏沉",衣着:"灰色T恤配黑色休闲裤"};
  var ui = { mode:null };
  var last = "";
  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function fmt(n){
    n = Number(n)||0; var neg=n<0; n=Math.abs(n); var s;
    if(n>=1e8) s=(n/1e8).toFixed(n%1e8?2:0)+"亿";
    else if(n>=1e4) s=(n/1e4).toFixed(n%1e4?1:0)+"万";
    else s=n.toLocaleString("zh-CN");
    return (neg?"-":"")+s;
  }
  function row(k,v,full){ return '<div class="data-row"><div class="data-label">'+esc(k)+'</div><div class="data-value'+(full?" full":"")+'">'+esc(v||"—")+'</div></div>'; }
  function bar(v){ v=Number(v)||0; return '<div class="bar"><i style="width:'+Math.max(0,Math.min(100,v))+'%"></i></div><div class="sub">'+v+' / 100</div>'; }
  function keys(o){ return o && typeof o==="object" ? Object.keys(o) : []; }
  function readStat(){
    var tries = [];
    try { if (window.parent && window.parent.Mvu && window.parent.Mvu.getMvuData) tries.push(function(){ return window.parent.Mvu.getMvuData({ type:"message", message_id:"latest" }); }); } catch(e){}
    try { if (window.Mvu && window.Mvu.getMvuData) tries.push(function(){ return window.Mvu.getMvuData({ type:"message", message_id:"latest" }); }); } catch(e){}
    for (var i=0;i<tries.length;i++){
      try { var d = tries[i](); if (d && d.stat_data) return d.stat_data; } catch(e){}
    }
    try { if (typeof getVariables === "function") { var v = getVariables({ type:"message", message_id:"latest" }); if (v && v.stat_data) return v.stat_data; } } catch(e){}
    return null;
  }
  function cleanText(s){ return String(s||"").replace(/[|{}\[\]<>]/g," ").replace(/\s*\n\s*/g," ").trim(); }
  function sendText(text){
    var t = cleanText(text);
    try { if (typeof triggerSlash === "function") { triggerSlash("/send " + t + " | /trigger"); return true; } } catch(e){}
    try { var ctx = window.SillyTavern && window.SillyTavern.getContext && window.SillyTavern.getContext();
      if (ctx && ctx.executeSlashCommandsWithOptions) { ctx.executeSlashCommandsWithOptions("/send " + t + " | /trigger"); return true; } } catch(e){}
    try { var w = window.parent || window; var ta = w.document.querySelector("#send_textarea");
      if (ta && !ta.value) { ta.value = t; ta.dispatchEvent(new Event("input",{bubbles:true})); return true; } } catch(e){}
    return false;
  }
  function renderForm(){
    document.getElementById("tabs").style.display = "none";
    ["tab-env","tab-mc","tab-biz","tab-girls","tab-npc"].forEach(function(id){ document.getElementById(id).classList.remove("active"); });
    var env = document.getElementById("tab-env");
    env.classList.add("active");
    var h = '<div class="card"><div class="card-title">房东登记</div>';
    h += '<div class="reg-tip">系统刚绑定，还没发奖励。填档案后提交，或直接按林野来。</div><div class="fgrid">';
    ["姓名","年龄","性别","身高","体型"].forEach(function(k){
      h += '<div class="frow"><label>'+k+'</label><input id="f_'+k+'" placeholder="'+esc(DEFAULTS[k])+'"></div>';
    });
    h += '<div class="frow wide"><label>外貌</label><input id="f_外貌" placeholder="'+esc(DEFAULTS.外貌)+'"></div>';
    h += '<div class="frow wide"><label>衣着</label><input id="f_衣着" placeholder="'+esc(DEFAULTS.衣着)+'"></div></div>';
    h += '<div class="fbtns"><button id="btnDefault" type="button" data-act="default">按林野来</button><button id="btnCustom" type="button" data-act="custom">以此档案开局</button></div>';
    h += '<div class="fmsg" id="fmsg"></div></div>';
    env.innerHTML = h;
  }
  function fieldVal(k){ var el = document.getElementById("f_"+k); return el ? el.value.trim() : ""; }
  function doSubmit(useDefault){
    var vals = {};
    ["姓名","年龄","性别","身高","体型","外貌","衣着"].forEach(function(k){ vals[k] = useDefault ? DEFAULTS[k] : fieldVal(k); });
    var m = document.getElementById("fmsg");
    if(!useDefault && !vals.姓名){ m.textContent = "至少写个名字，或直接点按林野来。"; m.className = "fmsg bad"; return; }
    if(!useDefault) Object.keys(vals).forEach(function(k){ if(!vals[k]) vals[k] = DEFAULTS[k]; });
    var msg = useDefault ? "按林野来" : "【接手登记】姓名："+vals.姓名+"｜年龄："+vals.年龄+"｜性别："+vals.性别+"｜身高："+vals.身高+"｜体型："+vals.体型+"｜外貌："+vals.外貌+"｜衣着："+vals.衣着;
    var ok = sendText(msg);
    if(ok){ m.className = "fmsg"; m.textContent = "已发送。系统确认后，这一章才往下走。"; }
    else { m.className = "fmsg bad"; m.textContent = "自动发送失败。请把这句话打进输入框：" + msg; }
  }
  function renderEnv(sd){
    var w=sd.世界||{}, p=(w.剧情节点)||{};
    var h='<div class="card"><div class="card-title story">剧情卷轴</div>';
    h+=row("当前事件", p.当前事件, true);
    h+=row("当前节点", p.当前节点, true);
    h+=row("下一个事件", p.下一个事件, true);
    var opts = sd.选项 || [];
    var optsOn = false;
    try { optsOn = !!window.parent.document.querySelector("[data-opts-on]"); } catch(e){}
    if(optsOn && opts.length){
      h += '<div class="opt" data-opt="'+esc(opts[0])+'">下一步：'+esc(opts[0])+'</div>';
    }
    h+='</div><div class="card"><div class="card-title">时间与地点</div>';
    h+=row("日期", "第"+(w.日期||1)+"天 · "+(w.时段||""));
    h+=row("地点", w.当前地点, true);
    h+=row("天气", w.天气, true);
    h+='</div>';
    document.getElementById("tab-env").innerHTML=h;
  }
  function renderMc(sd){
    var u=sd.主角||{};
    var h='<div class="card"><div class="card-title">个人名片</div><div class="grid-2">';
    ["姓名","年龄","性别","身高","体型","神豪等级"].forEach(function(k){ h+=row(k,u[k]); });
    h+='</div>';
    h+=row("外貌", u.外貌, true);
    h+=row("衣着", u.衣着, true);
    h+=row("现金", fmt(u.现金));
    h+=row("累计返利", fmt(u.累计返利));
    h+=row("返现", "万倍");
    h+=row("被动技能", (u.被动技能||[]).join("、")||"未解锁", true);
    var en = u.精力||{}, st = u.体力||{};
    h+=row("精力", (en.当前值==null?100:en.当前值)+" / "+(en.上限||100));
    h+=row("体力", (st.当前值==null?100:st.当前值)+" / "+(st.上限||100));
    h+='</div>';
    document.getElementById("tab-mc").innerHTML=h;
  }
  function renderBiz(sd){
    var u=sd.主角||{}, ind=u.名下产业||{}, bz=sd.别墅||{};
    var h='<div class="card"><div class="card-title">产业</div>';
    var ks=keys(ind);
    if(!ks.length) h+='<div class="empty">还没有产业</div>';
    ks.forEach(function(k){ h+='<div class="item"><b>'+esc(k)+'</b><br><span>'+esc(ind[k])+'</span></div>'; });
    h+='</div><div class="card"><div class="card-title">别墅</div>';
    h+=row("口碑", bz.口碑);
    h+=row("设施等级", (bz.设施等级||0)+" / 5");
    h+=row("空房数", (bz.空房数==null?5:bz.空房数)+" / 5");
    h+='</div>';
    document.getElementById("tab-biz").innerHTML=h;
  }
  function personCard(name, o, extra){
    var h='<div class="acc-item"><div class="acc-header"><b>'+esc(name)+'</b>';
    if(extra) h+='<span class="tag">'+esc(extra)+'</span>';
    h+='</div><div class="acc-body">';
    keys(o).forEach(function(k){
      var v=o[k];
      if(v && typeof v==="object") return;
      h+=row(k, v, String(v).length>18);
      if(k==="好感") h+=bar(v);
    });
    h+='</div></div>';
    return h;
  }
  function renderGirls(sd){
    var girls=sd.红颜||{}, tenants=sd.角色||{};
    var h='<div class="card"><div class="card-title">红颜</div>';
    var gk=keys(girls);
    if(!gk.length) h+='<div class="empty">关系明确后，会写进这里。</div>';
    gk.forEach(function(n){ h+=personCard(n, girls[n], girls[n].关系); });
    h+='</div><div class="card"><div class="card-title">在住租客</div>';
    var tk=keys(tenants);
    if(!tk.length) h+='<div class="empty">还没有租客入住</div>';
    tk.forEach(function(n){
      var c=tenants[n]||{};
      h+=personCard(n, {房间:c.房间,好感:c.好感,情绪:c.情绪,心理想法:c.心理想法,在住:c.在住?"是":"否"}, c.在住?"":"未入住");
    });
    h+='</div>';
    document.getElementById("tab-girls").innerHTML=h;
  }
  function renderNpc(sd){
    var p=sd.人物||{};
    var h='<div class="card"><div class="card-title">其余人物</div>';
    var ks=keys(p);
    if(!ks.length) h+='<div class="empty">还没有其余人物</div>';
    ks.forEach(function(n){ h+=personCard(n, p[n], p[n].身份); });
    h+='</div>';
    document.getElementById("tab-npc").innerHTML=h;
  }
  function showTabs(){
    document.getElementById("tabs").style.display = "flex";
  }
  function paint(){
    if(ui.mode === "form") return;
    var sd=readStat();
    if(!sd){ document.getElementById("topbar").textContent="正在连接变量…若一直停在这里，确认酒馆助手已开前端渲染。"; return; }
    if(sd.主角 && sd.主角.已登记 === false){
      ui.mode = "form";
      last = "";
      var w0 = sd.世界||{};
      document.getElementById("topbar").innerHTML = "第<b>"+esc(w0.日期||1)+"</b>天 · "+esc(w0.时段||"")+" · <b>"+esc(w0.当前地点||"—")+"</b>";
      renderForm();
      return;
    }
    showTabs();
    var sig=JSON.stringify(sd);
    if(sig===last) return;
    last=sig;
    var w=sd.世界||{};
    document.getElementById("topbar").innerHTML="第<b>"+esc(w.日期||1)+"</b>天 · "+esc(w.时段||"")+" · <b>"+esc(w.当前地点||"—")+"</b>";
    renderEnv(sd); renderMc(sd); renderBiz(sd); renderGirls(sd); renderNpc(sd);
    box.querySelectorAll(".acc-header").forEach(function(el){
      el.onclick=function(){ var b=el.nextElementSibling; if(b) b.style.display = b.style.display==="block" ? "none" : "block"; };
    });
  }
  box.addEventListener("click", function(e){
    var t = e.target;
    var tab = t.closest && t.closest(".tab-btn");
    if(tab){
      box.querySelectorAll(".tab-btn").forEach(function(b){ b.classList.remove("active"); });
      box.querySelectorAll(".tab-content").forEach(function(c){ c.classList.remove("active"); });
      tab.classList.add("active");
      var pane = document.getElementById(tab.getAttribute("data-target"));
      if(pane) pane.classList.add("active");
      return;
    }
    var op = t.closest && t.closest(".opt");
    if(op){ var ot = op.getAttribute("data-opt"); if(ot) sendText(ot); return; }
    var b = t.closest && t.closest("button[data-act]");
    if(!b) return;
    var act = b.getAttribute("data-act");
    if(act === "default") doSubmit(true);
    else if(act === "custom") doSubmit(false);
  });
  paint();
  setInterval(paint, 1500);
})();
</script>
</body>
</html>
